<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Go Fast - K2 Games</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:54px 1fr 58px;gap:6px;padding:8px;background:linear-gradient(#0f172a,#08111f)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950}.back{color:white;text-decoration:none;font-weight:900;background:#ffffff14;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px}.hud{display:flex;gap:8px;align-items:center}.stat{background:#111827d9;border:1px solid #ffffff24;border-radius:14px;padding:7px 10px;text-align:center;min-width:72px}.label{font-size:.58rem;color:#cbd5e1;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.val{font-weight:950;color:#facc15}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;border:1px solid #ffffff24;border-radius:20px;background:#203040}.overlay{position:absolute;inset:0;background:rgba(8,17,31,.86);display:grid;place-items:center;text-align:center;padding:20px}.modal{width:min(92vw,560px);background:#f8fafc;color:#0f172a;border-radius:24px;padding:24px}.modal h1{font-size:2.7rem;margin:0 0 8px}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}button{border:0;border-radius:13px;background:#1e40af;color:#fff;font-weight:950}.primary{background:#facc15;color:#111827}.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111827;border-radius:999px;padding:7px 13px;font-size:.84rem;font-weight:850;white-space:nowrap}.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#111827dd;border:1px solid #ffffff24;border-radius:999px;padding:8px 14px;font-weight:950;opacity:0;transition:.15s}.toast.show{opacity:1}@media(max-width:760px){.app{grid-template-rows:48px 1fr 50px;padding:6px}.hud{gap:4px}.stat{padding:6px;min-width:55px}.controls{grid-template-columns:repeat(3,1fr)}.tip{font-size:.78rem;white-space:normal;text-align:center;max-width:92vw;width:max-content}.logo{font-size:.9rem}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🏎️ Go Fast</div><div class="hud"><div class="stat"><div class="label">Lap</div><div class="val" id="lap">1/3</div></div><div class="stat"><div class="label">Speed</div><div class="val" id="speed">0</div></div><div class="stat"><div class="label">Time</div><div class="val" id="time">0.0</div></div></div><a class="back" href="index.html">← HUB</a></header>
<section class="stage"><canvas id="game"></canvas><div class="toast" id="toast">CHECKPOINT!</div><div class="tip">Normal racing view: car points up-track. Gas, brake, steer, hit checkpoints in order.</div><div class="overlay" id="overlay"><div class="modal"><h1>🏎️ Go Fast</h1><p>Fixed race-track orientation. This is now a real top-down racing game with checkpoints, laps, grass slowdown, and AI rival.</p><button class="primary" id="start">START RACE</button></div></div></section>
<div class="controls"><button id="left">←</button><button id="right">→</button><button class="primary" id="gas">GAS</button><button id="brake">BRAKE</button><button id="reset">RESET</button></div>
</div>
<script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),lapEl=document.getElementById('lap'),speedEl=document.getElementById('speed'),timeEl=document.getElementById('time'),toast=document.getElementById('toast');let W=960,H=540,DPR=1,last=performance.now(),run=false,keys={},t=0,toastT=0;const track={cx:480,cy:270,rx:330,ry:190,width:88};const cps=[{x:480,y:72},{x:780,y:270},{x:480,y:468},{x:180,y:270}];const car={x:480,y:445,a:-Math.PI/2,v:0,lap:1,cp:0};const ai={x:520,y:445,a:-Math.PI/2,prog:0};function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);scaleTrack()}new ResizeObserver(resize).observe(cv);function scaleTrack(){track.cx=W/2;track.cy=H/2;track.rx=W*.34;track.ry=H*.34;track.width=Math.max(62,Math.min(W,H)*.16);cps[0]={x:W/2,y:H/2-track.ry};cps[1]={x:W/2+track.rx,y:H/2};cps[2]={x:W/2,y:H/2+track.ry};cps[3]={x:W/2-track.rx,y:H/2}}function reset(){car.x=W/2;car.y=H/2+track.ry;car.a=-Math.PI/2;car.v=0;car.lap=1;car.cp=0;ai.prog=0;t=0;run=true;overlay.style.display='none';ui()}function ui(){lapEl.textContent=Math.min(3,car.lap)+'/3';speedEl.textContent=Math.round(Math.abs(car.v)*15);timeEl.textContent=t.toFixed(1)}function show(s){toast.textContent=s;toast.classList.add('show');toastT=.75}function distToTrack(x,y){const dx=(x-track.cx)/track.rx,dy=(y-track.cy)/track.ry;const d=Math.sqrt(dx*dx+dy*dy);return Math.abs(d-1)}function onTrack(x,y){return distToTrack(x,y)<track.width/Math.min(track.rx,track.ry)/2}function checkpoint(){const c=cps[car.cp];if(Math.hypot(car.x-c.x,car.y-c.y)<48){car.cp=(car.cp+1)%cps.length;if(car.cp===0){car.lap++;show(car.lap>3?'FINISH!':'LAP '+car.lap)}else show('CHECKPOINT');if(car.lap>3){run=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='Race Complete!';overlay.querySelector('p').textContent=`Finished in ${t.toFixed(1)} seconds. Track is now right-side-up.`;overlay.querySelector('button').textContent='RACE AGAIN'}}}function drawTrack(){ctx.fillStyle='#166534';ctx.fillRect(0,0,W,H);ctx.fillStyle='#64748b';ctx.beginPath();ctx.ellipse(track.cx,track.cy,track.rx+track.width/2,track.ry+track.width/2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#166534';ctx.beginPath();ctx.ellipse(track.cx,track.cy,track.rx-track.width/2,track.ry-track.width/2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f8fafc';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(track.cx,track.cy,track.rx,track.ry,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([12,12]);ctx.strokeStyle='#facc15';ctx.beginPath();ctx.ellipse(track.cx,track.cy,track.rx,track.ry,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(track.cx-42,track.cy+track.ry);ctx.lineTo(track.cx+42,track.cy+track.ry);ctx.stroke();cps.forEach((p,i)=>{ctx.fillStyle=i===car.cp?'#facc15':'#ffffff66';ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText(i+1,p.x,p.y+4)})}function drawCar(o,color,label){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.a);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-13,-22,26,44,6);ctx.fill();ctx.fillStyle='#111827';ctx.fillRect(-8,-10,16,11);ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(10,-14);ctx.lineTo(-10,-14);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText(label,o.x,o.y+36)}function update(dt){if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}if(!run)return;t+=dt;const steer=(keys.right?1:0)-(keys.left?1:0),gas=keys.gas?1:0,brake=keys.brake?1:0;const grip=onTrack(car.x,car.y)?1:.48;car.v+=(gas*135-brake*95)*dt;car.v*=Math.pow(onTrack(car.x,car.y)?.986:.94,dt*60);car.v=Math.max(-55,Math.min(240,car.v));car.a+=steer*dt*(2.7*(Math.min(1,Math.abs(car.v)/80)))*(car.v>=0?1:-1);car.x+=Math.sin(car.a)*car.v*dt*grip;car.y-=Math.cos(car.a)*car.v*dt*grip;if(car.x<10||car.x>W-10){car.x=Math.max(10,Math.min(W-10,car.x));car.v*=-.35}if(car.y<10||car.y>H-10){car.y=Math.max(10,Math.min(H-10,car.y));car.v*=-.35}checkpoint();ai.prog=(ai.prog+dt*.095)%1;const ang=ai.prog*Math.PI*2+Math.PI/2;ai.x=track.cx+Math.cos(ang)*track.rx;ai.y=track.cy+Math.sin(ang)*track.ry;ai.a=ang+Math.PI/2;ui()}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;drawTrack();update(dt);drawCar(ai,'#ef4444','AI');drawCar(car,'#38bdf8','YOU');requestAnimationFrame(loop)}function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{keys[k]=true;e.preventDefault()});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)}hold('left','left');hold('right','right');hold('gas','gas');hold('brake','brake');document.getElementById('reset').onclick=reset;document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false});resize();requestAnimationFrame(loop)})();
</script>
</body>
</html>
