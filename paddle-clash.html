<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pong - K2 Games</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06263a;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:48px auto 1fr 48px;gap:6px;padding:8px}.top,.score,.setup{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{color:white;text-decoration:none;background:#ffffff12;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px;font-weight:900}.logo{font-weight:950}.score{background:#041827;border:1px solid #ffffff24;border-radius:16px;padding:7px 10px}.score b{font-size:1.25rem}.stage{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;border-radius:18px;border:1px solid #ffffff28;background:#02111d}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button,select{border:0;border-radius:12px;background:#0e7490;color:white;font-weight:950;min-height:40px;padding:0 10px}.primary{background:#facc15;color:#082f49}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,17,29,.86);padding:18px}.modal{background:#f8fafc;color:#082f49;border-radius:24px;padding:22px;width:min(94vw,560px);text-align:center}.setup{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.setup label{font-size:.8rem;font-weight:900}.setup select{width:100%;margin-top:4px;background:#e0f2fe;color:#082f49}.muted{color:#64748b;font-size:.9rem}.progress{font-size:.82rem;color:#bae6fd;font-weight:800}@media(max-width:700px){.app{grid-template-rows:42px auto 1fr 44px;padding:6px}.setup{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}.muted{display:none}}</style></head><body><div class="app"><header class="top"><div class="logo">🏓 Pong</div><a class="back" href="index.html">← HUB</a></header><section class="score"><div>You <b id="p">0</b></div><div><span id="modeTxt">Classic</span> · <span class="progress" id="prog">Round 1</span></div><div>CPU <b id="c">0</b></div></section><section class="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="modal"><h1>Pong</h1><p class="muted">Choose normal, 4-way, or 6-way boards. Multiple balls and progression are tucked here in setup.</p><div class="setup"><label>Board<select id="board"><option value="2">Classic 2-way</option><option value="4">4-way chaos</option><option value="6">6-way hex board</option></select></label><label>Balls<select id="balls"><option value="1">1 ball</option><option value="2">2 balls</option><option value="3">3 balls</option></select></label><label>Progression<select id="progress"><option value="on">On: faster each round</option><option value="off">Off</option></select></label><label>Win Score<select id="win"><option>7</option><option>5</option><option>11</option></select></label></div><button class="primary" id="start">START MATCH</button></div></div></section><div class="controls"><button id="up">▲ Up</button><button id="down">▼ Down</button><button id="restart">Restart</button><button class="primary" id="serve">Serve</button></div></div><script>(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),pEl=document.getElementById('p'),cEl=document.getElementById('c'),modeTxt=document.getElementById('modeTxt'),prog=document.getElementById('prog');let W=960,H=540,DPR=1,last=performance.now(),run=false,round=1,pScore=0,cScore=0,keys={},balls=[],paddle={y:.5},cpu={y:.5};function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}new ResizeObserver(resize).observe(cv);function setup(){round=1;pScore=0;cScore=0;run=true;overlay.style.display='none';spawn();ui()}function spawn(){balls=[];const n=+document.getElementById('balls').value;for(let i=0;i<n;i++){const dir=i%2?1:-1;balls.push({x:W/2,y:H*(.35+.15*i),vx:dir*(4+round*.28),vy:(Math.random()-.5)*4,r:9})}}function ui(){pEl.textContent=pScore;cEl.textContent=cScore;const b=document.getElementById('board').value;modeTxt.textContent=b==='2'?'Classic':b+'-way';prog.textContent='Round '+round}function score(side){side==='p'?pScore++:cScore++;if(pScore>=+document.getElementById('win').value||cScore>=+document.getElementById('win').value){round++;if(document.getElementById('progress').value==='off'){overlay.style.display='grid';run=false}else{pScore=0;cScore=0;spawn()}}else spawn();ui()}function drawBoard(){ctx.fillStyle='#02111d';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff30';ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);const b=document.getElementById('board').value;if(b!=='2'){ctx.strokeStyle='#38bdf855';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke()}if(b==='6'){ctx.strokeStyle='#facc1555';ctx.beginPath();ctx.moveTo(W*.18,H*.08);ctx.lineTo(W*.82,H*.08);ctx.lineTo(W*.97,H/2);ctx.lineTo(W*.82,H*.92);ctx.lineTo(W*.18,H*.92);ctx.lineTo(W*.03,H/2);ctx.closePath();ctx.stroke()}}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;drawBoard();if(run){if(keys.up)paddle.y-=dt*1.4;if(keys.down)paddle.y+=dt*1.4;paddle.y=Math.max(.12,Math.min(.88,paddle.y));const target=balls[0]?.y/H||.5;cpu.y+=(target-cpu.y)*dt*3.3;for(const b of balls){b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;if(b.y<b.r||b.y>H-b.r)b.vy*=-1;const ph=92,pw=14;if(b.x<38&&Math.abs(b.y-paddle.y*H)<ph/2){b.x=38;b.vx=Math.abs(b.vx)*1.03;b.vy+=(b.y-paddle.y*H)*.055}if(b.x>W-38&&Math.abs(b.y-cpu.y*H)<ph/2){b.x=W-38;b.vx=-Math.abs(b.vx)*1.03;b.vy+=(b.y-cpu.y*H)*.055}if(b.x<-20)score('c');if(b.x>W+20)score('p')}}ctx.fillStyle='#38bdf8';ctx.fillRect(18,paddle.y*H-46,14,92);ctx.fillStyle='#fb7185';ctx.fillRect(W-32,cpu.y*H-46,14,92);for(const b of balls){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(loop)}function hold(id,key){const el=document.getElementById(id);el.onpointerdown=()=>keys[key]=true;el.onpointerup=el.onpointerleave=()=>keys[key]=false}hold('up','up');hold('down','down');document.getElementById('start').onclick=setup;document.getElementById('restart').onclick=()=>{overlay.style.display='grid';run=false};document.getElementById('serve').onclick=spawn;addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true});addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false});resize();requestAnimationFrame(loop)})();</script></body></html>
