<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rhino Rampage - K2 Games</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c78f4f;color:#fff8e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:52px 1fr 56px;gap:6px;padding:8px;background:linear-gradient(#f2c879,#b76f35)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950}.back{color:#fff8e8;text-decoration:none;font-weight:900;background:#4a2d1699;border:1px solid #ffffff30;border-radius:999px;padding:8px 12px}.hud{display:flex;gap:8px;align-items:center;justify-content:center}.stat{background:#4a2d16c7;border:1px solid #ffffff25;border-radius:14px;padding:7px 11px;text-align:center;min-width:72px}.label{font-size:.58rem;color:#fed7aa;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.val{font-weight:950;color:#facc15}.stage{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;border-radius:20px;border:1px solid #ffffff25;background:#d69a54}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}button{border:0;border-radius:13px;background:#713f12;color:#fff8e8;font-weight:950}.primary{background:#facc15;color:#321600}.overlay{position:absolute;inset:0;background:rgba(75,43,18,.82);display:grid;place-items:center;text-align:center;padding:20px}.modal{background:#fff7ed;color:#2f1606;border-radius:24px;padding:24px;width:min(92vw,560px)}.modal h1{font-size:2.7rem;margin:0 0 8px}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#2f1606dd;border:1px solid #ffffff30;border-radius:999px;padding:8px 14px;font-weight:950;opacity:0;transition:.15s}.toast.show{opacity:1}.meter{height:7px;background:#ffffff2c;border-radius:999px;overflow:hidden;margin-top:3px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fb923c,#facc15,#fff)}@media(max-width:760px){.app{grid-template-rows:48px 1fr 50px;padding:6px}.hud{gap:5px}.stat{min-width:58px;padding:6px 7px}.controls{grid-template-columns:repeat(3,1fr)}.logo{font-size:.92rem}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🦏 Rhino Rampage</div><div class="hud"><div class="stat"><div class="label">Score</div><div class="val" id="score">0</div></div><div class="stat"><div class="label">Speed</div><div class="val" id="speed">0</div></div><div class="stat"><div class="label">Rage</div><div class="val" id="rage">0%</div><div class="meter"><i id="rageFill"></i></div></div><div class="stat"><div class="label">Lives</div><div class="val" id="lives">3</div></div></div><a class="back" href="index.html">← HUB</a></header>
<section class="stage"><canvas id="game"></canvas><div class="toast" id="toast">SMASH!</div><div class="overlay" id="overlay"><div class="modal"><h1>🦏 Rhino Rampage</h1><p>More responsive steering, cleaner graphics, instant charge feel, and clearer smash/collision feedback.</p><button class="primary" id="start">START RUN</button></div></div></section>
<div class="controls"><button id="left">←</button><button id="right">→</button><button id="gas">GAS</button><button id="brake">BRAKE</button><button class="primary" id="charge">CHARGE</button></div>
</div>
<script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),rageEl=document.getElementById('rage'),rageFill=document.getElementById('rageFill'),livesEl=document.getElementById('lives'),toast=document.getElementById('toast');let W=960,H=540,DPR=1,last=performance.now(),run=false,keys={},score=0,lives=3,rage=0,shake=0,spawn=0,road=0,toastT=0;const rhino={x:.5,y:.76,vx:0,speed:1.8,inv:0};let obs=[],dust=[];function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}new ResizeObserver(resize).observe(cv);function reset(){score=0;lives=3;rage=0;road=0;spawn=0;obs=[];dust=[];rhino.x=.5;rhino.vx=0;rhino.speed=1.8;rhino.inv=0;run=true;overlay.style.display='none';ui()}function ui(){scoreEl.textContent=score;speedEl.textContent=rhino.speed.toFixed(1);rageEl.textContent=Math.floor(rage)+'%';rageFill.style.width=Math.min(100,rage)+'%';livesEl.textContent=lives}function show(t){toast.textContent=t;toast.classList.add('show');toastT=.7}function addObs(){const r=Math.random(),type=r<.46?'crate':r<.78?'rock':'wall';obs.push({x:.12+Math.random()*.76,y:-.12,w:type==='wall'?80:type==='rock'?42:36,h:type==='wall'?34:type==='rock'?38:34,type,hit:false})}function puff(x,y,n){for(let i=0;i<n;i++)dust.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:1,c:Math.random()<.5?'#facc15':'#fed7aa'})}function drawSavanna(){const ox=shake?(Math.random()-.5)*shake:0,oy=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(ox,oy);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f7c873');g.addColorStop(1,'#b86f35');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);ctx.fillStyle='#8b5a2b';ctx.fillRect(W*.18,0,W*.64,H);ctx.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<18;i++){const y=(i*70+road*90)%H;ctx.fillRect(W*.49,y,8,34)}ctx.fillStyle='#6b8e23';for(let i=0;i<22;i++){const y=(i*97+road*70)%H,x=i%2?W*.08:W*.9;ctx.beginPath();ctx.ellipse(x,y,18,30,0,0,Math.PI*2);ctx.fill()}ctx.restore()}function drawRhino(){const x=rhino.x*W,y=rhino.y*H;ctx.save();ctx.translate(x,y);ctx.rotate(rhino.vx*.28);ctx.globalAlpha=rhino.inv>0&&Math.floor(rhino.inv*12)%2?0.55:1;ctx.fillStyle='#7b8794';ctx.beginPath();ctx.ellipse(0,0,44,25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#64748b';ctx.beginPath();ctx.ellipse(33,-5,25,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3ead0';ctx.beginPath();ctx.moveTo(58,-9);ctx.lineTo(86,-2);ctx.lineTo(58,7);ctx.closePath();ctx.fill();ctx.fillStyle='#334155';for(const lx of[-24,-6,16,32])ctx.fillRect(lx,18,9,18);ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(42,-12,4,0,Math.PI*2);ctx.fill();ctx.restore()}function drawObs(o){const x=o.x*W,y=o.y*H;if(o.type==='crate'){ctx.fillStyle='#92400e';ctx.fillRect(x-o.w/2,y-o.h/2,o.w,o.h);ctx.strokeStyle='#fed7aa';ctx.strokeRect(x-o.w/2,y-o.h/2,o.w,o.h);ctx.beginPath();ctx.moveTo(x-o.w/2,y-o.h/2);ctx.lineTo(x+o.w/2,y+o.h/2);ctx.moveTo(x+o.w/2,y-o.h/2);ctx.lineTo(x-o.w/2,y+o.h/2);ctx.stroke()}else if(o.type==='rock'){ctx.fillStyle='#6b7280';ctx.beginPath();ctx.moveTo(x,y-o.h/2);ctx.lineTo(x+o.w/2,y-o.h*.1);ctx.lineTo(x+o.w*.3,y+o.h/2);ctx.lineTo(x-o.w*.45,y+o.h*.3);ctx.lineTo(x-o.w/2,y-o.h*.2);ctx.closePath();ctx.fill();ctx.strokeStyle='#cbd5e1';ctx.stroke()}else{ctx.fillStyle='#7c2d12';ctx.fillRect(x-o.w/2,y-o.h/2,o.w,o.h);ctx.fillStyle='#facc15';ctx.fillRect(x-o.w/2,y-o.h/2,8,o.h);ctx.fillRect(x+o.w/2-8,y-o.h/2,8,o.h)}}function crash(){if(rhino.inv>0)return;lives--;rhino.inv=1.1;rhino.speed=.9;rage=Math.max(0,rage-30);shake=16;show('HIT!');puff(rhino.x*W,rhino.y*H,20);if(lives<=0){run=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='Run Over';overlay.querySelector('p').textContent=`Final score: ${score}. Charge into crates/rocks, avoid walls unless rage is high.`;overlay.querySelector('button').textContent='RUN AGAIN'}}function hit(o){const rx=rhino.x*W,ry=rhino.y*H,ox=o.x*W,oy=o.y*H;return Math.abs(rx-ox)<o.w/2+42&&Math.abs(ry-oy)<o.h/2+24}function smash(o){o.hit=true;const need=o.type==='wall'?85:o.type==='rock'?35:10;if(rage>=need||keys.charge){score+=o.type==='wall'?350:o.type==='rock'?160:80;rage=Math.min(100,rage+(o.type==='crate'?18:10));shake=10;show(o.type==='wall'?'WALL SMASH!':'SMASH!');puff(o.x*W,o.y*H,28)}else crash()}function step(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}drawSavanna();if(run){const steer=(keys.right?1:0)-(keys.left?1:0);const gas=keys.gas?1:0,brake=keys.brake?1:0;rhino.vx+=(steer*.035-rhino.vx)*Math.min(1,dt*11);rhino.x=Math.max(.18,Math.min(.82,rhino.x+rhino.vx*dt*60));rhino.speed+=(1.55+gas*1.2-brake*.8-rhino.speed)*dt*3.6;if(keys.charge)rage=Math.min(100,rage+dt*32);else rage=Math.max(0,rage-dt*5);rhino.inv=Math.max(0,rhino.inv-dt);road+=dt*rhino.speed;spawn-=dt;if(spawn<=0){spawn=.58/Math.max(1,rhino.speed*.52);addObs()}for(const o of obs){o.y+=dt*(.28+rhino.speed*.12);drawObs(o);if(!o.hit&&hit(o))smash(o);if(!o.hit&&o.y>1.08){score+=2;o.hit=true}}obs=obs.filter(o=>!o.hit&&o.y<1.2);score+=Math.floor(dt*8*rhino.speed);ui()}drawRhino();for(const p of dust){p.x+=p.vx;p.y+=p.vy;p.life-=.035;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}dust=dust.filter(p=>p.life>0);shake*=.86;requestAnimationFrame(step)}function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{keys[key]=true;e.preventDefault()});b.addEventListener('pointerup',()=>keys[key]=false);b.addEventListener('pointerleave',()=>keys[key]=false)}hold('left','left');hold('right','right');hold('gas','gas');hold('brake','brake');hold('charge','charge');document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true;if(e.key==='ArrowDown'||e.key==='s')keys.brake=true;if(e.code==='Space')keys.charge=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false;if(e.key==='ArrowDown'||e.key==='s')keys.brake=false;if(e.code==='Space')keys.charge=false});resize();requestAnimationFrame(step)})();
</script>
</body>
</html>
