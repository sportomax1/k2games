<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rim Rush Dunk - K2 Games</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:54px 1fr 58px;gap:6px;padding:8px;background:linear-gradient(#172554,#111827)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950}.back{color:white;text-decoration:none;font-weight:900;background:#ffffff14;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px}.hud{display:flex;gap:8px;align-items:center}.stat{background:#0f172ad9;border:1px solid #ffffff24;border-radius:14px;padding:7px 10px;text-align:center;min-width:72px}.label{font-size:.58rem;color:#bfdbfe;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.val{font-weight:950;color:#facc15}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;border:1px solid #ffffff24;border-radius:20px;background:#1e3a8a}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}button{border:0;border-radius:13px;background:#1d4ed8;color:#fff;font-weight:950}.primary{background:#f97316}.gold{background:#facc15;color:#111827}.overlay{position:absolute;inset:0;background:rgba(17,24,39,.84);display:grid;place-items:center;text-align:center;padding:20px}.modal{background:#f8fafc;color:#111827;border-radius:24px;padding:24px;width:min(92vw,560px)}.modal h1{font-size:2.6rem;margin:0 0 8px}.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#111827dd;border:1px solid #ffffff24;border-radius:999px;padding:8px 14px;font-weight:950;opacity:0;transition:.15s}.toast.show{opacity:1}.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#111827;border-radius:999px;padding:7px 13px;font-size:.84rem;font-weight:850;white-space:nowrap}.meter{height:8px;background:#ffffff26;border-radius:999px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);width:0}@media(max-width:760px){.app{grid-template-rows:48px 1fr 50px;padding:6px}.hud{gap:4px}.stat{padding:6px;min-width:55px}.controls{grid-template-columns:repeat(3,1fr)}.tip{font-size:.78rem;white-space:normal;text-align:center;max-width:92vw;width:max-content}.logo{font-size:.9rem}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🏀 Rim Rush Dunk</div><div class="hud"><div class="stat"><div class="label">Score</div><div class="val" id="score">0</div></div><div class="stat"><div class="label">Combo</div><div class="val" id="combo">1x</div></div><div class="stat"><div class="label">Time</div><div class="val" id="time">60</div></div><div class="stat"><div class="label">Power</div><div class="val" id="pow">0%</div><div class="meter"><i id="powBar"></i></div></div></div><a class="back" href="index.html">← HUB</a></header>
<section class="stage"><canvas id="game"></canvas><div class="toast" id="toast">SWISH!</div><div class="tip">Move, hold Shoot for arc power, Jump near rim for dunk timing.</div><div class="overlay" id="overlay"><div class="modal"><h1>🏀 Rim Rush Dunk</h1><p>Better arcade basketball: real ball arc, rim/backboard bounce, layups, dunks, jump timing, shot power, defense, combo scoring, and cleaner physics.</p><button class="gold" id="start">START JAM</button></div></div></section>
<div class="controls"><button id="left">←</button><button id="right">→</button><button id="jump">JUMP</button><button class="primary" id="shoot">SHOOT</button><button class="gold" id="dunk">DUNK</button></div>
</div>
<script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),timeEl=document.getElementById('time'),powEl=document.getElementById('pow'),powBar=document.getElementById('powBar'),toast=document.getElementById('toast');let W=960,H=540,DPR=1,last=performance.now(),run=false,time=60,score=0,combo=1,comboT=0,toastT=0,keys={},charging=false,power=0;const player={x:210,y:0,vx:0,vy:0,on:false,face:1},def={x:690,y:0,vx:0},ball={x:245,y:0,vx:0,vy:0,r:13,held:true,owner:'p',cool:0};function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ground()}new ResizeObserver(resize).observe(cv);function ground(){player.y=H-74;def.y=H-74;if(ball.held){ball.x=player.x+28;ball.y=player.y-50}}function reset(){time=60;score=0;combo=1;comboT=0;player.x=W*.22;player.vx=0;player.vy=0;def.x=W*.68;ball.held=true;ball.owner='p';power=0;run=true;overlay.style.display='none';ground();ui()}function ui(){scoreEl.textContent=score;comboEl.textContent=combo.toFixed(1)+'x';timeEl.textContent=Math.max(0,Math.ceil(time));powEl.textContent=Math.floor(power)+'%';powBar.style.width=power+'%'}function show(t){toast.textContent=t;toast.classList.add('show');toastT=.75}function rim(){return{x:W*.82,y:H*.35,r:23}}function releaseShot(extra=0){if(!ball.held)return;const r=rim(),dx=r.x-ball.x,dy=r.y-ball.y,dist=Math.hypot(dx,dy);const p=(power+extra)/100;ball.held=false;ball.owner=null;ball.vx=dx/dist*(7.2+4.2*p);ball.vy=-9.8-5.8*p+(dy/H)*2.8;ball.cool=.25;power=0}function dunk(){const r=rim();if(Math.abs(player.x-r.x)<95&&player.y-r.y<210){if(player.on)player.vy=-12;ball.held=false;ball.owner=null;ball.x=r.x-8;ball.y=r.y-18;ball.vx=1.2;ball.vy=5.5;scoreHit('DUNK!',3)}else releaseShot(35)}function scoreHit(label,base){const pts=Math.round(base*combo);score+=pts;combo=Math.min(5,combo+.35);comboT=3;show(label+' +'+pts);ball.held=true;ball.owner='p';player.x=W*.22;player.vx=0;def.x=W*.68;ground()}function miss(){combo=1;show('MISS');ball.held=true;ball.owner='p';player.x=W*.22;def.x=W*.68;ground()}function drawCourt(){ctx.fillStyle='#1e3a8a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c7772e';ctx.fillRect(0,H-98,W,98);ctx.strokeStyle='#f8fafc99';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W*.82,H-98,120,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#111827';ctx.fillRect(W*.82+38,H*.2,12,H*.28);ctx.fillStyle='#f8fafc';ctx.fillRect(W*.82-18,H*.2,74,48);const r=rim();ctx.strokeStyle='#f97316';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,8,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffffff55';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(r.x-18+i*9,r.y+8);ctx.lineTo(r.x-10+i*5,r.y+48);ctx.stroke()}}function drawPlayer(p,color,name){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=color;ctx.fillRect(-14,-54,28,48);ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(0,-68,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-8,-42);ctx.lineTo(-24,-12);ctx.moveTo(8,-42);ctx.lineTo(24,-12);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText(name,0,22);ctx.restore()}function drawBall(){ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7c2d12';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ball.x-ball.r,ball.y);ctx.lineTo(ball.x+ball.r,ball.y);ctx.moveTo(ball.x,ball.y-ball.r);ctx.lineTo(ball.x,ball.y+ball.r);ctx.stroke()}function update(dt){if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}if(!run)return;time-=dt;if(time<=0){run=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='Final Score: '+score;overlay.querySelector('p').textContent='Use shot power for arcs and dunk near the rim for bigger combo points.';overlay.querySelector('button').textContent='PLAY AGAIN'}if(comboT>0){comboT-=dt}else combo=Math.max(1,combo-dt*.35);const ax=(keys.right?1:0)-(keys.left?1:0);player.vx+=(ax*330-player.vx)*dt*10;player.x+=player.vx*dt;player.x=Math.max(30,Math.min(W-80,player.x));player.vy+=28*dt;player.y+=player.vy*dt*60;if(player.y>H-74){player.y=H-74;player.vy=0;player.on=true}else player.on=false;def.x+=(ball.x-def.x)*dt*2.2;def.x=Math.max(W*.5,Math.min(W*.9,def.x));if(charging&&ball.held)power=Math.min(100,power+dt*85);if(ball.held){ball.x=player.x+28;ball.y=player.y-50}else{ball.vy+=.42;ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vx*=Math.pow(.995,dt*60);const r=rim();if(ball.cool>0)ball.cool-=dt;if(ball.x>W*.82+38&&ball.x<W*.82+50&&ball.y>H*.2&&ball.y<H*.48){ball.x=W*.82+36;ball.vx=-Math.abs(ball.vx)*.72}if(ball.cool<=0&&Math.hypot(ball.x-r.x,ball.y-r.y)<r.r+ball.r&&ball.vy>0){if(Math.abs(ball.x-r.x)<18&&ball.y<r.y+12){scoreHit('SWISH!',2)}else{ball.vx*=-.45;ball.vy*=-.55;show('RIM')}}if(ball.y>H-105){ball.y=H-105;ball.vy*=-.62;ball.vx*=.82;if(Math.abs(ball.vy)<2)miss()}if(ball.x<0||ball.x>W||ball.y>H+60)miss();if(Math.abs(ball.x-def.x)<34&&Math.abs(ball.y-(def.y-45))<42&&ball.vy<1){ball.vx*=-.8;ball.vy-=2;show('BLOCKED');combo=1}}ui()}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;drawCourt();update(dt);drawPlayer(def,'#ef4444','CPU');drawPlayer(player,'#38bdf8','YOU');drawBall();requestAnimationFrame(loop)}function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{keys[key]=true;e.preventDefault()});b.addEventListener('pointerup',()=>keys[key]=false);b.addEventListener('pointerleave',()=>keys[key]=false)}hold('left','left');hold('right','right');document.getElementById('jump').onclick=()=>{if(player.on)player.vy=-12};document.getElementById('dunk').onclick=dunk;const shoot=document.getElementById('shoot');shoot.addEventListener('pointerdown',e=>{charging=true;e.preventDefault()});shoot.addEventListener('pointerup',()=>{charging=false;releaseShot(0)});shoot.addEventListener('pointerleave',()=>{if(charging){charging=false;releaseShot(0)}});document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if((e.key==='ArrowUp'||e.key==='w')&&player.on)player.vy=-12;if(e.code==='Space')charging=true;if(e.key==='j')dunk()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.code==='Space'){charging=false;releaseShot(0)}});resize();requestAnimationFrame(loop)})();
</script>
</body>
</html>
