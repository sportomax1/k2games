<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Super Smash Brawl - K2 Games</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:48px auto 1fr 52px;gap:6px;padding:8px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.back{color:#fff;text-decoration:none;font-weight:900;background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:8px 12px}.logo{font-weight:950}.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}.fighter{background:#111827;border:1px solid #ffffff22;border-radius:14px;padding:8px}.row{display:flex;justify-content:space-between;font-size:.8rem;font-weight:900}.bar{height:9px;background:#334155;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444)}#status{display:grid;place-items:center;background:#111827;border:1px solid #ffffff22;border-radius:14px;padding:0 12px;font-weight:950;color:#facc15}canvas{width:100%;height:100%;display:block;background:#020617;border-radius:18px;border:1px solid #ffffff22}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}button{border:0;border-radius:13px;background:#334155;color:#fff;font-weight:950}.primary{background:#facc15;color:#111827}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,6,23,.86);padding:20px;text-align:center}.modal{background:#f8fafc;color:#0f172a;border-radius:24px;padding:24px;width:min(92vw,520px)}.modal button{padding:14px 28px;margin-top:12px;background:#2563eb}@media(max-width:700px){.app{grid-template-rows:42px auto 1fr 48px;padding:6px}.controls{grid-template-columns:repeat(3,1fr)}.logo{font-size:.9rem}.row{font-size:.72rem}}</style></head><body><div class="app"><header><div class="logo">🥊 Super Smash Brawl</div><a class="back" href="index.html">← HUB</a></header><section class="hud"><div class="fighter"><div class="row"><span>You</span><span id="pPct">0%</span></div><div class="bar"><div class="fill" id="pHP"></div></div></div><div id="status">First KO wins</div><div class="fighter"><div class="row"><span>CPU</span><span id="cPct">0%</span></div><div class="bar"><div class="fill" id="cHP"></div></div></div></section><canvas id="game"></canvas><div class="controls"><button id="left">←</button><button id="right">→</button><button id="jump">JUMP</button><button class="primary" id="atk">ATTACK</button><button id="dash">DASH</button><button id="block">BLOCK</button></div></div><div class="overlay" id="start"><div class="modal"><h1>Super Smash Brawl</h1><p>No-scroll arena. Damage percent and health/knockout power are tracked in the HUD.</p><button id="play">START FIGHT</button></div></div><script>(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),start=document.getElementById('start'),pPct=document.getElementById('pPct'),cPct=document.getElementById('cPct'),pHP=document.getElementById('pHP'),cHP=document.getElementById('cHP'),status=document.getElementById('status');let W=960,H=540,DPR=1,last=performance.now(),run=false,keys={};const p={x:250,y:370,vx:0,vy:0,w:36,h:58,dmg:0,face:1,on:false,block:false,c:'#38bdf8'},c={x:700,y:370,vx:0,vy:0,w:36,h:58,dmg:0,face:-1,on:false,block:false,c:'#fb7185'};function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}new ResizeObserver(resize).observe(cv);function reset(){Object.assign(p,{x:250,y:370,vx:0,vy:0,dmg:0,face:1});Object.assign(c,{x:700,y:370,vx:0,vy:0,dmg:0,face:-1});run=true;start.style.display='none';status.textContent='First KO wins'}function hit(a,b,power){if(Math.abs(a.x-b.x)<70&&Math.abs(a.y-b.y)<75){const block=b.block?.45:1;b.dmg+=power*block;b.vx+=a.face*(4+b.dmg*.06)*block;b.vy-=2.5*block;status.textContent=b===c?'CPU hit!':'You got hit!'}}function physics(o,dt){o.vy+=24*dt;o.x+=o.vx*dt*60;o.y+=o.vy*dt*60;o.vx*=.88;if(o.y>H-92){o.y=H-92;o.vy=0;o.on=true}else o.on=false;if(o.x<25||o.x>W-25){if(o.dmg>110){run=false;start.style.display='grid';start.querySelector('h1').textContent=o===p?'CPU WINS':'YOU WIN';start.querySelector('p').textContent=`Final damage: You ${Math.floor(p.dmg)}%, CPU ${Math.floor(c.dmg)}%.`;start.querySelector('button').textContent='REMATCH'}o.x=Math.max(25,Math.min(W-25,o.x));o.vx*=-.4}}function drawF(o,name){ctx.fillStyle=o.c;ctx.fillRect(o.x-o.w/2,o.y-o.h,o.w,o.h);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y-o.h-12,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=o.block?'#facc1588':'#0000';ctx.beginPath();ctx.arc(o.x,o.y-o.h/2,46,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.fillText(name,o.x-16,o.y-o.h-32)}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;ctx.fillStyle='#020617';ctx.fillRect(0,0,W,H);ctx.fillStyle='#334155';ctx.fillRect(90,H-78,W-180,24);ctx.fillStyle='#64748b';ctx.fillRect(W*.42,H-155,W*.16,18);if(run){p.block=keys.block;if(keys.left){p.vx-=.45;p.face=-1}if(keys.right){p.vx+=.45;p.face=1}c.face=p.x>c.x?1:-1;c.vx+=c.face*.18;if(Math.random()<.012&&c.on)c.vy=-11;if(Math.random()<.025)hit(c,p,5);physics(p,dt);physics(c,dt)}drawF(p,'YOU');drawF(c,'CPU');pPct.textContent=Math.floor(p.dmg)+'%';cPct.textContent=Math.floor(c.dmg)+'%';pHP.style.width=Math.max(0,100-p.dmg*.75)+'%';cHP.style.width=Math.max(0,100-c.dmg*.75)+'%';requestAnimationFrame(loop)}function bind(id,down,up){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{keys[down]=true;e.preventDefault()});b.addEventListener('pointerup',()=>keys[down]=false);b.addEventListener('pointerleave',()=>keys[down]=false)}bind('left','left');bind('right','right');bind('block','block');document.getElementById('jump').onclick=()=>{if(p.on)p.vy=-12};document.getElementById('dash').onclick=()=>p.vx+=p.face*7;document.getElementById('atk').onclick=()=>hit(p,c,9);document.getElementById('play').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='Shift')keys.block=true;if(e.key===' '&&p.on)p.vy=-12;if(e.key==='j')hit(p,c,9)});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='Shift')keys.block=false});resize();requestAnimationFrame(loop)})();</script></body></html>
