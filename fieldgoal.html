<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Field Goal Pro - K2 Games</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10233f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:54px 1fr 62px;gap:6px;padding:8px;background:linear-gradient(#60a5fa 0%,#bfdbfe 42%,#15803d 43%,#14532d 100%)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950}.back{color:white;text-decoration:none;font-weight:900;background:#0f172a99;border:1px solid #ffffff30;border-radius:999px;padding:8px 12px}.hud{display:flex;gap:8px}.stat{background:#0f172acc;border:1px solid #ffffff2b;border-radius:14px;padding:7px 10px;text-align:center;min-width:70px}.label{font-size:.58rem;color:#bfdbfe;text-transform:uppercase;font-weight:900}.val{font-weight:950;color:#facc15}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;border-radius:20px;border:1px solid #ffffff30;background:#87ceeb}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{border:0;border-radius:13px;background:#1e40af;color:white;font-weight:950}.primary{background:#facc15;color:#111827}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,23,42,.78);text-align:center;padding:20px}.modal{width:min(92vw,620px);background:#f8fafc;color:#0f172a;border-radius:24px;padding:24px}.modal h1{font-size:2.6rem;margin:0 0 8px}.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0f172add;border:1px solid #ffffff30;border-radius:999px;padding:8px 14px;font-weight:950;opacity:0;transition:.15s}.toast.show{opacity:1}.meter{height:8px;background:#ffffff33;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#facc15}@media(max-width:760px){.app{grid-template-rows:48px 1fr 54px;padding:6px}.hud{gap:4px}.stat{min-width:56px;padding:6px}.controls{grid-template-columns:repeat(2,1fr)}.logo{font-size:.92rem}}</style></head><body><div class="app"><header><div class="logo">🏈 Field Goal Pro</div><div class="hud"><div class="stat"><div class="label">Distance</div><div class="val" id="dist">35 yd</div></div><div class="stat"><div class="label">Angle</div><div class="val" id="ang">0°</div></div><div class="stat"><div class="label">Made</div><div class="val" id="made">0</div></div></div><a class="back" href="index.html">← HUB</a></header><section class="stage"><canvas id="game"></canvas><div class="toast" id="toast">GOOD!</div><div class="overlay" id="overlay"><div class="modal"><h1>🏈 Field Goal Pro</h1><p>Simulates real kicking decisions: distance, hash angle, aim drift, wind, power, and ball arc. Longer kicks need more power and better angle control.</p><button class="primary" id="start">START KICKING</button></div></div></section><div class="controls"><button id="left">Aim Left</button><button id="right">Aim Right</button><button class="primary" id="kick">Hold / Release Kick</button><button id="next">New Spot</button></div></div><script>(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),distEl=document.getElementById('dist'),angEl=document.getElementById('ang'),madeEl=document.getElementById('made'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay');let W=960,H=540,DPR=1,last=performance.now(),made=0,attempt=0,spot={},aim=0,power=0,charging=false,flight=null,toastT=0,wind=0;function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}new ResizeObserver(resize).observe(cv);function newSpot(){const d=22+Math.floor(Math.random()*43);const hash=[-1,0,1][Math.floor(Math.random()*3)];spot={dist:d,hash,angle:hash*(6+d*.11)};aim=-spot.angle*.45;wind=(Math.random()-.5)*10;flight=null;power=0;ui()}function ui(){distEl.textContent=spot.dist+' yd';angEl.textContent=Math.round(aim+spot.angle)+'°';madeEl.textContent=made+'/'+attempt}function show(t){toast.textContent=t;toast.classList.add('show');toastT=1}function kick(){if(flight)return;attempt++;const totalAngle=(aim+spot.angle+wind*.35)*Math.PI/180;const need=42+spot.dist*.92;const p=power;const speed=p*1.18;flight={t:0,x:W*.5+spot.hash*W*.16,y:H*.83,z:0,vx:Math.sin(totalAngle)*speed*.45,vy:-speed*.92,vz:speed*.8,spin:0,power:p,scored:false};power=0;ui()}function judge(){const goalX=W*.5,barY=H*.38,left=goalX-W*.09,right=goalX+W*.09;const x=flight.x,y=flight.y;const enough=flight.power>42+spot.dist*.75;const good=y<barY&&x>left&&x<right&&enough;if(good){made++;show('GOOD from '+spot.dist+'!')}else show(!enough?'SHORT':'WIDE');setTimeout(newSpot,650);ui()}function drawField(){ctx.fillStyle='#8bd3ff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#166534';ctx.fillRect(0,H*.43,W,H*.57);for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#15803d':'#166534';ctx.fillRect(0,H*.43+i*H*.047,W,H*.047)}ctx.strokeStyle='#ffffff99';ctx.lineWidth=2;for(let i=0;i<10;i++){const y=H*.49+i*H*.045;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const gx=W*.5,base=H*.38;ctx.strokeStyle='#facc15';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(gx,base);ctx.lineTo(gx,H*.72);ctx.moveTo(gx-W*.09,base);ctx.lineTo(gx+W*.09,base);ctx.moveTo(gx-W*.09,base);ctx.lineTo(gx-W*.09,H*.12);ctx.moveTo(gx+W*.09,base);ctx.lineTo(gx+W*.09,H*.12);ctx.stroke();const sx=W*.5+spot.hash*W*.16;ctx.fillStyle='#6b3f1d';ctx.fillRect(sx-42,H*.84,84,10);ctx.fillStyle='#fff';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText('Wind '+wind.toFixed(1)+' mph',W*.5,24);ctx.fillText('Hold Kick for power. Aim compensates for hash angle + wind.',W*.5,H-16);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,H*.83);ctx.lineTo(sx+Math.sin((aim+spot.angle)*Math.PI/180)*180,H*.83-150);ctx.stroke();ctx.fillStyle='#ffffffcc';ctx.fillRect(W*.07,H*.1,W*.22,12);ctx.fillStyle='#facc15';ctx.fillRect(W*.07,H*.1,W*.22*power/100,12)}function drawBall(){if(!flight){const sx=W*.5+spot.hash*W*.16;ctx.fillStyle='#7c2d12';ctx.beginPath();ctx.ellipse(sx,H*.82,12,8,0,0,Math.PI*2);ctx.fill();return}ctx.fillStyle='#7c2d12';ctx.beginPath();ctx.ellipse(flight.x,flight.y-flight.z*.28,11,7,flight.spin,0,Math.PI*2);ctx.fill()}function step(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}if(charging&&!flight)power=Math.min(100,power+dt*58);if(flight){flight.t+=dt;flight.x+=flight.vx*dt*60+wind*.04;flight.y+=flight.vy*dt*60;flight.z+=flight.vz*dt*60;flight.vy+=.42*60*dt;flight.vz-=.55*60*dt;flight.spin+=.22;if(!flight.scored&&flight.y<H*.36){flight.scored=true;judge()}if(flight.y>H+90&&!flight.scored){flight.scored=true;judge()}}drawField();drawBall();requestAnimationFrame(step)}document.getElementById('left').onclick=()=>{aim-=1.5;ui()};document.getElementById('right').onclick=()=>{aim+=1.5;ui()};document.getElementById('next').onclick=newSpot;const kb=document.getElementById('kick');kb.addEventListener('pointerdown',e=>{charging=true;e.preventDefault()});kb.addEventListener('pointerup',()=>{charging=false;kick()});kb.addEventListener('pointerleave',()=>{if(charging){charging=false;kick()}});document.getElementById('start').onclick=()=>{overlay.style.display='none';newSpot()};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')aim-=1.5;if(e.key==='ArrowRight')aim+=1.5;if(e.code==='Space')charging=true;ui()});addEventListener('keyup',e=>{if(e.code==='Space'){charging=false;kick()}});resize();newSpot();requestAnimationFrame(step)})();</script></body></html>
