<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Billiards - K2 Games</title>
<style>
:root{--felt:#0f7a46;--rail:#4a2d16;--panel:rgba(9,24,18,.9);--text:#f8fafc;--accent:#facc15}
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102018;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
nav{height:58px;background:#0b1712;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.14)}.logo{font-weight:950;font-size:1.2rem}.back{color:white;text-decoration:none;font-weight:900}
main{height:calc(100% - 58px);display:grid;place-items:center;position:relative;padding:12px;background:radial-gradient(circle,#1f5137,#102018)}
canvas{width:min(96vw,1000px);height:min(62vw,calc(100vh - 150px));max-height:620px;min-height:310px;background:var(--felt);border:18px solid var(--rail);border-radius:32px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.card{background:var(--panel);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:9px 14px;text-align:center}.label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:#cbd5e1;font-weight:900}.val{font-weight:950;font-size:1.15rem;color:white}
.tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#123;border-radius:999px;padding:8px 16px;font-weight:850;text-align:center;max-width:92vw}
.overlay{position:absolute;inset:0;background:rgba(8,20,14,.85);display:grid;place-items:center;text-align:center;padding:22px}.modal{background:#fffdf2;color:#132118;border-radius:24px;padding:26px;max-width:520px;width:min(92vw,520px)}button{border:0;border-radius:999px;background:#0f7a46;color:white;font-weight:950;padding:14px 28px;margin-top:14px;cursor:pointer}
@media(max-width:700px){canvas{border-width:12px;border-radius:22px}.hud{top:10px;left:10px;right:10px}.card{padding:7px 10px}.tip{font-size:.82rem}}
</style>
</head>
<body>
<nav><div class="logo">🎱 Billiards</div><a class="back" href="index.html">← HUB</a></nav>
<main>
 <canvas id="game"></canvas>
 <div class="hud"><div class="card"><div class="label">Balls Left</div><div class="val" id="left">15</div></div><div class="card"><div class="label">Shots</div><div class="val" id="shots">0</div></div><div class="card"><div class="label">Best</div><div class="val" id="best">—</div></div></div>
 <div class="tip">Drag back from the cue ball and release. Pocket all balls. Scratch resets cue ball.</div>
 <div class="overlay" id="start"><div class="modal"><h1>🎱 Billiards</h1><p>Simple 8-ball style arcade pool for K2 Games.</p><button id="play">BREAK</button></div></div>
</main>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),leftEl=document.getElementById('left'),shotsEl=document.getElementById('shots'),bestEl=document.getElementById('best'),start=document.getElementById('start');
let W=900,H=500,DPR=Math.min(devicePixelRatio||1,1.5),balls=[],drag=null,last=performance.now(),shots=0,best=0,playing=false;
try{best=Number(localStorage.getItem('k2-billiards-best')||0)||0}catch(e){}
const colors=['#facc15','#2563eb','#ef4444','#7c3aed','#f97316','#16a34a','#7f1d1d','#111827','#facc15','#2563eb','#ef4444','#7c3aed','#f97316','#16a34a','#7f1d1d'];
function size(){canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
function newGame(){shots=0;playing=true;start.style.display='none';balls=[{num:0,x:225,y:250,vx:0,vy:0,r:12,c:'#fff',pocketed:false}];let sx=610,sy=250,n=1,gap=26;for(let row=0;row<5;row++)for(let col=0;col<=row;col++){balls.push({num:n,x:sx+row*gap,y:sy+(col-row/2)*gap,vx:0,vy:0,r:12,c:colors[n-1],pocketed:false});n++}ui()}
function ui(){const left=balls.filter(b=>b.num>0&&!b.pocketed).length;leftEl.textContent=left;shotsEl.textContent=shots;bestEl.textContent=best||'—';if(left===0&&playing){playing=false;if(!best||shots<best){best=shots;try{localStorage.setItem('k2-billiards-best',best)}catch(e){}}setTimeout(()=>{start.style.display='grid';start.querySelector('h1').textContent='Table Cleared!';start.querySelector('p').textContent=`You cleared it in ${shots} shots.`;start.querySelector('button').textContent='PLAY AGAIN'},400)}}
function pockets(){return[[25,25],[450,18],[875,25],[25,475],[450,482],[875,475]]}
function pos(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
function moving(){return balls.some(b=>!b.pocketed&&Math.hypot(b.vx,b.vy)>.08)}
function down(e){if(!playing||moving())return;const p=pos(e),cue=balls[0];if(Math.hypot(p.x-cue.x,p.y-cue.y)<80){drag={x:p.x,y:p.y,cx:p.x,cy:p.y};e.preventDefault()}}
function move(e){if(drag){const p=pos(e);drag.cx=p.x;drag.cy=p.y;e.preventDefault()}}
function up(e){if(!drag)return;const cue=balls[0],dx=cue.x-drag.cx,dy=cue.y-drag.cy,pow=Math.min(190,Math.hypot(dx,dy));if(pow>8){cue.vx=dx*.085;cue.vy=dy*.085;shots++;ui()}drag=null;e&&e.preventDefault&&e.preventDefault()}
function update(dt){if(!playing)return;for(const b of balls){if(b.pocketed)continue;b.x+=b.vx;b.y+=b.vy;b.vx*=.988;b.vy*=.988;if(Math.hypot(b.vx,b.vy)<.05)b.vx=b.vy=0;if(b.x<b.r+8||b.x>W-b.r-8){b.x=Math.max(b.r+8,Math.min(W-b.r-8,b.x));b.vx*=-.82}if(b.y<b.r+8||b.y>H-b.r-8){b.y=Math.max(b.r+8,Math.min(H-b.r-8,b.y));b.vy*=-.82}for(const p of pockets()){if(Math.hypot(b.x-p[0],b.y-p[1])<24){if(b.num===0){b.x=225;b.y=250;b.vx=b.vy=0}else{b.pocketed=true}ui()}}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.pocketed||b.pocketed)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d&&d<min){let nx=dx/d,ny=dy/d,over=(min-d)/2;a.x-=nx*over;b.x+=nx*over;a.y-=ny*over;b.y+=ny*over;let p=2*(a.vx*nx+a.vy*ny-b.vx*nx-b.vy*ny)/2;a.vx-=p*nx;a.vy-=p*ny;b.vx+=p*nx;b.vy+=p*ny}}}
function draw(){ctx.fillStyle='#0f7a46';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.08)';for(let x=80;x<W;x+=90){ctx.fillRect(x,0,2,H)}ctx.fillStyle='#080808';for(const p of pockets()){ctx.beginPath();ctx.arc(p[0],p[1],27,0,Math.PI*2);ctx.fill()}for(const b of balls){if(b.pocketed)continue;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(b.x+5,b.y+7,b.r*1.05,b.r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=b.num===0?0:2;ctx.stroke();if(b.num>0){ctx.fillStyle='white';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='8px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.num,b.x,b.y)}}if(drag){const cue=balls[0];ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(drag.cx,drag.cy);ctx.stroke();ctx.setLineDash([])}}
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById('play').addEventListener('click',newGame);canvas.addEventListener('pointerdown',down);addEventListener('pointermove',move);addEventListener('pointerup',up);canvas.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up,{passive:false});size();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
