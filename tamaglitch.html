<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tamaglitch — Pocket Pet</title>
<meta name="theme-color" content="#1b2430">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#111820;color:#eef4df}button{font:inherit;touch-action:manipulation}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 15%,#334554,#111820 58%)}
.app{width:min(470px,100%)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.logo{font-weight:1000;font-size:clamp(22px,7vw,34px);letter-spacing:-2px}.logo span{color:#b9ff63}.sub{font-size:10px;color:#9ba9b3}.age{text-align:right;font-size:11px;color:#c6d1d8}
.shell{background:linear-gradient(145deg,#ffdb66,#e49b34);border:4px solid #161b1f;border-radius:46% 46% 42% 42%/28% 28% 52% 52%;padding:28px 28px 24px;box-shadow:0 18px 0 #0a0d10,0 28px 50px #0008}
.screen{position:relative;aspect-ratio:1.16;background:#b7c98a;border:8px solid #242b27;border-radius:16px;box-shadow:inset 0 0 0 3px #75835c;overflow:hidden;color:#26311e}
.sky{position:absolute;inset:0;background:linear-gradient(#cbd99c 0 66%,#9ead75 66%)}.pixels{position:absolute;inset:0;opacity:.11;background-image:linear-gradient(#26311e 1px,transparent 1px),linear-gradient(90deg,#26311e 1px,transparent 1px);background-size:6px 6px}
.hud{position:absolute;left:8px;right:8px;top:7px;display:flex;justify-content:space-between;font-size:10px;font-weight:900;z-index:2}.room{position:absolute;inset:30px 8px 8px;display:grid;place-items:center}
.pet{position:relative;width:116px;height:105px;transition:.2s;filter:drop-shadow(5px 6px 0 #647049)}.body{position:absolute;width:88px;height:75px;left:14px;top:24px;background:#26311e;border-radius:46% 46% 38% 38%}.ear{position:absolute;width:30px;height:36px;top:11px;background:#26311e;transform:rotate(25deg)}.ear.a{left:13px;transform:rotate(-25deg)}.ear.b{right:13px}.eye{position:absolute;width:9px;height:12px;top:48px;background:#cbd99c;z-index:2}.eye.a{left:39px}.eye.b{right:39px}.mouth{position:absolute;width:20px;height:8px;left:48px;top:70px;border-bottom:5px solid #cbd99c;border-radius:50%;z-index:2}.pet.sad .mouth{border-bottom:0;border-top:5px solid #cbd99c}.pet.sleep .eye{height:3px;top:54px}.pet.sleep{transform:translateY(8px) rotate(-4deg)}.pet.sick{animation:wobble .5s infinite alternate}.pet.happy{animation:hop .45s 2}.poop{position:absolute;bottom:12px;right:26px;font-size:25px;filter:grayscale(1);display:none}.poop.show{display:block}.bubble{position:absolute;top:3px;right:5px;background:#e6efbd;border:2px solid #26311e;padding:4px 6px;font-size:9px;font-weight:900;max-width:125px}.bubble:empty{display:none}
@keyframes hop{to{transform:translateY(-14px)}}@keyframes wobble{to{transform:rotate(4deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.stat{font-size:9px;font-weight:900}.bar{height:7px;border:2px solid #26311e;margin-top:2px}.fill{height:100%;background:#26311e}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.act{border:3px solid #222;border-radius:12px;background:#f4c853;color:#1c2220;padding:8px 3px;font-weight:1000;font-size:10px;box-shadow:0 4px 0 #222}.act:active{transform:translateY(3px);box-shadow:0 1px 0 #222}.act .ico{display:block;font-size:20px;margin-bottom:2px}.act.wide{grid-column:span 2}
.note{text-align:center;font-size:9px;color:#9eabb3;margin-top:15px;line-height:1.5}.danger{color:#ff8d72}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:5}.modal.open{display:grid}.card{width:min(420px,100%);background:#202b35;border:2px solid #5b6a76;border-radius:18px;padding:20px}.card h2{margin:0 0 8px}.card p{font-size:12px;color:#bfcbd3;line-height:1.5}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;background:#b9ff63;color:#152015}.choices .secondary{background:#40505d;color:white}.mini{height:150px;background:#b7c98a;border:4px solid #26311e;position:relative;overflow:hidden;margin:12px 0}.target{position:absolute;font-size:34px;cursor:pointer;user-select:none}

.stageLine{display:flex;justify-content:space-between;font-size:11px;font-weight:900;margin-top:15px;color:#20251b}.stageTrack{height:8px;border:2px solid #26311e;margin-top:5px;background:#e7dba0}.stageTrack>div{height:100%;width:0;background:#26311e}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child{grid-column:auto}.stat{font-size:11px}.bar{height:12px;background:#e4e7c8}.fill{transition:width .3s}.act{min-height:53px;font-size:12px}.pet.stage-0 .ear{display:block;width:22px;height:25px;top:15px}.pet.stage-0 .ear.a{left:19px}.pet.stage-0 .ear.b{right:19px}.pet.stage-0 .body{width:76px;height:70px;left:20px;top:29px;border-radius:48%}.pet.stage-0 .eye.a{left:41px}.pet.stage-0 .eye.b{right:41px}.pet.stage-1 .ear{height:32px}.pet.stage-2 .ear{height:39px}.pet.stage-3 .ear{height:44px;width:35px}.pet.rest{transform:translateY(5px)}.mini{height:185px;display:grid;place-items:center;border-radius:12px}.gameBtns{display:flex;gap:10px;justify-content:center;align-items:center}.gameBtns button{border:3px solid #26311e;border-radius:10px;background:#e9f0be;color:#26311e;font-size:22px;min-width:64px;min-height:60px;cursor:pointer}.gameBtns button:focus-visible,.act:focus-visible{outline:3px solid #fff;outline-offset:3px}.gameBtns button:active{transform:scale(.94)}.card button{cursor:pointer}.bubble{max-width:155px}.pet.happy{animation:hop .45s 2}
</style></head>
<body><main class="app">
<div class="top"><div><div class="logo">TAMA<span>GLITCH</span></div><div class="sub">a suspiciously familiar pocket pal</div></div><div class="age" id="age"></div></div>
<section class="shell"><div class="screen"><div class="sky"></div><div class="pixels"></div><div class="hud"><span id="name">GLITCH</span><span id="clock"></span></div><div class="room">
<div class="bubble" id="bubble"></div><div class="pet" id="pet"><i class="ear a"></i><i class="ear b"></i><i class="body"></i><i class="eye a"></i><i class="eye b"></i><i class="mouth"></i></div><div class="poop" id="poop">●</div></div></div>
<div class="stageLine" id="stageLine"></div><div class="stageTrack"><div id="stageFill"></div></div><div class="stats" id="stats"></div>
<div class="actions">
<button class="act" data-a="feed">FEED</button><button class="act" data-a="play">PLAY</button><button class="act" data-a="clean">CLEAN</button><button class="act" data-a="med">MED</button>
<button class="act" data-a="rest">REST</button><button class="act" data-a="sleep">SLEEP / WAKE</button><button class="act wide" data-a="info">INFO / RESET</button>
</div></section><div class="note">Relaxed care: progress in short sessions, with no daily check-in required.</div></main>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<script>
const KEY='k2_tamaglitch_v1', clamp=n=>Math.max(0,Math.min(100,n)), now=()=>Date.now();
const STAGES=['Baby','Child','Teen','Adult'], STAGE_HOURS=[0,.15,.65,1.7];
const fresh=()=>({name:'GLITCH',born:now(),last:now(),hunger:82,happy:78,clean:90,energy:88,health:100,sick:false,sleep:false,waste:0,care:0,stage:0,playCount:0});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=fresh()}
if(!Number.isFinite(s.born)||s.born>now())s.born=now();
if(!Number.isFinite(s.last)||s.last>now())s.last=now();
const $=id=>document.getElementById(id), save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
function stageInfo(){const hours=Math.max(0,(now()-s.born)/36e5)+Math.max(0,s.care||0)*.055;let stage=0;for(let i=1;i<STAGE_HOURS.length;i++)if(hours>=STAGE_HOURS[i])stage=i;const progress=stage===STAGES.length-1?100:clamp((hours-STAGE_HOURS[stage])/(STAGE_HOURS[stage+1]-STAGE_HOURS[stage])*100);return {stage,progress,hours};}
function catchup(){const h=Math.min(12,Math.max(0,(now()-s.last)/36e5));if(!h)return;
s.hunger=clamp(s.hunger-h*1.6);s.happy=clamp(s.happy-h*.8);s.clean=clamp(s.clean-h*(s.waste?1.3:.55));
s.energy=clamp(s.energy+h*(s.sleep?22:3.5));if(!s.sleep&&h>2&&s.waste===0)s.waste=1;
if(s.hunger<12||s.clean<12){s.health=clamp(s.health-h*1.2)}else s.health=clamp(s.health+h*1.8);
s.sick=s.health<40;
s.stage=stageInfo().stage;s.last=now();
}
catchup();
const labels=[['hunger','FULLNESS'],['happy','HAPPINESS']];
function say(t){$('bubble').textContent=t;clearTimeout(say.timer);say.timer=setTimeout(()=>$('bubble').textContent='',2600)}
function render(){const age=(now()-s.born)/36e5,info=stageInfo();s.stage=info.stage;
$('age').textContent=STAGES[s.stage]+' · '+(age<1?Math.round(age*60)+' min':age.toFixed(1)+' hr');
$('name').textContent=s.name;$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
$('stageLine').textContent=STAGES[s.stage]+(s.stage===STAGES.length-1?' · Fully grown':' · '+Math.round(info.progress)+'% to '+STAGES[s.stage+1]);
$('stageFill').style.width=info.progress+'%';
$('stats').innerHTML=labels.map(([k,l])=>'<div class="stat">'+l+' <span style="float:right">'+Math.round(s[k])+'%</span><div class="bar" role="progressbar" aria-label="'+l+'" aria-valuenow="'+Math.round(s[k])+'" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:'+s[k]+'%"></div></div></div>').join('');
const p=$('pet');p.className='pet stage-'+s.stage+' '+(s.sleep?'sleep ':s.sick?'sick ':s.happy>75?'happy ':'')+(s.happy<30||s.hunger<20?'sad':'');p.style.scale=(.83+s.stage*.065);
$('poop').classList.toggle('show',s.waste>0);}
function act(a){
if(a==='feed'){if(s.sleep)return say('Sleeping. Wake me first.');if(s.hunger>92)return say('I am already full!');s.hunger=clamp(s.hunger+24);s.health=clamp(s.health+2);s.care++;say(s.hunger>90?'Delicious! I am full.':'Yum! More food, please.')}
if(a==='clean'){s.clean=clamp(s.clean+45);s.waste=0;s.care++;say('All clean!')}
if(a==='med'){if(s.sick||s.health<65){s.health=clamp(s.health+38);s.sick=s.health<40;s.care++;say(s.sick?'Still feeling unwell.':'Medicine helped. Feeling better!')}else say('No medicine needed. I am healthy!')}
if(a==='sleep'){s.sleep=!s.sleep;s.care++;if(!s.sleep)s.energy=clamp(s.energy+16);say(s.sleep?'Resting now.':'Awake and refreshed!')}
if(a==='play'){if(s.sleep)return say('Wake me to play.');openGame()}
if(a==='rest'){s.energy=clamp(s.energy+30);s.care++;say('That rest helped!')}
if(a==='info')openInfo();s.last=now();save();render();
}
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));
function closeModal(){$('modal').classList.remove('open')}
function openGame(){const m=$('modal'),c=$('modalCard');m.classList.add('open');
let rounds=0,points=0,sequence=[],locked=false;const symbols=['LEFT','RIGHT','UP'];
function next(){if(rounds>=5){s.happy=clamp(s.happy+12+points*4);s.energy=clamp(s.energy-8);s.care++;s.playCount=(s.playCount||0)+1;s.last=now();save();c.innerHTML='<h2>Playtime complete!</h2><p>'+points+' of 5 correct. Happiness increased and your pet enjoyed playing.</p><div class="choices"><button id="done">DONE</button></div>';$('done').onclick=()=>{closeModal();render()};return;}
locked=false;const answer=Math.floor(Math.random()*3);sequence.push(answer);
c.innerHTML='<h2>Copy the Move</h2><p>Round '+(rounds+1)+' of 5. Choose the direction shown. Play anytime to boost happiness.</p><div class="mini"><div style="text-align:center"><div style="font-size:13px;font-weight:bold;margin-bottom:12px">MOVE: '+symbols[answer]+'</div><div class="gameBtns"><button data-dir="0" aria-label="Left">←</button><button data-dir="2" aria-label="Up">↑</button><button data-dir="1" aria-label="Right">→</button></div></div></div><div class="choices"><button class="secondary" id="quit">FINISH EARLY</button></div>';
$('quit').onclick=()=>{rounds=5;next()};c.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;if(+b.dataset.dir===answer)points++;rounds++;next()});}
next();}
function openInfo(){const m=$('modal'),c=$('modalCard');c.innerHTML='<h2>'+s.name.replace(/[&<>"]/g,'')+'</h2><p>Life stage: '+STAGES[s.stage]+'<br>Care actions: '+s.care+'<br>Games played: '+(s.playCount||0)+'<br>Born: '+new Date(s.born).toLocaleString()+'<br>Energy recovers while resting, even when awake. Sleeping restores it faster.</p><div class="choices"><button id="rest">QUICK REST</button><button id="rename">RENAME</button><button class="secondary" id="reset">NEW PET</button><button class="secondary" id="close">CLOSE</button></div>';m.classList.add('open');
$('close').onclick=closeModal;
$('rest').onclick=()=>{s.energy=clamp(s.energy+30);s.care++;s.last=now();save();closeModal();say('That rest helped!');render()};
$('rename').onclick=()=>{let n=prompt('Pet name?',s.name);if(n&&n.trim()){s.name=n.trim().slice(0,12).toUpperCase();s.last=now();save();closeModal();render()}};
$('reset').onclick=()=>{if(confirm('Start over with a new pet?')){s=fresh();save();closeModal();render()}};}
setInterval(()=>{catchup();save();render()},30000);
window.addEventListener('pagehide',()=>{catchup();save()});
save();render();
</script></body></html>
