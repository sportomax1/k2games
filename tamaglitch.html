<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tamaglitch — Pocket Pet</title>
<meta name="theme-color" content="#1b2430">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#111820;color:#eef4df}button{font:inherit;touch-action:manipulation}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 15%,#334554,#111820 58%)}
.app{width:min(470px,100%)}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.logo{font-weight:1000;font-size:clamp(22px,7vw,34px);letter-spacing:-2px}.logo span{color:#b9ff63}.sub{font-size:10px;color:#9ba9b3}.age{text-align:right;font-size:11px;color:#c6d1d8}
.shell{background:linear-gradient(145deg,#ffdb66,#e49b34);border:4px solid #161b1f;border-radius:46% 46% 42% 42%/28% 28% 52% 52%;padding:28px 28px 24px;box-shadow:0 18px 0 #0a0d10,0 28px 50px #0008}
.screen{position:relative;aspect-ratio:1.16;background:#b7c98a;border:8px solid #242b27;border-radius:16px;box-shadow:inset 0 0 0 3px #75835c;overflow:hidden;color:#26311e}
.sky{position:absolute;inset:0;background:linear-gradient(#cbd99c 0 66%,#9ead75 66%)}.pixels{position:absolute;inset:0;opacity:.11;background-image:linear-gradient(#26311e 1px,transparent 1px),linear-gradient(90deg,#26311e 1px,transparent 1px);background-size:6px 6px}
.hud{position:absolute;left:8px;right:8px;top:7px;display:flex;justify-content:space-between;font-size:10px;font-weight:900;z-index:2}.room{position:absolute;inset:30px 8px 8px;display:grid;place-items:center}
.pet{position:relative;width:116px;height:105px;transition:.2s;filter:drop-shadow(5px 6px 0 #647049)}.body{position:absolute;width:88px;height:75px;left:14px;top:24px;background:#26311e;border-radius:46% 46% 38% 38%}.ear{position:absolute;width:30px;height:36px;top:11px;background:#26311e;transform:rotate(25deg)}.ear.a{left:13px;transform:rotate(-25deg)}.ear.b{right:13px}.eye{position:absolute;width:9px;height:12px;top:48px;background:#cbd99c;z-index:2}.eye.a{left:39px}.eye.b{right:39px}.mouth{position:absolute;width:20px;height:8px;left:48px;top:70px;border-bottom:5px solid #cbd99c;border-radius:50%;z-index:2}.pet.sad .mouth{border-bottom:0;border-top:5px solid #cbd99c}.pet.sleep .eye{height:3px;top:54px}.pet.sleep{transform:translateY(8px) rotate(-4deg)}.pet.sick{animation:wobble .5s infinite alternate}.pet.happy{animation:hop .45s 2}.poop{position:absolute;bottom:12px;right:26px;font-size:25px;filter:grayscale(1);display:none}.poop.show{display:block}.bubble{position:absolute;top:3px;right:5px;background:#e6efbd;border:2px solid #26311e;padding:4px 6px;font-size:9px;font-weight:900;max-width:125px}.bubble:empty{display:none}
@keyframes hop{to{transform:translateY(-14px)}}@keyframes wobble{to{transform:rotate(4deg)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.stat{font-size:9px;font-weight:900}.bar{height:7px;border:2px solid #26311e;margin-top:2px}.fill{height:100%;background:#26311e}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.act{border:3px solid #222;border-radius:12px;background:#f4c853;color:#1c2220;padding:8px 3px;font-weight:1000;font-size:10px;box-shadow:0 4px 0 #222}.act:active{transform:translateY(3px);box-shadow:0 1px 0 #222}.act .ico{display:block;font-size:20px;margin-bottom:2px}.act.wide{grid-column:span 2}
.note{text-align:center;font-size:9px;color:#9eabb3;margin-top:15px;line-height:1.5}.danger{color:#ff8d72}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:5}.modal.open{display:grid}.card{width:min(420px,100%);background:#202b35;border:2px solid #5b6a76;border-radius:18px;padding:20px}.card h2{margin:0 0 8px}.card p{font-size:12px;color:#bfcbd3;line-height:1.5}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900;background:#b9ff63;color:#152015}.choices .secondary{background:#40505d;color:white}.mini{height:150px;background:#b7c98a;border:4px solid #26311e;position:relative;overflow:hidden;margin:12px 0}.target{position:absolute;font-size:34px;cursor:pointer;user-select:none}
</style></head>
<body><main class="app">
<div class="top"><div><div class="logo">TAMA<span>GLITCH</span></div><div class="sub">a suspiciously familiar pocket pal</div></div><div class="age" id="age"></div></div>
<section class="shell"><div class="screen"><div class="sky"></div><div class="pixels"></div><div class="hud"><span id="name">GLITCH</span><span id="clock"></span></div><div class="room">
<div class="bubble" id="bubble"></div><div class="pet" id="pet"><i class="ear a"></i><i class="ear b"></i><i class="body"></i><i class="eye a"></i><i class="eye b"></i><i class="mouth"></i></div><div class="poop" id="poop">♟</div></div></div>
<div class="stats" id="stats"></div>
<div class="actions">
<button class="act" data-a="feed"><span class="ico">🍙</span>FEED</button><button class="act" data-a="play"><span class="ico">🎾</span>PLAY</button><button class="act" data-a="clean"><span class="ico">🫧</span>CLEAN</button><button class="act" data-a="med"><span class="ico">💊</span>MED</button>
<button class="act wide" data-a="sleep"><span class="ico">🌙</span>SLEEP / WAKE</button><button class="act wide" data-a="info"><span class="ico">⚙️</span>INFO / RESET</button>
</div></section><div class="note">Your pet keeps living while you're away. Care stats decay with real time.<br><span class="danger">Neglect can make it sick, but this creature is forgiving.</span></div>
</main>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<script>
const KEY='k2_tamaglitch_v1', clamp=n=>Math.max(0,Math.min(100,n)), now=()=>Date.now();
const fresh=()=>({name:'GLITCH',born:now(),last:now(),hunger:82,happy:78,clean:90,energy:88,health:100,sick:false,sleep:false,waste:0,care:0,stage:0});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=fresh()}
const save=()=>{s.last=now();localStorage.setItem(KEY,JSON.stringify(s))};
function catchup(){let h=Math.min(72,(now()-s.last)/36e5);if(h<=0)return;s.hunger=clamp(s.hunger-h*3.2);s.happy=clamp(s.happy-h*1.8);s.clean=clamp(s.clean-h*(s.waste?3:1));s.energy=clamp(s.energy+(s.sleep?h*9:-h*2));if(!s.sleep&&Math.random()<Math.min(.8,h*.12))s.waste=Math.min(3,s.waste+1);if(s.hunger<20||s.clean<18||s.energy<10){s.health=clamp(s.health-h*4);s.sick=s.health<70}else if(!s.sick)s.health=clamp(s.health+h);s.stage=Math.min(3,Math.floor((now()-s.born)/864e5));}
catchup();
const labels=[['hunger','FULL'],['happy','HAPPY'],['clean','CLEAN'],['energy','ENERGY'],['health','HEALTH']];
function say(t){let b=document.querySelector('#bubble');b.textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>b.textContent='',2200)}
function render(){let days=(now()-s.born)/864e5;document.querySelector('#age').textContent='AGE '+days.toFixed(1)+' DAYS';document.querySelector('#name').textContent=s.name;document.querySelector('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
document.querySelector('#stats').innerHTML=labels.map(([k,l])=>'<div class="stat">'+l+' '+Math.round(s[k])+'<div class="bar"><div class="fill" style="width:'+s[k]+'%"></div></div></div>').join('');
let p=document.querySelector('#pet');p.className='pet '+(s.sleep?'sleep ':s.sick?'sick ':s.happy>72?'happy ':'')+(s.happy<30||s.hunger<20?'sad':'');p.style.transform+=' scale('+(1+s.stage*.07)+')';document.querySelector('#poop').classList.toggle('show',s.waste>0);save()}
function act(a){if(a==='feed'){if(s.sleep)return say('zzz...');s.hunger=clamp(s.hunger+24);s.clean=clamp(s.clean-2);s.care++;say('NOM!')}
if(a==='clean'){s.clean=clamp(s.clean+38);s.waste=0;s.care++;say('SPARKLY!')}
if(a==='med'){if(s.sick||s.health<90){s.health=clamp(s.health+35);s.sick=false;s.care++;say('BETTER!')}else say('I FEEL FINE!')}
if(a==='sleep'){s.sleep=!s.sleep;s.care++;say(s.sleep?'GOOD NIGHT':'GOOD MORNING')}
if(a==='play'){if(s.sleep)return say('zzz...');openGame()}
if(a==='info')openInfo();render()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
function openGame(){let m=document.querySelector('#modal'),c=document.querySelector('#modalCard');c.innerHTML='<h2>Bug Chase</h2><p>Tap the bug 5 times before time runs out.</p><div class="mini" id="mini"></div><p id="score">0 / 5</p>';m.classList.add('open');let q=0,end=Date.now()+7000,box=document.querySelector('#mini');
function spawn(){if(Date.now()>end){finish(false);return}box.innerHTML='<span class="target">🐛</span>';let t=box.firstChild;t.style.left=Math.random()*80+'%';t.style.top=Math.random()*65+'%';t.onclick=()=>{q++;document.querySelector('#score').textContent=q+' / 5';q>=5?finish(true):spawn()}}function finish(win){if(!m.classList.contains('open'))return;if(win){s.happy=clamp(s.happy+30);s.energy=clamp(s.energy-10);s.care++;save();c.innerHTML='<h2>You got them!</h2><p>'+s.name+' is thrilled.</p><div class="choices"><button id="done">DONE</button></div>';document.querySelector('#done').onclick=()=>{m.classList.remove('open');render()}}else{c.innerHTML='<h2>Bug escaped!</h2><div class="choices"><button id="done">OK</button></div>';document.querySelector('#done').onclick=()=>m.classList.remove('open')}}spawn();setTimeout(()=>{if(q<5)finish(false)},7100)}
function openInfo(){let m=document.querySelector('#modal'),c=document.querySelector('#modalCard');c.innerHTML='<h2>'+s.name+'</h2><p>Care actions: '+s.care+'<br>Life stage: '+['Baby','Sprout','Critter','Elder'][s.stage]+'<br>Born: '+new Date(s.born).toLocaleString()+'</p><div class="choices"><button id="rename">RENAME</button><button class="secondary" id="reset">NEW PET</button><button class="secondary" id="close">CLOSE</button></div>';m.classList.add('open');document.querySelector('#close').onclick=()=>m.classList.remove('open');document.querySelector('#rename').onclick=()=>{let n=prompt('Pet name?',s.name);if(n){s.name=n.trim().slice(0,12).toUpperCase();save();render();m.classList.remove('open')}};document.querySelector('#reset').onclick=()=>{if(confirm('Start over with a new pet?')){s=fresh();save();render();m.classList.remove('open')}}}
setInterval(()=>{let elapsed=(now()-s.last)/36e5;if(elapsed>.02){catchup();render()}else document.querySelector('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},30000);
render();
</script></body></html>
