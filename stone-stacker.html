<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071019"><title>Stone Stacker</title><script src="stone-stacker-boost.js" defer></script>
<style>
:root{--ink:#f5f2e9;--muted:#b7c2c5;--gold:#efc365}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#03070b;color:var(--ink);font-family:Inter,system-ui,sans-serif}body{touch-action:none;user-select:none}.game{position:relative;isolation:isolate;width:min(100vw,880px);height:100dvh;margin:auto;overflow:hidden;background:#071019 url('assets/stone-stacker-valley.png') center/cover no-repeat}.game:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0710192b 0%,#07101954 54%,#02060999 100%);z-index:0}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}.hud{position:absolute;inset:0 0 auto;z-index:3;display:grid;grid-template-columns:repeat(4,1fr) auto;align-items:start;padding:max(18px,env(safe-area-inset-top)) 18px 0;text-shadow:0 2px 16px #000;pointer-events:none}.stat{text-align:center;border-right:1px solid #f5f2e933}.stat:first-child{text-align:left}.stat:nth-child(4){border:0}.label{color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}.value{margin-top:3px;font-size:clamp(20px,4.8vw,34px);font-weight:850;font-variant-numeric:tabular-nums}#combo{color:var(--gold)}.icon{pointer-events:auto;inline-size:48px;block-size:48px;border:1px solid #f5f2e955;border-radius:50%;background:#071019b8;color:var(--ink);font-size:20px;font-weight:800;box-shadow:0 8px 26px #0007}.controls{position:absolute;z-index:4;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px}button{appearance:none;cursor:pointer;font:800 13px/1 Inter,system-ui,sans-serif;letter-spacing:.08em}.drop,.play{border:1px solid #ffe1a1;border-radius:18px;padding:17px 24px;background:linear-gradient(135deg,#f2ce79,#b17b32);color:#191107;box-shadow:0 12px 28px #0008,inset 0 1px #fff8}.drop{min-width:190px}.drop:active{transform:translateY(2px) scale(.99)}.toast{position:absolute;z-index:5;top:25%;left:50%;transform:translate(-50%,-50%);opacity:0;color:#ffe1a0;font-weight:900;font-size:clamp(22px,5vw,34px);letter-spacing:.14em;text-shadow:0 3px 22px #000;pointer-events:none}.toast.show{animation:pop .9s ease-out both}@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.72)}18%{opacity:1}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.08)}}.overlay{position:absolute;z-index:8;inset:0;display:grid;place-items:center;padding:24px;background:#02070bbd;backdrop-filter:blur(6px)}.overlay.hidden{display:none}.card{width:min(92vw,470px);padding:33px 27px;text-align:center;border:1px solid #f5f2e93d;border-radius:26px;background:#071019e8;box-shadow:0 28px 90px #000b}h1{margin:0;font:900 clamp(44px,10vw,72px)/.78 Georgia,serif;letter-spacing:-.055em}h1 span{display:block;margin-top:13px;color:var(--gold);font:800 .4em/1 Inter,system-ui,sans-serif;letter-spacing:.43em}p{margin:26px auto 20px;max-width:370px;color:#c1ccca;line-height:1.55}.play{min-width:150px;padding:15px 23px}.hint{margin:18px 0 0;color:#9caaa9;font-size:12px}.final-score{margin:16px 0 0;color:var(--gold);font-size:66px;font-weight:900;font-variant-numeric:tabular-nums}@media(max-width:520px){.hud{grid-template-columns:repeat(4,1fr);gap:8px;padding-inline:14px}.hud .icon{display:none}.stat{border:0}.label{font-size:9px}.value{font-size:22px}.controls{gap:8px}.drop{min-width:172px;padding:16px}.icon{inline-size:44px;block-size:44px}}@media(prefers-reduced-motion:reduce){.toast.show{animation:none;opacity:1}}
</style></head><body>
<main class="game" id="game" aria-label="Stone Stacker game"><canvas id="canvas" aria-hidden="true"></canvas><section class="hud" aria-live="polite"><div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div><div class="stat"><div class="label">Combo</div><div class="value" id="combo">×1</div></div><div class="stat"><div class="label">Height</div><div class="value" id="height">0</div></div><button class="icon" id="pause" aria-label="Pause game">Ⅱ</button></section><div class="toast" id="toast">PERFECT</div><div class="controls"><button class="icon" id="restart" aria-label="Restart game">↻</button><button class="drop" id="drop">DROP STONE</button></div><section class="overlay" id="intro"><div class="card"><h1>STONE<span>STACKER</span></h1><p>Release a swinging stone. Land close to the center to build your combo—then hold your nerve as the tower narrows.</p><button class="play" id="play">PLAY</button><p class="hint">Tap / click / Space to drop · R to restart · P to pause</p></div></section><section class="overlay hidden" id="over"><div class="card"><div class="label">Tower toppled</div><div class="final-score" id="final-score">0</div><p id="summary">0 stones stacked</p><button class="play" id="again">STACK AGAIN</button></div></section></main>
<script>(()=>{const $=s=>document.querySelector(s),game=$('#game'),canvas=$('#canvas'),ctx=canvas.getContext('2d'),scoreEl=$('#score'),bestEl=$('#best'),comboEl=$('#combo'),heightEl=$('#height'),toast=$('#toast');let W=0,H=0,dpr=1,stones=[],swing=null,falling=null,particles=[],score=0,combo=1,height=0,best=+(localStorage.stoneStackerBest||0),running=false,paused=false,last=0,shake=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!stones.length)reset(false)}function stone(x,y,w,h,rot=0){return{x,y,w,h,rot,vx:0,vy:0,vr:0,seed:Math.random()*999}}function reset(start=true){stones=[stone(W/2,H-104,Math.min(W*.56,330),38)];swing=null;falling=null;particles=[];score=0;combo=1;height=0;shake=0;makeSwing();sync();running=start;paused=false;$('#pause').textContent='Ⅱ';$('#over').classList.add('hidden')}function makeSwing(){let n=stones.length-1,w=clamp(154-n*5.5,70,154)*rand(.88,1.12);swing={cx:W/2,cy:116,len:Math.min(W*.28,174),angle:rand(-.72,-.46),dir:1,speed:1.15+n*.045,w,h:clamp(w*.35,27,50),seed:Math.random()*999}}function sync(){scoreEl.textContent=score.toLocaleString();bestEl.textContent=best.toLocaleString();comboEl.textContent='×'+combo;heightEl.textContent=height}function pop(t){toast.textContent=t;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}function burst(x,y,n,gold=false){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-145,145),vy:rand(-160,-30),life:rand(.35,.85),r:rand(1.5,4),gold})}function drop(){if(!running||paused||falling||!swing)return;let s=swing;falling=stone(s.cx+Math.sin(s.angle)*s.len,s.cy+Math.cos(s.angle)*s.len,s.w,s.h,s.angle*.13);falling.vx=Math.cos(s.angle)*s.dir*40;falling.vy=44;falling.vr=s.dir*.32;swing=null}function end(){running=false;falling=null;swing=null;best=Math.max(best,score);localStorage.stoneStackerBest=best;sync();$('#final-score').textContent=score.toLocaleString();$('#summary').textContent=`${height} ${height===1?'stone':'stones'} stacked · best combo ×${combo}`;$('#over').classList.remove('hidden')}function stable(){for(let i=0;i<stones.length-1;i++){let s=stones[i],above=stones.slice(i+1),mass=0,moment=0;above.forEach(a=>{let m=a.w*a.h;mass+=m;moment+=a.x*m});let center=moment/mass,t=s.w*.07;if(center<s.x-s.w/2-t||center>s.x+s.w/2+t)return false}return true}function land(){let top=stones.at(-1),overlap=Math.min(falling.x+falling.w/2,top.x+top.w/2)-Math.max(falling.x-falling.w/2,top.x-top.w/2);if(overlap<falling.w*.23){end();return}let err=Math.abs(falling.x-top.x),perfect=Math.max(9,Math.min(top.w,falling.w)*.095);falling.y=top.y-top.h/2-falling.h/2;if(err<perfect){combo=Math.min(combo+1,10);falling.x+=(top.x-falling.x)*.55;pop(`PERFECT ×${combo}`);navigator.vibrate?.(12);burst(falling.x,falling.y,16,true);shake=5}else{combo=1;burst(falling.x,falling.y,7);shake=2}stones.push(falling);falling=null;height++;score+=Math.round((90+overlap/falling.w*160)*combo);if(!stable()){shake=13;setTimeout(end,200);return}if(stones.length>7){let lift=Math.min(H*.055,48);stones.forEach(s=>s.y+=lift)}sync();setTimeout(()=>running&&makeSwing(),260)}function update(dt){if(!running||paused)return;if(swing){swing.angle+=swing.dir*swing.speed*dt;if(Math.abs(swing.angle)>.74){swing.angle=Math.sign(swing.angle)*.74;swing.dir*=-1}}if(falling){falling.vy+=940*dt;falling.x+=falling.vx*dt;falling.y+=falling.vy*dt;falling.rot+=falling.vr*dt;let top=stones.at(-1),contact=top.y-top.h/2-falling.h/2;if(falling.vy>0&&falling.y>=contact)land();if(falling&&falling.y>H+90)end()}particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt});particles=particles.filter(p=>p.life>0);shake*=Math.pow(.045,dt)}function rock(s){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.beginPath();for(let i=0;i<11;i++){let a=Math.PI*2*i/11,r=1+Math.sin(s.seed+i*4.77)*.07,x=Math.cos(a)*s.w/2*r,y=Math.sin(a)*s.h/2*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();let g=ctx.createLinearGradient(-s.w*.45,-s.h*.5,s.w*.5,s.h*.5);g.addColorStop(0,'#b6b3a7');g.addColorStop(.24,'#716f68');g.addColorStop(.7,'#383b3b');g.addColorStop(1,'#182329');ctx.fillStyle=g;ctx.shadowColor='#000b';ctx.shadowBlur=10;ctx.shadowOffsetY=5;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#e5dfc955';ctx.lineWidth=1.2;ctx.stroke();ctx.globalAlpha=.23;ctx.beginPath();ctx.ellipse(-s.w*.14,-s.h*.16,s.w*.23,s.h*.12,-.25,0,Math.PI*2);ctx.fillStyle='#ecf0e5';ctx.fill();ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.fillStyle='#020609b0';ctx.fillRect(0,H-92,W,92);stones.forEach(rock);if(falling)rock(falling);if(swing){let x=swing.cx+Math.sin(swing.angle)*swing.len,y=swing.cy+Math.cos(swing.angle)*swing.len;ctx.save();ctx.setLineDash([4,5]);ctx.strokeStyle='#f5d2849c';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(swing.cx,swing.cy);ctx.lineTo(x,y-swing.h*.24);ctx.stroke();ctx.restore();rock({x,y,w:swing.w,h:swing.h,rot:swing.angle*.13,seed:swing.seed})}particles.forEach(p=>{ctx.globalAlpha=clamp(p.life*1.8,0,1);ctx.fillStyle=p.gold?'#ffe29a':'#c5d5d3';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});ctx.restore()}function loop(t){let dt=Math.min((t-last)/1000,.033)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}$('#play').onclick=()=>{$('#intro').classList.add('hidden');reset(true)};$('#again').onclick=()=>reset(true);$('#restart').onclick=()=>reset(true);$('#drop').onclick=drop;canvas.onpointerdown=drop;$('#pause').onclick=()=>{if(!running)return;paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ'};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}if(e.key.toLowerCase()==='r')reset(true);if(e.key.toLowerCase()==='p')$('#pause').click()});addEventListener('resize',resize);resize();requestAnimationFrame(loop)})();</script></body></html>
