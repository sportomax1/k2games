<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asteroids Pro - K2 games</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg: #000000;
            --ui-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }

        body {
            background: var(--bg);
            color: var(--accent);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100%;
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--accent);
            z-index: 10;
            pointer-events: none;
        }

        /* Mobile Controls */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
            pointer-events: none;
        }

        @media (max-width: 1024px) { #controls { display: flex; } }

        .btn-group { display: flex; gap: 15px; pointer-events: none; }

        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--accent);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.2rem;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: background 0.1s;
        }

        .ctrl-btn:active { background: var(--accent); color: black; }

        .fire-btn { width: 90px; height: 90px; font-size: 1.5rem; background: rgba(0, 242, 255, 0.2); }

        .back-link {
            position: absolute; top: 20px; left: 20px; color: white; text-decoration: none;
            background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px; z-index: 200;
            font-weight: bold; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1);
        }
    .pause-btn{position:absolute;top:14px;right:16px;z-index:120;padding:9px 15px;background:#15283c;border:1px solid #5ce8f4;color:#dffaff;border-radius:10px;cursor:pointer}.hud{top:68px;left:18px;right:18px;font-size:clamp(12px,2vw,20px);display:flex;flex-wrap:wrap;gap:8px}.overlay{position:absolute;inset:0;z-index:110;display:grid;place-items:center;background:#030b1bdc;backdrop-filter:blur(3px);padding:16px;text-align:center}.overlay[hidden]{display:none}.panel{max-width:460px;padding:22px;border:1px solid #5ce8f4;border-radius:16px;background:#12243a;color:#e7faff;box-shadow:0 0 35px #00ddff22}.panel h1{font-size:clamp(25px,5vw,40px);letter-spacing:.1em;color:#5ce8f4}.panel p{margin:16px 0}.panel button{background:#19617a;color:white;border:1px solid #8bf6ff;border-radius:9px;padding:10px 25px;font-weight:800;cursor:pointer}.hint{font-size:12px;color:#a7bed1}.back-link{top:14px;left:14px}@media(max-width:760px){.hud{top:56px;font-size:12px}.pause-btn{padding:7px}.ctrl-btn{width:60px;height:60px}.fire-btn{width:75px;height:75px}#controls{bottom:15px;padding:0 12px}}@media(prefers-reduced-motion:reduce){.overlay{backdrop-filter:none}}</style>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CCZ9JJGEDP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CCZ9JJGEDP');
    </script>
</head>
<body>
    <a href="index.html" class="back-link">← HUB</a>
    <div class="hud">SCORE <span id="score">0</span> · BEST <span id="best">0</span> · WAVE <span id="wave">1</span> · LIVES <span id="lives">♥ ♥ ♥</span></div><button id="pause" class="pause-btn" type="button">Pause</button><div id="overlay" class="overlay"><div class="panel"><h1 id="title">SPACE DEBRIS</h1><p id="message">Destroy asteroids, clear waves, and survive.</p><button id="start" type="button">START GAME</button><p class="hint">← → / A D turn · ↑ / W thrust · Space fire · P pause · R restart</p></div></div>
    
    <canvas id="game"></canvas>

    <div id="controls">
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-thrust">▲</div>
            <div class="ctrl-btn fire-btn" id="btn-fire">●</div>
        </div>
    </div>

    <script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=1000,H=750,TAU=Math.PI*2,$=id=>document.getElementById(id),random=(a,b)=>a+Math.random()*(b-a),wrap=(v,max)=>(v%max+max)%max;
canvas.width=W;canvas.height=H;
const hud={score:$("score"),best:$("best"),wave:$("wave"),lives:$("lives")},overlay=$("overlay"),pause=$("pause"),start=$("start");let best=0;try{best=Number(localStorage.getItem("k2-space-debris-best"))||0}catch{}
let state="menu",score=0,wave=1,lives=3,ship,rocks=[],bullets=[],particles=[],keys={left:false,right:false,up:false,fire:false},stars=Array.from({length:115},()=>({x:random(0,W),y:random(0,H),a:random(.2,.8),p:random(0,TAU)})),time=0,last=0,shotDelay=0,respawn=0,waveDelay=-1,shake=0;
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const distance=(a,b)=>Math.hypot(Math.min(Math.abs(a.x-b.x),W-Math.abs(a.x-b.x)),Math.min(Math.abs(a.y-b.y),H-Math.abs(a.y-b.y)));
function sync(){hud.score.textContent=score.toLocaleString();hud.best.textContent=best.toLocaleString();hud.wave.textContent=wave;hud.lives.textContent="♥ ".repeat(lives).trim()||"—"}
function show(title,message,label){$("title").textContent=title;$("message").textContent=message;start.textContent=label;overlay.hidden=false}
function newShip(){return{x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0,inv:2.4,thrust:false}}
function rock(x,y,r){const a=random(0,TAU),n=Math.floor(random(9,14));rocks.push({x,y,r,vx:Math.cos(a)*random(.7,2)+random(-.3,.3),vy:Math.sin(a)*random(.7,2)+random(-.3,.3),angle:random(0,TAU),spin:random(-.018,.018),edges:Array.from({length:n},()=>random(.72,1.15))})}
function spawnWave(){for(let i=0;i<Math.min(5+wave,16);i++){let x,y,t=0;do{x=random(0,W);y=random(0,H);t++}while(distance({x,y},ship)<220&&t<50);rock(x,y,random(40,58))}waveDelay=-1;ship.inv=Math.max(ship.inv,1.5)}
function reset(){score=0;lives=3;wave=1;time=0;shotDelay=0;respawn=0;shake=0;rocks=[];bullets=[];particles=[];ship=newShip();for(const k in keys)keys[k]=false;spawnWave();state="playing";overlay.hidden=true;pause.textContent="Pause";sync()}
function togglePause(){if(state==="playing"){state="paused";show("PAUSED","Your game is paused.","RESUME");pause.textContent="Resume"}else if(state==="paused"){state="playing";overlay.hidden=true;pause.textContent="Pause";last=performance.now()}}
function burst(x,y,color,count,power=1){for(let i=0;i<(reduced?Math.ceil(count/3):count);i++){const a=random(0,TAU),s=random(.6,5)*power,life=random(14,37);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,color})}if(particles.length>500)particles.splice(0,particles.length-500)}
function shoot(){if(state!=="playing"||respawn>0||shotDelay>0)return;shotDelay=.14;const dx=Math.cos(ship.a),dy=Math.sin(ship.a);bullets.push({x:wrap(ship.x+dx*20,W),y:wrap(ship.y+dy*20,H),vx:ship.vx+dx*11,vy:ship.vy+dy*11,life:.95});if(bullets.length>40)bullets.shift();burst(ship.x+dx*22,ship.y+dy*22,"#fff0a2",3,.35)}
function destroy(i){const a=rocks[i];rocks.splice(i,1);score+=a.r>34?20:a.r>19?50:100;if(score>best){best=score;try{localStorage.setItem("k2-space-debris-best",String(best))}catch{}}burst(a.x,a.y,"#8feafa",Math.round(a.r*.8),a.r/26);shake=Math.min(9,shake+a.r/18);if(a.r>19){for(let j=0;j<2;j++){rock(a.x,a.y,a.r*.55);const b=rocks[rocks.length-1],theta=j*Math.PI+random(-.4,.4);b.vx+=Math.cos(theta)*1.4;b.vy+=Math.sin(theta)*1.4}}sync()}
function hit(){if(ship.inv>0||respawn>0)return;lives--;burst(ship.x,ship.y,"#63eaff",55,2);shake=12;sync();if(!lives){state="over";show("GAME OVER","Score: "+score.toLocaleString()+" · Wave "+wave+" · Best: "+best.toLocaleString(),"PLAY AGAIN");pause.textContent="Pause"}else{ship=newShip();respawn=1.25;ship.inv=3.3}}
function gamepad(){const p=navigator.getGamepads?.()?.find(Boolean);if(!p)return 0;const a=Math.abs(p.axes[0]||0)>.17?p.axes[0]:0;return a}
function tick(dt){const step=dt*60;time+=dt;shotDelay=Math.max(0,shotDelay-dt);respawn=Math.max(0,respawn-dt);ship.inv=Math.max(0,ship.inv-dt);shake*=Math.pow(.85,step);const p=navigator.getGamepads?.()?.find(Boolean),turn=(keys.right?1:0)-(keys.left?1:0)+gamepad();ship.a+=turn*.075*step;if(keys.fire||p?.buttons[2]?.pressed||p?.buttons[1]?.pressed)shoot();ship.thrust=keys.up||!!p?.buttons[0]?.pressed||!!p?.buttons[7]?.pressed;
if(!respawn){if(ship.thrust){ship.vx+=Math.cos(ship.a)*.24*step;ship.vy+=Math.sin(ship.a)*.24*step;if(Math.random()<Math.min(1,step))burst(ship.x-Math.cos(ship.a)*17,ship.y-Math.sin(ship.a)*17,"#ffac69",2,.55)}const drag=Math.pow(.991,step);ship.vx*=drag;ship.vy*=drag;const speed=Math.hypot(ship.vx,ship.vy);if(speed>8){ship.vx*=8/speed;ship.vy*=8/speed}ship.x=wrap(ship.x+ship.vx*step,W);ship.y=wrap(ship.y+ship.vy*step,H)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*step;p.y+=p.vy*step;p.life-=step;if(p.life<=0)particles.splice(i,1)}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x=wrap(b.x+b.vx*step,W);b.y=wrap(b.y+b.vy*step,H);b.life-=dt;if(b.life<=0)bullets.splice(i,1)}
for(const a of rocks){a.x=wrap(a.x+a.vx*step,W);a.y=wrap(a.y+a.vy*step,H);a.angle+=a.spin*step}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];if(!b)continue;for(let j=rocks.length-1;j>=0;j--)if(distance(b,rocks[j])<rocks[j].r*.85){bullets.splice(i,1);destroy(j);break}}
if(!respawn&&ship.inv<=0)for(const a of rocks)if(distance(ship,a)<a.r*.78+10){hit();break}
if(rocks.length===0&&waveDelay<0)waveDelay=1.5;if(waveDelay>=0){waveDelay-=dt;if(waveDelay<0){wave++;spawnWave();sync()}}
}
function clones(obj,r,fn){for(const ox of [-W,0,W])for(const oy of [-H,0,H]){const x=obj.x+ox,y=obj.y+oy;if(x>=-r&&x<=W+r&&y>=-r&&y<=H+r)fn(x,y)}}
function draw(){ctx.fillStyle="#020713";ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a*(.8+.2*Math.sin(time*1.7+s.p));ctx.fillStyle="white";ctx.fillRect(s.x,s.y,1.5,1.5)}ctx.globalAlpha=1;ctx.save();if(!reduced&&shake>.2)ctx.translate(random(-shake,shake),random(-shake,shake));ctx.lineJoin="round";
for(const a of rocks){ctx.strokeStyle=a.r>20?"#8de5f4":"#c4eaff";ctx.lineWidth=2;ctx.shadowColor="#4acfff";ctx.shadowBlur=reduced?0:8;clones(a,a.r,(x,y)=>{ctx.beginPath();for(let i=0;i<a.edges.length;i++){const ang=i/a.edges.length*TAU+a.angle,r=a.r*a.edges[i],px=x+Math.cos(ang)*r,py=y+Math.sin(ang)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.stroke()})}
ctx.shadowBlur=0;ctx.fillStyle="#fff4ae";for(const b of bullets)clones(b,5,(x,y)=>{ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill()});
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,2.5,2.5)}ctx.globalAlpha=1;
if(!respawn&&(ship.inv<=0||Math.floor(time*9)%2===0)){ctx.strokeStyle="#5de9f4";ctx.lineWidth=3;ctx.shadowBlur=reduced?0:14;ctx.shadowColor="#5de9f4";clones(ship,28,(x,y)=>{ctx.save();ctx.translate(x,y);ctx.rotate(ship.a);ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-15,-13);ctx.lineTo(-9,0);ctx.lineTo(-15,13);ctx.closePath();ctx.stroke();if(ship.thrust){ctx.strokeStyle="#ffba6f";ctx.beginPath();ctx.moveTo(-13,-7);ctx.lineTo(-random(25,40),0);ctx.lineTo(-13,7);ctx.stroke()}ctx.restore()})}ctx.restore();
if(state==="playing"&&waveDelay>=0){ctx.fillStyle="#e6faff";ctx.textAlign="center";ctx.font="bold 36px system-ui";ctx.fillText("WAVE "+(wave+1),W/2,150);ctx.textAlign="left"}}
function loop(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(state==="playing")tick(dt);draw();requestAnimationFrame(loop)}
const map={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",ArrowUp:"up",w:"up",W:"up"," ":"fire"};
window.addEventListener("keydown",e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}if(e.repeat)return;if(e.key==="p"||e.key==="P"||e.key==="Escape"){e.preventDefault();togglePause()}if(e.key==="r"||e.key==="R"){e.preventDefault();reset()}if(e.key==="Enter"&&state!=="playing")start.click()});
window.addEventListener("keyup",e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=false}});
window.addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(state==="playing")togglePause()});document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="playing")togglePause()});
for(const [id,key] of [["btn-left","left"],["btn-right","right"],["btn-thrust","up"],["btn-fire","fire"]]){const el=$(id);el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[key]=true});for(const ev of ["pointerup","pointercancel","lostpointercapture"])el.addEventListener(ev,()=>keys[key]=false);el.addEventListener("contextmenu",e=>e.preventDefault())}
start.addEventListener("click",()=>state==="paused"?togglePause():reset());pause.addEventListener("click",togglePause);ship=newShip();sync();last=performance.now();requestAnimationFrame(loop);
})();
</script></body>
</html>
