<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sinkhole Master - K2 games</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8Xw8AAnUB9WQ0N2IAAAAASUVORK5CYII=" />
  <style>
    :root {
      --accent: #ff3e3e;
      --panel: rgba(0, 0, 0, 0.68);
      --text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #16213a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }

    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: 16px;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .left-tools, .right-tools {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 94px;
    }

    .right-tools { justify-content: flex-end; }

    .tool-btn, .back-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.14);
      background: var(--panel);
      cursor: pointer;
    }

    .score-card {
      min-width: min(320px, 48vw);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.24);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: center;
    }

    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      opacity: 0.72;
      font-weight: 700;
    }

    .value {
      margin-top: 2px;
      color: var(--accent);
      font-size: clamp(1.1rem, 4vw, 1.8rem);
      line-height: 1;
      font-weight: 900;
    }

    #level-progress {
      width: 100%;
      height: 9px;
      margin-top: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.15);
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffcf33, var(--accent));
      transition: width 120ms linear;
    }

    #msg-popup {
      position: fixed;
      left: 50%;
      bottom: 150px;
      transform: translateX(-50%);
      display: none;
      z-index: 30;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      white-space: nowrap;
      animation: pop 850ms ease-out forwards;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, 18px) scale(0.88); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1.02); }
      100% { opacity: 0; transform: translate(-50%, -56px) scale(1); }
    }

    #joystick-zone {
      position: fixed;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: none;
      pointer-events: auto;
      touch-action: none;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
    }

    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      transform: translate(-50%, -50%);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    #game-over, #controls-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: auto;
      background: rgba(0,0,0,0.72);
    }

    .modal-content {
      width: min(420px, 92vw);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      background: #20242b;
      border: 1px solid rgba(255,62,62,0.55);
      box-shadow: 0 20px 80px rgba(0,0,0,0.55);
    }

    .modal-content h1, .modal-content h2 { margin: 0 0 12px; }
    .modal-content p { opacity: 0.84; line-height: 1.45; }

    .control-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: left;
    }

    .key {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      background: #3a3f48;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 800;
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      color: #fff;
      background: var(--accent);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }

    button:active { transform: scale(0.98); }

    @media (max-width: 700px) {
      #ui-layer { padding: 12px; }
      .score-card { min-width: 54vw; padding: 10px 12px; }
      .left-tools, .right-tools { min-width: 54px; }
      .back-link span { display: none; }
    }
  </style>
</head>
<body>
  <div id="ui-layer">
    <div class="top-row">
      <div class="left-tools">
        <button class="tool-btn" aria-label="Controls" onclick="toggleControls()">i</button>
      </div>

      <div class="score-card" aria-live="polite">
        <div class="stats-grid">
          <div>
            <div class="label">Score</div>
            <div id="score" class="value">0</div>
          </div>
          <div>
            <div class="label">Level</div>
            <div id="level" class="value">1</div>
          </div>
          <div>
            <div class="label">Time</div>
            <div id="timer" class="value">60</div>
          </div>
        </div>
        <div id="level-progress"><div id="progress-bar"></div></div>
      </div>

      <div class="right-tools">
        <a class="back-link" href="index.html" aria-label="Back to hub">← <span>HUB</span></a>
      </div>
    </div>
  </div>

  <div id="msg-popup">GO!</div>

  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <div id="controls-modal" onclick="toggleControls()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 style="color: var(--accent)">CONTROLS</h2>
      <div class="control-item"><span>Keyboard</span><span><span class="key">WASD</span> / <span class="key">ARROWS</span></span></div>
      <div class="control-item"><span>Desktop</span><span>Mouse aims sinkhole</span></div>
      <div class="control-item"><span>Touch</span><span>Joystick</span></div>
      <p>Swallow smaller objects to grow. Cyan grows faster, gold adds time, red shrinks you.</p>
      <button onclick="toggleControls()">GOT IT</button>
    </div>
  </div>

  <div id="game-over">
    <div class="modal-content">
      <h1 id="game-over-title" style="font-size: 2.5rem">TIME'S UP!</h1>
      <p id="final-score-msg">You swallowed 0 items.</p>
      <button onclick="restartGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Sinkhole Master: Raspberry Pi friendly edition.
    // Changes: no realtime shadows, lower geometry, lower pixel ratio, throttled UI,
    // capped active swallows, object pooling, resize debounce, and no stacking timers.

    const ui = {
      score: document.getElementById('score'),
      level: document.getElementById('level'),
      timer: document.getElementById('timer'),
      progressBar: document.getElementById('progress-bar'),
      msg: document.getElementById('msg-popup'),
      modal: document.getElementById('controls-modal'),
      gameOver: document.getElementById('game-over'),
      gameOverTitle: document.getElementById('game-over-title'),
      finalMsg: document.getElementById('final-score-msg'),
      joyZone: document.getElementById('joystick-zone'),
      joyKnob: document.getElementById('joystick-knob'),
    };

    const isTouchDevice = matchMedia('(hover: none)').matches || navigator.maxTouchPoints > 0;
    const lowPowerHint = /arm|aarch64|raspberry|linux arm/i.test(navigator.userAgent) || navigator.hardwareConcurrency <= 4 || isTouchDevice;

    const cfg = {
      maxItems: lowPowerHint ? 150 : 210,
      maxFalling: lowPowerHint ? 12 : 22,
      bounds: 82,
      startRadius: 1.25,
      maxRadius: 10.5,
      growPerLevel: 0.36,
      itemsToNextLevel: 9,
      maxLevel: 25,
      baseTime: 60,
      keySpeed: 24,
      joySpeed: 25,
      pointerLerp: 0.18,
      fallDuration: 0.34,
      spawnGrace: 0.55,
      spawnBuffer: 8,
      uiHz: 8,
      targetFps: lowPowerHint ? 45 : 60,
      pixelRatio: lowPowerHint ? 1 : Math.min(window.devicePixelRatio || 1, 1.5),
    };

    const input = {
      keys: Object.create(null),
      mouse: new THREE.Vector2(),
      raycaster: new THREE.Raycaster(),
      joystick: { active: false, x: 0, y: 0 },
      pointerTarget: false,
    };

    const state = {
      score: 0,
      level: 1,
      progress: 0,
      timeLeft: cfg.baseTime,
      radius: cfg.startRadius,
      active: false,
      swallowed: 0,
      lastFrame: performance.now(),
      simAcc: 0,
      timeAcc: 0,
      uiAcc: 0,
      fallingCount: 0,
      ending: false,
      msgTimer: 0,
    };

    const world = {
      scene: null,
      camera: null,
      renderer: null,
      ground: null,
      hole: null,
      holeDisc: null,
      holeRim: null,
      target: new THREE.Vector3(0, 0, 0),
      current: new THREE.Vector3(0, 0, 0),
      items: [],
      pool: [],
      materials: {},
      geometries: {},
    };

    window.restartGame = restartGame;
    window.toggleControls = toggleControls;

    init();
    requestAnimationFrame(loop);

    function init() {
      ui.joyZone.style.display = isTouchDevice ? 'block' : 'none';

      world.scene = new THREE.Scene();
      world.scene.background = new THREE.Color(0x8cc9ee);
      world.scene.fog = new THREE.Fog(0x8cc9ee, 34, 88);

      world.camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 220);
      world.camera.position.set(0, 18, 20);
      world.camera.lookAt(0, 0, 0);

      world.renderer = new THREE.WebGLRenderer({ antialias: !lowPowerHint, alpha: false, powerPreference: 'high-performance' });
      world.renderer.setPixelRatio(cfg.pixelRatio);
      world.renderer.setSize(innerWidth, innerHeight);
      world.renderer.shadowMap.enabled = false;
      document.body.appendChild(world.renderer.domElement);

      makeAssets();
      buildWorld();
      bindInput();
      restartGame();
    }

    function makeAssets() {
      world.geometries.ground = new THREE.PlaneGeometry(180, 180, 18, 18);
      world.geometries.holeDisc = new THREE.CircleGeometry(1, lowPowerHint ? 32 : 48);
      world.geometries.holeRim = new THREE.TorusGeometry(1.03, 0.08, 8, lowPowerHint ? 24 : 36);
      world.geometries.person = new THREE.BoxGeometry(0.45, 0.9, 0.32);
      world.geometries.animal = new THREE.BoxGeometry(0.65, 0.42, 0.38);
      world.geometries.tree = new THREE.ConeGeometry(0.62, 1.45, 7);
      world.geometries.car = new THREE.BoxGeometry(1.35, 0.52, 0.75);
      world.geometries.tower = new THREE.BoxGeometry(2.3, 4.5, 2.3);
      world.geometries.light = new THREE.CylinderGeometry(0.07, 0.07, 1.9, 6);
      world.geometries.power = new THREE.OctahedronGeometry(0.55, 0);

      const makeMat = (color, opts = {}) => new THREE.MeshLambertMaterial({ color, ...opts });
      world.materials.grass = makeMat(0x419446, { map: makeGrassTexture() });
      world.materials.hole = new THREE.MeshBasicMaterial({ color: 0x030509, map: makeHoleTexture() });
      world.materials.rim = makeMat(0x252a30);
      world.materials.personBlue = makeMat(0x3d7bff);
      world.materials.personPink = makeMat(0xff6fb1);
      world.materials.animal = makeMat(0x9b6a42);
      world.materials.tree = makeMat(0x266b2c);
      world.materials.carRed = makeMat(0xda3e3e);
      world.materials.carBlue = makeMat(0x3979d9);
      world.materials.tower = makeMat(0x737985);
      world.materials.light = makeMat(0x40444c);
      world.materials.grow = makeMat(0x00d5ff, { emissive: 0x0090aa });
      world.materials.time = makeMat(0xffcf31, { emissive: 0xaa7c00 });
      world.materials.shrink = makeMat(0xff3030, { emissive: 0x8c0000 });
    }

    function buildWorld() {
      const ambient = new THREE.HemisphereLight(0xffffff, 0x375267, 0.88);
      world.scene.add(ambient);

      const sun = new THREE.DirectionalLight(0xffffff, 0.52);
      sun.position.set(20, 30, 10);
      world.scene.add(sun);

      world.ground = new THREE.Mesh(world.geometries.ground, world.materials.grass);
      world.ground.rotation.x = -Math.PI / 2;
      world.scene.add(world.ground);

      const grid = new THREE.GridHelper(180, 18, 0x2d6d36, 0x3b8b43);
      grid.material.opacity = 0.18;
      grid.material.transparent = true;
      world.scene.add(grid);

      world.hole = new THREE.Group();
      world.holeDisc = new THREE.Mesh(world.geometries.holeDisc, world.materials.hole);
      world.holeDisc.rotation.x = -Math.PI / 2;
      world.holeDisc.position.y = 0.035;
      world.hole.add(world.holeDisc);

      world.holeRim = new THREE.Mesh(world.geometries.holeRim, world.materials.rim);
      world.holeRim.rotation.x = -Math.PI / 2;
      world.holeRim.position.y = 0.05;
      world.hole.add(world.holeRim);
      world.scene.add(world.hole);
    }

    function makeGrassTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = '#419446';
      g.fillRect(0, 0, c.width, c.height);
      for (let i = 0; i < 1300; i++) {
        const shade = 70 + Math.random() * 95;
        g.fillStyle = `rgba(20, ${shade}, 25, ${0.12 + Math.random() * 0.22})`;
        g.fillRect(Math.random() * c.width, Math.random() * c.height, 1, 1);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(14, 14);
      return tex;
    }

    function makeHoleTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
      grad.addColorStop(0, '#000000');
      grad.addColorStop(0.6, '#080a0e');
      grad.addColorStop(1, '#2f343d');
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    function bindInput() {
      addEventListener('keydown', e => {
        if (isMoveKey(e.key)) {
          input.keys[e.key] = true;
          e.preventDefault();
        }
      }, { passive: false });
      addEventListener('keyup', e => {
        if (isMoveKey(e.key)) {
          input.keys[e.key] = false;
          e.preventDefault();
        }
      }, { passive: false });

      addEventListener('mousemove', e => {
        if (isTouchDevice) return;
        input.mouse.x = (e.clientX / innerWidth) * 2 - 1;
        input.mouse.y = -(e.clientY / innerHeight) * 2 + 1;
        updatePointerTarget();
      }, { passive: true });

      ui.joyZone.addEventListener('touchstart', e => {
        input.joystick.active = true;
        handleJoystick(e);
      }, { passive: false });
      addEventListener('touchmove', handleJoystick, { passive: false });
      addEventListener('touchend', resetJoystick, { passive: true });
      addEventListener('touchcancel', resetJoystick, { passive: true });

      let resizeTimer = 0;
      addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 80);
      });
    }

    function isMoveKey(key) {
      return key === 'w' || key === 'a' || key === 's' || key === 'd' ||
             key === 'W' || key === 'A' || key === 'S' || key === 'D' ||
             key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight';
    }

    function updatePointerTarget() {
      input.raycaster.setFromCamera(input.mouse, world.camera);
      const hit = input.raycaster.intersectObject(world.ground, false)[0];
      if (!hit) return;
      world.target.copy(hit.point);
      clampTarget();
    }

    function handleJoystick(e) {
      if (!input.joystick.active || !e.touches || !e.touches.length) return;
      e.preventDefault();
      const touch = e.touches[0];
      const rect = ui.joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = touch.clientX - cx;
      let dy = touch.clientY - cy;
      const max = rect.width * 0.5;
      const d = Math.hypot(dx, dy);
      if (d > max) {
        dx = dx / d * max;
        dy = dy / d * max;
      }
      input.joystick.x = dx / max;
      input.joystick.y = dy / max;
      ui.joyKnob.style.left = `calc(50% + ${dx}px)`;
      ui.joyKnob.style.top = `calc(50% + ${dy}px)`;
    }

    function resetJoystick() {
      input.joystick.active = false;
      input.joystick.x = 0;
      input.joystick.y = 0;
      ui.joyKnob.style.left = '50%';
      ui.joyKnob.style.top = '50%';
    }

    function resize() {
      world.camera.aspect = innerWidth / innerHeight;
      world.camera.updateProjectionMatrix();
      world.renderer.setPixelRatio(cfg.pixelRatio);
      world.renderer.setSize(innerWidth, innerHeight);
    }

    function restartGame() {
      for (const item of world.items) despawn(item, false);
      world.items.length = 0;
      world.pool.length = 0;

      Object.assign(state, {
        score: 0,
        level: 1,
        progress: 0,
        timeLeft: cfg.baseTime,
        radius: cfg.startRadius,
        active: true,
        swallowed: 0,
        simAcc: 0,
        timeAcc: 0,
        uiAcc: 0,
        fallingCount: 0,
        ending: false,
        msgTimer: 0,
      });

      world.target.set(0, 0, 0);
      world.current.set(0, 0, 0);
      world.hole.position.set(0, 0, 0);
      syncHole();

      ui.gameOver.style.display = 'none';
      spawnInitialItems();
      updateUI(true);
      showMsg('GO!', '#20242b');
    }

    function spawnInitialItems() {
      for (let i = 0; i < cfg.maxItems; i++) spawnItem(true);
    }

    function spawnItem(initial = false) {
      const item = makeItem();
      const p = chooseSpawn(item.size, initial);
      item.mesh.position.set(p.x, item.baseY, p.z);
      item.mesh.rotation.set(0, Math.random() * Math.PI * 2, 0);
      item.mesh.scale.copy(item.baseScale);
      item.falling = false;
      item.fallT = 0;
      item.spawnAge = 0;
      item.visible = true;
      item.mesh.visible = true;
      world.scene.add(item.mesh);
      world.items.push(item);
    }

    function makeItem() {
      const roll = Math.random();
      let type = 'person';
      if (roll < 0.07) type = randomPower();
      else if (roll < 0.32) type = 'person';
      else if (roll < 0.48) type = 'animal';
      else if (roll < 0.63) type = 'tree';
      else if (roll < 0.76) type = 'car';
      else if (roll < 0.88) type = 'light';
      else type = 'tower';

      const mesh = createMesh(type);
      const data = itemData(type);
      return {
        mesh,
        type,
        value: data.value,
        size: data.size,
        power: data.power,
        baseY: data.baseY,
        baseScale: new THREE.Vector3(1, 1, 1),
        falling: false,
        fallT: 0,
        spawnAge: 0,
      };
    }

    function randomPower() {
      const r = Math.random();
      if (r < 0.42) return 'grow';
      if (r < 0.72) return 'time';
      return 'shrink';
    }

    function itemData(type) {
      if (type === 'person') return { size: 0.55, value: 5, baseY: 0.45 };
      if (type === 'animal') return { size: 0.5, value: 3, baseY: 0.22 };
      if (type === 'tree') return { size: 0.95, value: 10, baseY: 0.73 };
      if (type === 'car') return { size: 1.25, value: 25, baseY: 0.26 };
      if (type === 'light') return { size: 0.4, value: 15, baseY: 0.95 };
      if (type === 'tower') return { size: 3.1, value: 100, baseY: 2.25 };
      return { size: 0.55, value: 0, baseY: 0.55, power: type };
    }

    function createMesh(type) {
      if (type === 'person') return new THREE.Mesh(world.geometries.person, Math.random() > 0.5 ? world.materials.personBlue : world.materials.personPink);
      if (type === 'animal') return new THREE.Mesh(world.geometries.animal, world.materials.animal);
      if (type === 'tree') return new THREE.Mesh(world.geometries.tree, world.materials.tree);
      if (type === 'car') return new THREE.Mesh(world.geometries.car, Math.random() > 0.5 ? world.materials.carRed : world.materials.carBlue);
      if (type === 'light') return new THREE.Mesh(world.geometries.light, world.materials.light);
      if (type === 'tower') {
        const mesh = new THREE.Mesh(world.geometries.tower, world.materials.tower);
        mesh.scale.y = 0.85 + Math.random() * 0.55;
        return mesh;
      }
      return new THREE.Mesh(world.geometries.power, world.materials[type]);
    }

    function chooseSpawn(itemSize, initial) {
      const minClearance = state.radius + cfg.spawnBuffer + itemSize;
      for (let i = 0; i < 28; i++) {
        let x, z;
        if (initial) {
          x = (Math.random() - 0.5) * cfg.bounds * 1.65;
          z = (Math.random() - 0.5) * cfg.bounds * 1.65;
        } else {
          const a = Math.random() * Math.PI * 2;
          const dist = Math.max(24, minClearance) + Math.random() * 34;
          x = world.current.x + Math.cos(a) * dist;
          z = world.current.z + Math.sin(a) * dist;
        }
        x = clamp(x, -cfg.bounds + 4, cfg.bounds - 4);
        z = clamp(z, -cfg.bounds + 4, cfg.bounds - 4);
        const dx = x - world.current.x;
        const dz = z - world.current.z;
        if (dx * dx + dz * dz > minClearance * minClearance) return { x, z };
      }
      const a = Math.random() * Math.PI * 2;
      return { x: Math.cos(a) * (cfg.bounds - 9), z: Math.sin(a) * (cfg.bounds - 9) };
    }

    function loop(now) {
      const frameMs = 1000 / cfg.targetFps;
      if (now - state.lastFrame < frameMs - 1) {
        requestAnimationFrame(loop);
        return;
      }
      const dt = Math.min(0.04, (now - state.lastFrame) / 1000);
      state.lastFrame = now;

      if (state.active) update(dt);
      world.renderer.render(world.scene, world.camera);
      requestAnimationFrame(loop);
    }

    function update(dt) {
      state.timeAcc += dt;
      state.uiAcc += dt;
      if (state.timeAcc >= 1) {
        const dec = Math.floor(state.timeAcc);
        state.timeAcc -= dec;
        state.timeLeft = Math.max(0, state.timeLeft - dec);
        if (state.timeLeft <= 0) return endGame("TIME'S UP!");
      }

      const keyX = (input.keys.d || input.keys.D || input.keys.ArrowRight ? 1 : 0) - (input.keys.a || input.keys.A || input.keys.ArrowLeft ? 1 : 0);
      const keyZ = (input.keys.s || input.keys.S || input.keys.ArrowDown ? 1 : 0) - (input.keys.w || input.keys.W || input.keys.ArrowUp ? 1 : 0);

      if (keyX || keyZ) {
        const inv = keyX && keyZ ? 0.7071 : 1;
        world.target.x += keyX * inv * cfg.keySpeed * dt;
        world.target.z += keyZ * inv * cfg.keySpeed * dt;
      }
      if (input.joystick.active) {
        world.target.x += input.joystick.x * cfg.joySpeed * dt;
        world.target.z += input.joystick.y * cfg.joySpeed * dt;
      }
      clampTarget();

      const lerp = 1 - Math.pow(1 - cfg.pointerLerp, dt * 60);
      world.current.lerp(world.target, lerp);
      world.hole.position.set(world.current.x, 0, world.current.z);
      world.holeRim.rotation.z -= dt * 0.55;

      world.camera.position.x += (world.current.x * 0.34 - world.camera.position.x) * 0.08;
      world.camera.position.z += (world.current.z * 0.34 + 20 - world.camera.position.z) * 0.08;
      world.camera.lookAt(world.current.x, 0, world.current.z);

      const rSq = state.radius * state.radius;
      const now = performance.now();
      for (let i = world.items.length - 1; i >= 0; i--) {
        const item = world.items[i];
        item.spawnAge += dt;

        if (item.falling) {
          animateFalling(item, dt);
          if (item.fallT >= 1) {
            world.items.splice(i, 1);
            despawn(item, true);
            if (world.items.length < cfg.maxItems) spawnItem(false);
          }
          continue;
        }

        const dx = item.mesh.position.x - world.current.x;
        const dz = item.mesh.position.z - world.current.z;
        const dSq = dx * dx + dz * dz;
        if (item.spawnAge < cfg.spawnGrace || dSq > rSq) {
          item.mesh.position.y = item.baseY;
          continue;
        }

        if (item.power) {
          beginSwallow(item);
          applyPower(item.power);
        } else if (item.size <= state.radius * 1.55 && state.fallingCount < cfg.maxFalling) {
          beginSwallow(item);
          state.score += item.value;
          state.swallowed++;
          state.progress++;
          checkLevelUp();
        } else if (state.fallingCount < cfg.maxFalling) {
          item.mesh.position.y = item.baseY + Math.sin(now * 0.008 + i) * 0.08;
        }
      }

      if (state.uiAcc >= 1 / cfg.uiHz) updateUI(false);
    }

    function beginSwallow(item) {
      if (item.falling) return;
      item.falling = true;
      item.fallT = 0;
      state.fallingCount++;
    }

    function animateFalling(item, dt) {
      item.fallT = Math.min(1, item.fallT + dt / cfg.fallDuration);
      const t = item.fallT;
      const dx = item.mesh.position.x - world.current.x;
      const dz = item.mesh.position.z - world.current.z;
      const angle = Math.atan2(dz, dx) + dt * (4.5 + (1 - t) * 4);
      const dist = Math.hypot(dx, dz) * (1 - dt * 2.4);
      item.mesh.position.x = world.current.x + Math.cos(angle) * dist;
      item.mesh.position.z = world.current.z + Math.sin(angle) * dist;
      item.mesh.position.y = item.baseY - t * 2.5;
      const s = Math.max(0.04, 1 - t * 0.96);
      item.mesh.scale.set(s, s, s);
      item.mesh.rotation.y += dt * 4;
      item.mesh.rotation.x += dt * 2.2;
    }

    function despawn(item, countFalling) {
      world.scene.remove(item.mesh);
      if (countFalling) state.fallingCount = Math.max(0, state.fallingCount - 1);
      item.mesh.geometry = item.mesh.geometry;
    }

    function applyPower(power) {
      if (power === 'grow') {
        state.progress += 3;
        state.radius = Math.min(cfg.maxRadius, state.radius + 0.22);
        showMsg('GROWTH!', '#00aacc');
      } else if (power === 'time') {
        state.timeLeft += 10;
        showMsg('+10 SECONDS', '#c69100');
      } else if (power === 'shrink') {
        state.progress = Math.max(0, state.progress - 2);
        state.radius = Math.max(cfg.startRadius, state.radius - 0.45);
        showMsg('SHRINK!', '#d92020');
      }
      checkLevelUp();
      syncHole();
    }

    function checkLevelUp() {
      let leveled = false;
      while (state.progress >= cfg.itemsToNextLevel) {
        state.progress -= cfg.itemsToNextLevel;
        state.level++;
        state.radius = Math.min(cfg.maxRadius, state.radius + cfg.growPerLevel);
        leveled = true;
      }
      if (leveled) {
        showMsg('LEVEL UP!', '#ff3e3e');
        syncHole();
      }
      if (!state.ending && (state.radius >= cfg.maxRadius || state.level >= cfg.maxLevel)) {
        state.ending = true;
        state.radius = cfg.maxRadius;
        syncHole();
        setTimeout(() => { if (state.active) endGame('CITY CLAIMED!'); }, 650);
      }
    }

    function updateUI(force) {
      if (!force && state.uiAcc < 1 / cfg.uiHz) return;
      state.uiAcc = 0;
      ui.score.textContent = state.score;
      ui.level.textContent = state.level;
      ui.timer.textContent = Math.ceil(state.timeLeft);
      ui.progressBar.style.width = `${clamp((state.progress / cfg.itemsToNextLevel) * 100, 0, 100)}%`;
    }

    function syncHole() {
      world.hole.scale.set(state.radius, 1, state.radius);
    }

    function clampTarget() {
      world.target.x = clamp(world.target.x, -cfg.bounds, cfg.bounds);
      world.target.z = clamp(world.target.z, -cfg.bounds, cfg.bounds);
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function showMsg(text, color) {
      ui.msg.textContent = text;
      ui.msg.style.background = color;
      ui.msg.style.display = 'block';
      ui.msg.style.animation = 'none';
      void ui.msg.offsetWidth;
      ui.msg.style.animation = 'pop 850ms ease-out forwards';
      clearTimeout(state.msgTimer);
      state.msgTimer = setTimeout(() => { ui.msg.style.display = 'none'; }, 860);
    }

    function endGame(title) {
      if (!state.active) return;
      state.active = false;
      updateUI(true);
      ui.gameOverTitle.textContent = title;
      ui.finalMsg.textContent = `You reached Level ${state.level} with ${state.score} points and swallowed ${state.swallowed} items.`;
      ui.gameOver.style.display = 'flex';
    }

    function toggleControls() {
      ui.modal.style.display = ui.modal.style.display === 'flex' ? 'none' : 'flex';
    }
  </script>
</body>
</html>
