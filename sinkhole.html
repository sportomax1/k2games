<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sinkhole Master - K2 Games</title>
<style>
:root{--bg:#102033;--panel:rgba(5,12,22,.82);--text:#f8fafc;--muted:#b6c3d1;--accent:#ef4444;--grass:#55a34f;--road:#626b77}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;background:#79b96a}
.hud{position:fixed;top:12px;left:12px;right:12px;z-index:5;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.brand{display:flex;gap:10px;align-items:center}.brand strong{font-size:1rem}.brand small{display:block;color:var(--muted);font-size:.72rem}
.stats{display:flex;gap:8px;align-items:center}.stat{min-width:76px;text-align:center}.label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.value{font-size:1.2rem;font-weight:900;color:#fff}
#clock{font-variant-numeric:tabular-nums;color:#facc15}.back{pointer-events:auto;color:white;text-decoration:none;font-weight:900}
#msg{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:8;background:#111827;color:white;border-radius:999px;padding:8px 18px;font-weight:900;opacity:0;transition:.2s}
#msg.show{opacity:1;top:104px}.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(5,12,22,.86);padding:24px;text-align:center}.overlay.show{display:flex}.card{background:#0f172a;border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:28px;max-width:440px;width:100%}.card h1{margin:0 0 8px;font-size:2.4rem}.card button{margin-top:16px;border:0;border-radius:999px;background:var(--accent);color:white;font-weight:900;font-size:1.05rem;padding:14px 30px}
.joy{position:fixed;left:24px;bottom:24px;width:128px;height:128px;border-radius:999px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.2);display:none;z-index:6}.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:999px;background:white;transform:translate(-50%,-50%);box-shadow:0 8px 18px rgba(0,0,0,.35)}
@media(hover:none){.joy{display:block}}@media(max-width:700px){.hud{flex-wrap:wrap}.stats{order:3;width:100%;justify-content:space-between}.stat{min-width:auto;flex:1}.brand strong{font-size:.9rem}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="panel brand"><div style="font-size:1.8rem">🕳️</div><div><strong>Sinkhole Master</strong><small>Pi / TV performance mode</small></div></div>
  <div class="panel stats">
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="stat"><div class="label">Time</div><div class="value" id="timer">60</div></div>
    <div class="stat"><div class="label">Clock</div><div class="value" id="clock">--:--</div></div>
  </div>
  <a class="panel back" href="index.html">← HUB</a>
</div>
<div id="msg">GO!</div>
<div class="joy" id="joy"><div class="knob" id="knob"></div></div>
<div class="overlay" id="over"><div class="card"><h1 id="overTitle">Time!</h1><p id="overText"></p><button id="again">PLAY AGAIN</button></div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),timerEl=document.getElementById('timer'),clockEl=document.getElementById('clock');
const msg=document.getElementById('msg'),over=document.getElementById('over'),overTitle=document.getElementById('overTitle'),overText=document.getElementById('overText'),again=document.getElementById('again');
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
const DPR=Math.min(devicePixelRatio||1,1.25);let W=0,H=0,CX=0,CY=0,last=performance.now(),active=true,msgT=0;
let hole,items=[],keys={},joyVec={x:0,y:0},score=0,level=1,swallowed=0,timeLeft=60,uiT=0;
const TYPES=[['person','🚶',7,11],['dog','🐕',6,9],['tree','🌲',12,18],['car','🚗',18,26],['house','🏠',28,50],['gold','⏱️',10,0],['grow','💠',10,0],['shrink','🔻',10,0]];
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);CX=W/2;CY=H/2}
function reset(){score=0;level=1;swallowed=0;timeLeft=60;active=true;over.classList.remove('show');hole={x:CX,y:CY,r:24,targetX:CX,targetY:CY};items=[];for(let i=0;i<120;i++)spawn(true);toast('GO!')}
function spawn(initial=false){const t=TYPES[Math.random()<.08?5+Math.floor(Math.random()*3):Math.floor(Math.random()*5)];let x,y,tries=0;do{x=Math.random()*W;y=90+Math.random()*(H-120);tries++}while(tries<30&&Math.hypot(x-hole.x,y-hole.y)<hole.r+90);items.push({kind:t[0],emoji:t[1],r:t[2],value:t[3],x,y,baseX:x,baseY:y,fall:false,ft:0,spin:Math.random()*6.28})}
function toast(t){msg.textContent=t;msg.classList.add('show');msgT=.9}
function updateClock(){clockEl.textContent=new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});}
function end(title){active=false;overTitle.textContent=title;overText.textContent=`Score ${score} • Level ${level} • ${swallowed} swallowed`;over.classList.add('show')}
function update(dt){
 if(!active)return; timeLeft-=dt;if(timeLeft<=0){timeLeft=0;end("TIME'S UP!");}
 let ax=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0), ay=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
 if(joyVec.x||joyVec.y){ax+=joyVec.x;ay+=joyVec.y}
 const len=Math.hypot(ax,ay)||1; if(ax||ay){hole.targetX+=ax/len*310*dt;hole.targetY+=ay/len*310*dt}
 hole.targetX=Math.max(hole.r,Math.min(W-hole.r,hole.targetX));hole.targetY=Math.max(90+hole.r,Math.min(H-hole.r,hole.targetY));
 hole.x+=(hole.targetX-hole.x)*Math.min(1,dt*9);hole.y+=(hole.targetY-hole.y)*Math.min(1,dt*9);
 let falling=0;
 for(let i=items.length-1;i>=0;i--){const it=items[i];if(it.fall){falling++;it.ft+=dt*3.2;it.x+=(hole.x-it.x)*dt*7;it.y+=(hole.y-it.y)*dt*7;it.r*=Math.max(.82,1-dt*3);it.spin+=dt*8;if(it.ft>=1||it.r<2){items.splice(i,1);spawn(false)}continue}
 const d=Math.hypot(it.x-hole.x,it.y-hole.y);
 if(d<hole.r && falling<12){
   if(it.kind==='gold'){timeLeft+=10;toast('+10 SECONDS')}
   else if(it.kind==='grow'){hole.r+=7;toast('GROWTH!')}
   else if(it.kind==='shrink'){hole.r=Math.max(20,hole.r-10);toast('SHRINK!')}
   else if(it.r<hole.r*.72){score+=it.value;swallowed++;level=1+Math.floor(swallowed/8);hole.r=Math.min(115,24+level*4);if(swallowed%8===0)toast('LEVEL UP!')}
   else {it.x+=Math.sign(it.x-hole.x)*35*dt;it.y+=Math.sign(it.y-hole.y)*35*dt;continue}
   it.fall=true;it.ft=0;
 }
 }
 uiT+=dt;if(uiT>.12){scoreEl.textContent=score;levelEl.textContent=level;timerEl.textContent=Math.ceil(timeLeft);uiT=0}
 if(msgT>0){msgT-=dt;if(msgT<=0)msg.classList.remove('show')}
 if(level>=24)end('CITY CLAIMED!');
}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bd16f');g.addColorStop(1,'#4f9b4a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.14)';for(let x=-80;x<W+120;x+=120){ctx.fillRect(x,0,36,H)}
 ctx.fillStyle='rgba(60,90,60,.14)';for(let x=0;x<W;x+=60)for(let y=100;y<H;y+=60)ctx.fillRect(x+((y/60)%2)*22,y,3,16);
 items.sort((a,b)=>a.y-b.y);ctx.textAlign='center';ctx.textBaseline='middle';
 for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.spin||0);ctx.font=Math.max(18,it.r*2.1)+'px serif';ctx.fillText(it.emoji,0,0);ctx.restore()}
 const rg=ctx.createRadialGradient(hole.x,hole.y,4,hole.x,hole.y,hole.r*1.35);rg.addColorStop(0,'#000');rg.addColorStop(.58,'#08111e');rg.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r*1.35,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r,0,Math.PI*2);ctx.stroke();
}
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',resize);addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){hole.targetX=e.clientX;hole.targetY=e.clientY}});
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',moveJoy);joy.addEventListener('pointerup',clearJoy);joy.addEventListener('pointercancel',clearJoy);
function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),max=r.width/2;if(m>max){dx*=max/m;dy*=max/m}joyVec.x=dx/max;joyVec.y=dy/max;knob.style.left=`calc(50% + ${dx}px)`;knob.style.top=`calc(50% + ${dy}px)`}
function clearJoy(){joyVec.x=joyVec.y=0;knob.style.left=knob.style.top='50%'}
again.addEventListener('click',reset);setInterval(updateClock,1000);resize();updateClock();reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
