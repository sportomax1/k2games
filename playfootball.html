<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Football Master - K2 Games</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063018;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{position:fixed;inset:0}.app{height:100dvh;display:grid;grid-template-rows:1fr 58px;gap:6px;padding:env(safe-area-inset-top) 8px 8px;background:#063018}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;border-radius:18px;border:1px solid #ffffff30;background:#166534}.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;z-index:3;pointer-events:none}.pill{background:#052e16cc;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px;font-weight:950;color:#facc15}.back{pointer-events:auto;color:white;text-decoration:none;background:#052e16cc;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px;font-weight:950}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}button{border:0;border-radius:13px;background:#14532d;color:white;font-weight:950}.primary{background:#facc15;color:#10220e}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,48,24,.84);text-align:center;padding:20px;z-index:4}.modal{width:min(92vw,620px);background:#f8fafc;color:#052e16;border-radius:24px;padding:24px}.modal h1{font-size:2.6rem;margin:0 0 8px}.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:#052e16dd;border:1px solid #ffffff30;border-radius:999px;padding:8px 14px;font-weight:950;opacity:0;transition:.15s;z-index:3}.toast.show{opacity:1}@media(max-width:760px){.app{grid-template-rows:1fr 50px;padding:6px}.controls{grid-template-columns:repeat(3,1fr)}.pill{padding:6px 9px;font-size:.8rem}}</style></head><body><div class="app"><section class="stage"><canvas id="game"></canvas><div class="hud"><a class="back" href="index.html">← HUB</a><div class="pill" id="score">YOU 0 · CPU 0</div><div class="pill" id="down">1st & 10</div></div><div class="toast" id="toast">TOUCHDOWN!</div><div class="overlay" id="overlay"><div class="modal"><h1>🏈 Football Master</h1><p>No black top bar. Full-field arcade football with improved blocking, tackling, receiver routes, passing arc, sprinting, downs, and touchdowns.</p><button class="primary" id="start">KICKOFF</button></div></div></section><div class="controls"><button id="left">←</button><button id="right">→</button><button id="up">↑</button><button id="downBtn">↓</button><button class="primary" id="action">SPRINT / PASS</button></div></div><script>(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),scoreEl=document.getElementById('score'),downEl=document.getElementById('down'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay');let W=960,H=540,DPR=1,last=performance.now(),run=false,keys={},toastT=0,you=0,cpu=0,down=1,toGo=10,yard=25,mode='run',playT=0;const p={x:0,y:0,vx:0,vy:0,has:true,stam:100},ball={x:0,y:0,vx:0,vy:0,held:true,target:null},wr={x:0,y:0},def=[],blockers=[];function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);setupPlay()}new ResizeObserver(resize).observe(cv);function ui(){scoreEl.textContent=`YOU ${you} · CPU ${cpu}`;downEl.textContent=`${['1st','2nd','3rd','4th'][down-1]} & ${toGo} · ${yard} yd`}function show(t){toast.textContent=t;toast.classList.add('show');toastT=1}function setupPlay(){p.x=W*.18;p.y=H*.55;p.vx=0;p.vy=0;p.has=true;p.stam=100;wr.x=W*.28;wr.y=H*.28;ball.held=true;ball.target=null;def=[{x:W*.55,y:H*.28,vx:0,vy:0},{x:W*.58,y:H*.52,vx:0,vy:0},{x:W*.66,y:H*.72,vx:0,vy:0},{x:W*.73,y:H*.42,vx:0,vy:0}];blockers=[{x:W*.32,y:H*.48},{x:W*.34,y:H*.62}];playT=0;ui()}function reset(){you=0;cpu=0;down=1;toGo=10;yard=25;run=true;overlay.style.display='none';setupPlay()}function firstDown(g){yard+=g;toGo-=g;if(yard>=100){you+=7;show('TOUCHDOWN!');down=1;toGo=10;yard=25;setupPlay();return}if(toGo<=0){down=1;toGo=10;show('FIRST DOWN')}else down++;if(down>4){show('TURNOVER');down=1;toGo=10;yard=Math.max(20,yard-8)}setupPlay()}function pass(){if(!p.has||!ball.held)return;ball.held=false;p.has=false;ball.x=p.x+18;ball.y=p.y-22;ball.target={x:wr.x+80,y:wr.y};const dx=ball.target.x-ball.x,dy=ball.target.y-ball.y,d=Math.hypot(dx,dy)||1;ball.vx=dx/d*10;ball.vy=dy/d*10-2;show('PASS!')}function tackle(){const gain=Math.max(0,Math.round((p.x-W*.18)/(W*.64)*35));show('TACKLED +' + gain);firstDown(gain)}function drawField(){ctx.fillStyle='#166534';ctx.fillRect(0,0,W,H);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#15803d':'#166534';ctx.fillRect(i*W/10,0,W/10,H);ctx.strokeStyle='#ffffff80';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(i*W/10,0);ctx.lineTo(i*W/10,H);ctx.stroke();ctx.fillStyle='#ffffffaa';ctx.font='900 12px system-ui';ctx.fillText(i*10,i*W/10+8,H*.08)}ctx.fillStyle='#facc1540';ctx.fillRect(W*.82,0,W*.18,H);ctx.fillStyle='#fff';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.fillText('END ZONE',W*.91,H*.5)}function drawMan(o,color,label){ctx.fillStyle=color;ctx.beginPath();ctx.arc(o.x,o.y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText(label,o.x,o.y+4)}function update(dt){if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}if(!run)return;playT+=dt;const ax=(keys.right?1:0)-(keys.left?1:0),ay=(keys.down?1:0)-(keys.up?1:0),sprint=keys.action&&p.stam>0;const speed=sprint?390:270;p.vx+=(ax*speed-p.vx)*dt*9;p.vy+=(ay*speed-p.vy)*dt*9;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(20,Math.min(W*.93,p.x));p.y=Math.max(40,Math.min(H-36,p.y));p.stam=Math.max(0,Math.min(100,p.stam+(sprint?-32:20)*dt));wr.x+=150*dt;wr.y=H*.28+Math.sin(playT*3)*28;if(wr.x>W*.86)wr.x=W*.86;blockers.forEach((b,i)=>{b.x+=75*dt;b.y+=(i?H*.61:H*.47-b.y)*dt*3});def.forEach((d,i)=>{let tx=p.has?p.x:(ball.held?p.x:ball.x),ty=p.has?p.y:(ball.held?p.y:ball.y);if(i===0){tx=wr.x;ty=wr.y}const dx=tx-d.x,dy=ty-d.y,l=Math.hypot(dx,dy)||1;let blocked=blockers.some(b=>Math.hypot(b.x-d.x,b.y-d.y)<34);d.x+=dx/l*dt*(blocked?85:155);d.y+=dy/l*dt*(blocked?85:155);if(Math.hypot(d.x-p.x,d.y-p.y)<31&&p.has)tackle()});if(ball.held){ball.x=p.x+16;ball.y=p.y-20}else{ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vy+=.12*60*dt;if(Math.hypot(ball.x-wr.x,ball.y-wr.y)<34){p.x=wr.x;p.y=wr.y;p.has=true;ball.held=true;show('CATCH!')}if(def.some(d=>Math.hypot(d.x-ball.x,d.y-ball.y)<24)){show('INCOMPLETE');down++;if(down>4){down=1;toGo=10;yard=Math.max(20,yard-8)}setupPlay()}if(ball.x>W||ball.y<0||ball.y>H){show('INCOMPLETE');down++;if(down>4){down=1;toGo=10;yard=Math.max(20,yard-8)}setupPlay()}}if(p.x>W*.82&&p.has){you+=7;show('TOUCHDOWN!');down=1;toGo=10;yard=25;setupPlay()}ui()}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;drawField();update(dt);blockers.forEach(b=>drawMan(b,'#93c5fd','OL'));drawMan(wr,'#38bdf8','WR');def.forEach(d=>drawMan(d,'#ef4444','D'));drawMan(p,'#facc15','QB');if(!ball.held){ctx.fillStyle='#7c2d12';ctx.beginPath();ctx.ellipse(ball.x,ball.y,12,8,0,0,Math.PI*2);ctx.fill()}requestAnimationFrame(loop)}function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{keys[k]=true;e.preventDefault()});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointerleave',()=>keys[k]=false)}hold('left','left');hold('right','right');hold('up','up');hold('downBtn','down');hold('action','action');document.getElementById('action').addEventListener('click',pass);document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;if(e.code==='Space')keys.action=true;if(e.key==='p')pass()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false;if(e.code==='Space')keys.action=false});resize();requestAnimationFrame(loop)})();</script></body></html>
