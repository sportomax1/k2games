<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Peak Freak - K2 Games</title><style>
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c1917;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}nav{height:54px;background:#171311;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff22}.logo{font-weight:950}.back{color:white;text-decoration:none;font-weight:900}main{height:calc(100% - 54px);position:relative;background:linear-gradient(#334155,#1c1917)}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.card{background:rgba(15,23,42,.82);border:1px solid #ffffff24;border-radius:14px;padding:8px 12px;text-align:center;min-width:80px}.label{font-size:.62rem;color:#cbd5e1;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.val{font-weight:950;font-size:1.1rem}.controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.controls button{width:64px;height:52px;border:0;border-radius:16px;background:#f59e0b;color:#1c1917;font-weight:950;font-size:1.2rem}.overlay{position:absolute;inset:0;background:rgba(28,25,23,.86);display:grid;place-items:center;text-align:center;padding:24px}.modal{background:#fff7ed;color:#292524;border-radius:24px;padding:26px;width:min(92vw,560px)}.modal h1{font-size:2.5rem;margin:0 0 8px}button.start{border:0;border-radius:999px;background:#ea580c;color:white;font-weight:950;padding:14px 28px;margin-top:14px}.tip{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);background:rgba(255,247,237,.92);color:#292524;border-radius:999px;padding:8px 14px;font-weight:850;text-align:center;max-width:92vw}@media(max-width:700px){.card{min-width:62px;padding:7px 8px}.tip{font-size:.8rem}.controls button{width:58px}}
</style></head><body><nav><div class="logo">🧗 Peak Freak</div><a class="back" href="index.html">← HUB</a></nav><main><canvas id="game"></canvas><div class="hud"><div class="card"><div class="label">Height</div><div class="val" id="height">0m</div></div><div class="card"><div class="label">AI</div><div class="val" id="ai">0m</div></div><div class="card"><div class="label">Grip</div><div class="val" id="grip">100%</div></div><div class="card"><div class="label">Time</div><div class="val" id="time">60</div></div></div><div class="tip">Alternate left/right holds. Use chalk when grip drops. Race the AI climber beside you.</div><div class="controls"><button id="left">L</button><button id="right">R</button><button id="chalk">CHALK</button></div><div class="overlay" id="start"><div class="modal"><h1>🧗 Peak Freak</h1><p>Actual climbing mechanics: pick the next left/right handhold, manage grip, chalk up, and beat the AI on the lane beside you.</p><button class="start" id="play">START CLIMB</button></div></div></main><script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),hEl=document.getElementById('height'),aiEl=document.getElementById('ai'),gEl=document.getElementById('grip'),tEl=document.getElementById('time'),start=document.getElementById('start');let W=innerWidth,H=innerHeight-54,DPR=1,run=false,last=performance.now(),time=60,player=0,ai=0,grip=100,next='L',shake=0,holds=[];function resize(){W=innerWidth;H=innerHeight-54;DPR=Math.min(devicePixelRatio||1,1.5);cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);makeHolds()}addEventListener('resize',resize);function makeHolds(){holds=[];for(let y=-200;y<3000;y+=54){holds.push({x:W*.38+(Math.random()-.5)*80,y,side:Math.random()<.5?'L':'R'});holds.push({x:W*.62+(Math.random()-.5)*80,y:y+20,side:Math.random()<.5?'L':'R'})}}function reset(){player=0;ai=0;grip=100;time=60;next='L';run=true;start.style.display='none';makeHolds()}function move(side){if(!run)return;if(side!==next){grip-=8;shake=8;return}player+=side==='L'?7:7;grip-=3.6;next=next==='L'?'R':'L';if(grip<=0){player=Math.max(0,player-18);grip=18;shake=14}}function chalk(){if(!run)return;grip=Math.min(100,grip+28);player=Math.max(0,player-4)}function drawRock(cam){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#78716c');g.addColorStop(1,'#292524');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(0,0,0,.18)';for(let i=0;i<16;i++){ctx.beginPath();ctx.moveTo(i*W/15,0);ctx.bezierCurveTo(i*W/15+40,180,i*W/15-50,360,i*W/15+20,H);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<70;i++){const x=(i*97)%W,y=(i*173+cam*.7)%H;ctx.fillRect(x,y,2+Math.random()*5,1)}}function drawHold(x,y,active){ctx.fillStyle=active?'#facc15':'#fb923c';ctx.strokeStyle='#431407';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,18,10,Math.sin(y)*.7,0,Math.PI*2);ctx.fill();ctx.stroke()}function climber(x,y,color,name){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y-36,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y-22);ctx.lineTo(x,y+20);ctx.moveTo(x,y-8);ctx.lineTo(x-24,y-34);ctx.moveTo(x,y-8);ctx.lineTo(x+24,y-34);ctx.moveTo(x,y+20);ctx.lineTo(x-18,y+52);ctx.moveTo(x,y+20);ctx.lineTo(x+18,y+52);ctx.stroke();ctx.font='900 12px system-ui';ctx.fillText(name,x-18,y+70)}function end(msg){run=false;start.style.display='grid';start.querySelector('h1').textContent=msg;start.querySelector('p').textContent=`You climbed ${Math.floor(player)}m. AI climbed ${Math.floor(ai)}m.`;start.querySelector('button').textContent='CLIMB AGAIN'}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(run){time-=dt;grip=Math.max(0,grip-dt*3.2);ai+=dt*(5.3+Math.sin(now*.002)*1.5);if(time<=0)end(player>=ai?'YOU WIN!':'AI WINS!');if(player>=240)end('SUMMIT!');if(grip<=1){player=Math.max(0,player-dt*35);shake=10}}const cam=Math.max(0,Math.max(player,ai)*16-H*.55);drawRock(cam);for(const hd of holds){const y=H-(hd.y-cam);if(y>-40&&y<H+40)drawHold(hd.x,y,hd.side===next)}climber(W*.38+(shake?Math.random()*shake-shake/2:0),H-(player*16-cam),'#38bdf8','YOU');climber(W*.62,H-(ai*16-cam),'#ef4444','AI');ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(W*.5,0);ctx.lineTo(W*.5,H);ctx.stroke();ctx.setLineDash([]);hEl.textContent=Math.floor(player)+'m';aiEl.textContent=Math.floor(ai)+'m';gEl.textContent=Math.max(0,Math.floor(grip))+'%';tEl.textContent=Math.max(0,Math.ceil(time));shake=Math.max(0,shake-1);requestAnimationFrame(loop)}document.getElementById('left').onclick=()=>move('L');document.getElementById('right').onclick=()=>move('R');document.getElementById('chalk').onclick=chalk;document.getElementById('play').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move('L');if(e.key==='ArrowRight'||e.key==='d')move('R');if(e.key===' '||e.key==='c')chalk()});resize();requestAnimationFrame(loop)})();
</script></body></html>
