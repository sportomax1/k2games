<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16104a">
<title>Mystery Pour</title>
<style>
:root{--bg1:#110b38;--bg2:#27146b;--panel:#302080;--text:#fff;--muted:#bdb7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0827;color:#fff}body{min-height:100dvh;overflow-x:hidden}button{font:inherit}.app{min-height:100dvh;max-width:760px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 8%,#5134ce66,transparent 30%),linear-gradient(180deg,var(--bg2),var(--bg1))}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:1000;letter-spacing:.7px;font-size:clamp(21px,5vw,31px);text-shadow:0 3px 0 #09051f}.pill{background:#17104a;border:1px solid #ffffff20;box-shadow:inset 0 1px #ffffff22,0 5px 12px #0004;padding:8px 11px;border-radius:999px;font-weight:900}.level{text-align:center;margin:8px 0 3px;font-size:18px;font-weight:950}.sub{text-align:center;color:var(--muted);font-size:12px;min-height:18px}.board{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:15px 12px;min-height:65dvh;padding:13px 2px 16px}.bottle{position:relative;width:58px;height:138px;border:0;background:transparent;padding:0;cursor:pointer;transition:.16s transform;filter:drop-shadow(0 8px 5px #0005)}.bottle.selected{transform:translateY(-10px) scale(1.04)}.neck{position:absolute;z-index:5;left:18px;top:0;width:22px;height:17px;border:4px solid #bce6ff;border-bottom:0;border-radius:7px 7px 3px 3px;background:#ffffff18;box-shadow:inset 0 0 5px #fff8}.glass{position:absolute;overflow:hidden;left:6px;right:6px;top:12px;bottom:0;border:4px solid #9bdcff;border-top:5px solid #c8efff;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#fff2,#ffffff08 30%,#8bd8ff10 65%,#fff2);box-shadow:inset 4px 0 5px #fff3,inset -3px 0 5px #75cfff44}.layers{position:absolute;left:0;right:0;bottom:0;height:112px;display:flex;flex-direction:column-reverse}.layer{height:28px;flex:0 0 28px;position:relative;box-shadow:inset 0 4px #ffffff22,inset 0 -3px #0002}.layer:first-child{border-radius:0 0 10px 10px}.layer.hidden{background:linear-gradient(180deg,#111425,#03040b);display:grid;place-items:center;color:#b7dcff;font-size:17px;font-weight:1000;text-shadow:0 2px #000}.layer.hidden::after{content:"?"}.shine{pointer-events:none;position:absolute;z-index:6;left:13px;top:29px;width:7px;height:71px;border-radius:99px;background:linear-gradient(#fff8,#fff0)}.controls{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#100a35cc;backdrop-filter:blur(10px);padding:8px;border-radius:20px;border:1px solid #ffffff15}.ctrl{border:0;border-radius:15px;padding:10px 5px;background:linear-gradient(#725cff,#3d2ab7);box-shadow:inset 0 2px #ffffff35,0 4px 0 #24166f;color:white;font-weight:900;cursor:pointer}.ctrl:active{transform:translateY(2px);box-shadow:inset 0 2px #ffffff25,0 2px 0 #24166f}.ctrl .ico{font-size:22px;display:block;line-height:22px}.ctrl small{display:block;font-size:10px;margin-top:4px}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#08051ecc;z-index:20;padding:20px}.overlay.show{display:grid}.card{width:min(390px,100%);text-align:center;background:linear-gradient(#4730b8,#221461);border:1px solid #ffffff25;border-radius:25px;padding:24px;box-shadow:0 25px 80px #0009}.card h2{font-size:34px;margin:0 0 5px}.card p{color:#d8d4ff}.big{border:0;border-radius:16px;padding:14px 24px;background:#ffd83d;color:#302400;font-weight:1000;font-size:18px;box-shadow:0 5px 0 #b68c00;cursor:pointer}.toast{position:fixed;left:50%;top:15%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#090622e8;border:1px solid #ffffff30;border-radius:999px;padding:9px 15px;font-weight:800;transition:.2s;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.board{gap:12px 5px}.bottle{width:52px;height:127px}.glass{left:5px;right:5px}.neck{left:16px}.layers{height:104px}.layer{height:26px;flex-basis:26px}}
</style></head><body><div class="app"><div class="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="brand">MYSTERY POUR</div><div class="pill">⭐ <span id="stars">0</span></div></div><div class="level">Level <span id="level">1</span></div><div class="sub" id="status">Sort each color into its own bottle. Mystery layers reveal when exposed.</div><main class="board" id="board"></main><div class="controls"><button class="ctrl" id="undo"><span class="ico">↶</span><small>UNDO</small></button><button class="ctrl" id="restart"><span class="ico">⟳</span><small>RESTART</small></button><button class="ctrl" id="extra"><span class="ico">＋🧪</span><small>EXTRA BOTTLE</small></button><button class="ctrl" id="new"><span class="ico">🎲</span><small>NEW PUZZLE</small></button></div></div><div class="overlay" id="win"><div class="card"><div style="font-size:52px">🏆</div><h2>Sorted!</h2><p id="winText"></p><button class="big" id="next">NEXT LEVEL</button></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const COLORS=["#ff3b30","#20d66b","#19c9ed","#ff9f0a","#3157ff","#8c35e8","#ffd33d","#ff4ea3","#34d6bd"],CAP=4;let level=+(localStorage.mpLevel||1),coins=+(localStorage.mpCoins||0),stars=+(localStorage.mpStars||0),bottles=[],startState=[],history=[],selected=null,moves=0,extraUsed=false,locked=false,revealedKeys=new Set();const $=s=>document.querySelector(s),board=$("#board"),clone=x=>JSON.parse(JSON.stringify(x));function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function topRun(a){if(!a.length)return null;let c=a[a.length-1].c,n=0;for(let i=a.length-1;i>=0&&a[i].c===c;i--)n++;return{c,n}}function legalState(bs,from,to){if(from===to||!bs[from].length||bs[to].length>=CAP)return false;const f=topRun(bs[from]),t=bs[to];return!t.length||t[t.length-1].c===f.c}function doPourState(bs,from,to){const run=topRun(bs[from]),count=Math.min(run.n,CAP-bs[to].length);for(let i=0;i<count;i++)bs[to].push(bs[from].pop())}function solved(bs){return bs.every(a=>!a.length||(a.length===CAP&&a.every(x=>x.c===a[0].c)))}function stateKey(bs){return bs.map(a=>a.map(x=>x.c).join("")).join("|")}function generateSolvable(lvl,randomize=false){const colorCount=Math.min(4+Math.floor((lvl+2)/4),8),emptyCount=2,r=rng((randomize?Date.now():lvl*104729)+7919);let bs=[];for(let c=0;c<colorCount;c++)bs.push(Array.from({length:CAP},(_,slot)=>({c,slot,id:`${c}:${slot}`})));for(let i=0;i<emptyCount;i++)bs.push([]);const targetScrambles=Math.min(18+lvl*3,75);let last=null,successful=0,guard=0;while(successful<targetScrambles&&guard++<targetScrambles*40){let sources=[];bs.forEach((a,i)=>{if(a.length)sources.push(i)});const from=sources[Math.floor(r()*sources.length)],a=bs[from],run=topRun(a);let max=Math.min(run.n,CAP-1);if(max<1)continue;const count=1+Math.floor(r()*max);let dests=[];bs.forEach((d,j)=>{if(j===from||d.length+count>CAP)return;dests.push(j)});if(!dests.length)continue;let to=dests[Math.floor(r()*dests.length)];if(last&&last.from===to&&last.to===from)continue;const moved=a.splice(a.length-count,count);bs[to].push(...moved);last={from,to};successful++}return bs}function solvePuzzle(initial,maxNodes=180000){const root=clone(initial),rootKey=stateKey(root);if(solved(root))return[];const q=[root],keys=[rootKey],head={i:0},seen=new Set([rootKey]),parent=new Map(),moveByKey=new Map();let nodes=0;while(head.i<q.length&&nodes++<maxNodes){const bs=q[head.i],bk=keys[head.i++];for(let i=0;i<bs.length;i++){if(!bs[i].length)continue;for(let j=0;j<bs.length;j++){if(!legalState(bs,i,j))continue;if(!bs[j].length&&bs[i].length===CAP&&bs[i].every(x=>x.c===bs[i][0].c))continue;if(!bs[j].length){let earlierEmpty=false;for(let e=0;e<j;e++)if(!bs[e].length){earlierEmpty=true;break}if(earlierEmpty)continue}const n=clone(bs);doPourState(n,i,j);const nk=stateKey(n);if(seen.has(nk))continue;seen.add(nk);parent.set(nk,bk);moveByKey.set(nk,[i,j]);if(solved(n)){const path=[];let k=nk;while(k!==rootKey){path.push(moveByKey.get(k));k=parent.get(k)}return path.reverse()}q.push(n);keys.push(nk)}}}return null}function assignMysteries(bs,lvl,r){const count=Math.min(Math.floor(lvl/2),Math.max(0,bs.length-2)*2);let candidates=[];bs.forEach((a,bi)=>a.forEach((x,i)=>{const depth=a.length-1-i;if(depth>=1)candidates.push({bi,i,depth,score:depth+r()})}));candidates.sort((a,b)=>b.score-a.score);for(let n=0;n<count&&n<candidates.length;n++){const p=candidates[n],x=bs[p.bi][p.i];x.mystery=true}}function exposeTop(){bottles.forEach(a=>{if(!a.length)return;const x=a[a.length-1];if(x.mystery)revealedKeys.add(x.id)})}function isHidden(x){return!!x.mystery&&!revealedKeys.has(x.id)}function makePuzzle(lvl,randomize=false){locked=true;$("#status").textContent="Generating verified puzzle…";const baseSeed=randomize?Date.now():lvl*65537+17;let accepted=null,solution=null,r=null;for(let attempt=0;attempt<40;attempt++){r=rng(baseSeed+attempt*7919);const candidate=generateSolvable(lvl,randomize||attempt>0),mixed=candidate.filter(a=>a.length&&new Set(a.map(x=>x.c)).size>1).length;if(mixed<Math.min(3,candidate.length-2))continue;const path=solvePuzzle(candidate);if(path!==null&&path.length>0){accepted=candidate;solution=path;break}}if(!accepted){const fallback=generateSolvable(Math.max(1,Math.min(lvl,8)),true),path=solvePuzzle(fallback,300000);if(path===null||path.length===0){board.innerHTML="";$("#status").textContent="Could not generate a verified puzzle. Tap NEW PUZZLE to retry.";locked=false;return}accepted=fallback;solution=path;r=rng(Date.now())}bottles=accepted;revealedKeys=new Set;assignMysteries(bottles,lvl,r||rng(baseSeed));exposeTop();startState=clone(bottles);history=[];selected=null;moves=0;extraUsed=false;locked=false;window.__mpVerifiedSolution=solution;render()}function legal(from,to){return legalState(bottles,from,to)}function pour(from,to){if(locked||!legal(from,to)){toast("That pour won't fit");return false}history.push({b:clone(bottles),moves,extraUsed});const run=topRun(bottles[from]),count=Math.min(run.n,CAP-bottles[to].length);for(let i=0;i<count;i++)bottles[to].push(bottles[from].pop());moves++;selected=null;exposeTop();render();if(won())setTimeout(win,260);return true}function won(){return solved(bottles)}function render(){$("#level").textContent=level;$("#coins").textContent=coins;$("#stars").textContent=stars;$("#status").textContent=`${moves} move${moves===1?"":"s"} • Mystery knowledge survives undo`;board.innerHTML="";bottles.forEach((a,i)=>{let b=document.createElement("button");b.className="bottle"+(selected===i?" selected":"");b.setAttribute("aria-label","Bottle "+(i+1));let layers=a.map(x=>`<div class="layer ${isHidden(x)?"hidden":""}" style="${isHidden(x)?"":`background:${COLORS[x.c]}`}"></div>`).join("");b.innerHTML=`<div class="neck"></div><div class="glass"><div class="layers">${layers}</div><div class="shine"></div></div>`;b.onclick=()=>tap(i);board.appendChild(b)})}function tap(i){if(locked)return;if(selected===null){if(!bottles[i].length)return;selected=i;render();return}if(selected===i){selected=null;render();return}if(!pour(selected,i)&&bottles[i].length){selected=i;render()}}function win(){locked=true;let reward=Math.max(20,80-moves)+level*2;coins+=reward;stars++;localStorage.mpCoins=coins;localStorage.mpStars=stars;$("#winText").textContent=`${moves} moves • +${reward} coins`;$("#win").classList.add("show");render()}function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("on");clearTimeout(x.t);x.t=setTimeout(()=>x.classList.remove("on"),1200)}$("#undo").onclick=()=>{if(!history.length)return toast("Nothing to undo");let h=history.pop();bottles=h.b;moves=h.moves;extraUsed=h.extraUsed;selected=null;exposeTop();render()};$("#restart").onclick=()=>{bottles=clone(startState);history=[];moves=0;selected=null;extraUsed=false;exposeTop();render()};$("#extra").onclick=()=>{if(extraUsed)return toast("Extra bottle already added");history.push({b:clone(bottles),moves,extraUsed});bottles.push([]);extraUsed=true;selected=null;render();toast("Extra bottle added")};$("#new").onclick=()=>makePuzzle(level,true);$("#next").onclick=()=>{level++;localStorage.mpLevel=level;$("#win").classList.remove("show");locked=false;makePuzzle(level)};makePuzzle(level)})();
</script></body></html>
