<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b29"><title>Beer Pong Pro | K2 Games</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1826;color:#f7fafc;font:600 14px system-ui,-apple-system,sans-serif;touch-action:none}button,select{font:inherit}button{background:#263e55;color:white;border:1px solid #ffffff36;border-radius:12px;padding:10px 13px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #facc15}.gold{background:#facc15;color:#142435;border:0;font-weight:900}.app{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 9px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 9px)}header,.score,footer{display:flex;align-items:center;justify-content:space-between;gap:8px}header{min-height:42px}header a{color:#c9d9e9;text-decoration:none}h1{font-size:clamp(17px,4.8vw,24px);margin:0;letter-spacing:-.7px}h1 span{color:#facc15}.score>div{background:#1c3045;border:1px solid #ffffff20;border-radius:13px;padding:9px 15px;flex:1;display:flex;align-items:center;justify-content:space-between}.score strong{color:#facc15;font-size:25px}.score small{color:#9db0c5;font-size:10px}.arena{flex:1;min-height:0;position:relative;border:1px solid #ffffff29;border-radius:19px;overflow:hidden;background:#0e2336;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.status,.hint{position:absolute;left:50%;transform:translateX(-50%);background:#091725e6;border:1px solid #ffffff28;border-radius:999px;padding:8px 13px;text-align:center;pointer-events:none;white-space:nowrap;font-size:12px}.status{top:12px;font-weight:900}.hint{bottom:12px;max-width:98%;font-size:11px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#07111cdd;backdrop-filter:blur(9px);padding:16px}.overlay[hidden]{display:none}.panel{width:min(100%,400px);background:#1a3045;border:1px solid #ffffff35;border-radius:24px;padding:23px;text-align:center;box-shadow:0 25px 70px #0008}.panel h2{font-size:clamp(27px,8vw,43px);line-height:1.02;color:#facc15;margin:0}.panel p{color:#c4d5e5;line-height:1.5}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:18px 0}.settings label{font-size:11px;color:#b7c9db}.settings select{display:block;width:100%;margin-top:6px;padding:10px 4px;background:#304b63;color:white;border:1px solid #ffffff33;border-radius:10px}.panel .gold{width:100%;padding:15px;font-size:16px}footer{min-height:40px}footer small{color:#a7b9ca;font-size:11px}.meter{position:absolute;right:12px;top:35%;height:120px;width:9px;background:#ffffff44;border-radius:8px;overflow:hidden}.meter[hidden]{display:none}.meter i{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(#ef4444,#facc15,#4ade80)}
</style></head><body><main class="app"><header><a href="index.html">← HUB</a><h1>🍺 BEER PONG <span>PRO</span></h1><button id="audio" aria-label="Toggle audio">🔊</button><button id="menu" aria-label="Game settings">⚙</button></header><section class="score"><div>YOU <strong id="pc">10</strong></div><small>CUPS LEFT</small><div>CPU <strong id="cc">10</strong></div></section><section class="arena" id="arena"><canvas id="board" aria-label="Interactive beer pong table"></canvas><div class="status" id="status" aria-live="polite">READY</div><div class="hint" id="hint">Drag down to pull back • Release to shoot</div><div class="meter" id="meter" hidden><i id="fill"></i></div><div class="overlay" id="overlay"><div class="panel"><h2 id="title">BEER PONG<br>PRO</h2><p id="description">Flick to shoot. Master the arc, bounce shots and rim rebounds. Clear the CPU rack to win.</p><div class="settings"><label>DIFFICULTY<select id="difficulty"><option value="easy">Casual</option><option value="normal" selected>Competitive</option><option value="hard">Expert</option></select></label><label>CUPS<select id="cups"><option value="6">6 cups</option><option value="10" selected>10 cups</option></select></label></div><button class="gold" id="play">PLAY</button></div></div></section><footer><small id="info">First to clear the rack wins</small><button id="restart">Restart</button><button id="help">Help</button></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d'),arena=$('arena'),G=9.81,R=.028,C=.052,H=.085,START=.20,STEP=1/120;let w=1,h=1,dpr=1,scale=1,mode='menu',turn='player',racks={player:[],cpu:[]},ball=null,drag=null,last=0,acc=0,timer=0,round=1,fx=[],sound=true,audio=null,settings={cups:10,difficulty:'normal'};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);function resize(){const b=arena.getBoundingClientRect();w=b.width;h=b.height;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min((w-22)/1.2,(h-32)/2.42)}new ResizeObserver(resize).observe(arena);const project=(x,y,z=0)=>({x:w/2+x*scale,y:h/2+y*scale-z*scale*.55});function beep(freq=400){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.11);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.11)}catch{}}function text(s){$('status').textContent=s}function rack(side){const rows=settings.cups===6?[3,2,1]:[4,3,2,1],out=[];for(let i=0;i<rows.length;i++)for(let j=0;j<rows[i];j++)out.push({x:(j-(rows[i]-1)/2)*.12,y:(side==='cpu'?-1:1)*(.86-i*.12),alive:true,flash:0});return out}function count(){const p=racks.player.filter(c=>c.alive).length,c=racks.cpu.filter(c=>c.alive).length;$('pc').textContent=p;$('cc').textContent=c;return{p,c}}function start(){settings.cups=+$('cups').value;settings.difficulty=$('difficulty').value;racks={player:rack('player'),cpu:rack('cpu')};turn='player';mode='ready';round=1;ball=null;drag=null;fx=[];$('overlay').hidden=true;$('meter').hidden=true;count();text('YOUR TURN');$('hint').textContent='Drag DOWN and sideways • Release to shoot';$('info').textContent='Round 1 • Your shot'}function modal(title,description){mode='menu';ball=null;drag=null;$('meter').hidden=true;$('title').textContent=title;$('description').textContent=description;$('play').textContent='START MATCH';$('overlay').hidden=false}function aim(dx,dy){const power=clamp(dy/Math.max(110,h*.28),0,1);return{power,x:clamp(-dx/Math.max(120,w*.35)*.46,-.48,.48),y:-.25-power*.82,time:.75+power*.52}}function velocity(x,y,from,time){return{vx:x/time,vy:(y-from)/time,vz:(-START+.5*G*time*time)/time}}function launch(side,x,y,time){const from=side==='player'?1.07:-1.07,v=velocity(x,y,from,time);ball={side,x:0,y:from,z:START,...v,age:0,bounces:0,cooldown:0,trail:[]};mode='flight';drag=null;$('meter').hidden=true;text(side==='player'?'BALL IN FLIGHT':'CPU SHOOTS');beep(260)}function point(e){const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}canvas.addEventListener('pointerdown',e=>{if(mode!=='ready'||turn!=='player')return;e.preventDefault();const p=point(e);drag={id:e.pointerId,start:p,now:p};canvas.setPointerCapture(e.pointerId);mode='aim';$('meter').hidden=false});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.now=point(e);const a=aim(drag.now.x-drag.start.x,drag.now.y-drag.start.y);$('fill').style.height=Math.round(a.power*100)+'%';text('POWER '+Math.round(a.power*100)+'%')});function release(e,cancel){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;$('meter').hidden=true;if(cancel){mode='ready';text('YOUR TURN');return}const a=aim(d.now.x-d.start.x,d.now.y-d.start.y);if(a.power<.08){mode='ready';text('PULL BACK TO SHOOT');return}launch('player',a.x,a.y,a.time)}canvas.addEventListener('pointerup',e=>release(e,false));canvas.addEventListener('pointercancel',e=>release(e,true));canvas.addEventListener('lostpointercapture',e=>release(e,true));function finish(hit){if(!ball)return;const side=ball.side;ball=null;const c=count();text(hit?(side==='player'?'SUNK IT! 🎯':'CPU SCORES'):(side==='player'?'MISSED!':'CPU MISSES'));if(hit)beep(760);if(!c.p||!c.c){mode='endwait';timer=1.15}else{turn=side==='player'?'cpu':'player';mode='wait';timer=.75}}function tick(dt){for(const c of [...racks.player,...racks.cpu])c.flash=Math.max(0,c.flash-dt*4);for(const f of fx){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt}fx=fx.filter(f=>f.life>0);if(mode==='wait'||mode==='endwait'){timer-=dt;if(timer<=0){if(mode==='endwait'){const c=count();modal(c.c===0?'YOU WIN! 🏆':'CPU WINS','Great match. Play again?')}else{round++;$('info').textContent='Round '+round+' • '+(turn==='player'?'Your shot':'CPU shot');if(turn==='cpu'){mode='cpuwait';timer=.8;text('CPU AIMING')}else{mode='ready';text('YOUR TURN')}}}}else if(mode==='cpuwait'){timer-=dt;if(timer<=0){const targets=racks.player.filter(c=>c.alive);if(!targets.length)return;const target=targets[Math.floor(Math.random()*targets.length)],spread={easy:.17,normal:.10,hard:.045}[settings.difficulty];launch('cpu',target.x+rnd(-spread,spread),target.y+rnd(-spread,spread),rnd(.96,1.23))}}if(mode!=='flight'||!ball)return;const b=ball,oldZ=b.z;b.age+=dt;b.cooldown=Math.max(0,b.cooldown-dt);b.vz-=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.trail.push({x:b.x,y:b.y,z:b.z});if(b.trail.length>12)b.trail.shift();if(b.cooldown===0)for(const c of racks[b.side==='player'?'cpu':'player']){if(!c.alive)continue;const dist=Math.hypot(b.x-c.x,b.y-c.y);if(dist>C+R+.01)continue;const opening=C-R*.35;if(b.vz<0&&oldZ>=H-R&&b.z<=H+R&&dist<opening){c.alive=false;c.flash=1;for(let i=0;i<15;i++)fx.push({x:c.x,y:c.y,vx:rnd(-.4,.4),vy:rnd(-.4,.4),life:rnd(.2,.7)});finish(true);return}if(Math.abs(b.z-H)<R*.9&&dist<C+R&&dist>=opening*.8){const nx=(b.x-c.x)/(dist||1),ny=(b.y-c.y)/(dist||1),v=b.vx*nx+b.vy*ny;b.vx-=1.5*v*nx;b.vy-=1.5*v*ny;b.vz=Math.max(b.vz,.4);b.cooldown=.06;beep(460)}}if(b.z<=R){b.z=R;if(b.bounces>=2||Math.abs(b.vz)<.55){finish(false);return}b.vz=Math.abs(b.vz)*.4;b.vx*=.73;b.vy*=.73;b.bounces++;beep(190)}if(Math.abs(b.x)>1.1||Math.abs(b.y)>1.8||b.age>3.3)finish(false)}
function drawCup(c){if(!c.alive)return;const p=project(c.x,c.y),r=C*scale;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(p.x+3,p.y+5,r,r*.82,0,0,7);ctx.fill();const g=ctx.createRadialGradient(p.x-r*.3,p.y-r*.3,1,p.x,p.y,r);g.addColorStop(0,'#fa5960');g.addColorStop(1,'#a21d32');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.85,0,0,7);ctx.fill();ctx.fillStyle='#d6a35c';ctx.beginPath();ctx.ellipse(p.x,p.y,r*.75,r*.61,0,0,7);ctx.fill();ctx.strokeStyle=c.flash?'#facc15':'white';ctx.lineWidth=Math.max(2,scale*.012);ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.85,0,0,7);ctx.stroke()}function drawBall(x,y,z,alpha=1){const p=project(x,y,z),r=Math.max(3,R*scale);ctx.globalAlpha=alpha;const g=ctx.createRadialGradient(p.x-r*.35,p.y-r*.4,1,p.x,p.y,r);g.addColorStop(0,'white');g.addColorStop(1,'#bfcbd8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.globalAlpha=1}function draw(){ctx.fillStyle='#0e2336';ctx.fillRect(0,0,w,h);const a=project(-.59,-1.18),b=project(.59,1.18);ctx.shadowColor='#0009';ctx.shadowBlur=25;ctx.shadowOffsetY=8;ctx.fillStyle='#643b2d';ctx.beginPath();ctx.roundRect(a.x,a.y,b.x-a.x,b.y-a.y,15);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;const wood=ctx.createLinearGradient(a.x,a.y,b.x,b.y);wood.addColorStop(0,'#8a513b');wood.addColorStop(.5,'#593323');wood.addColorStop(1,'#86503b');ctx.fillStyle=wood;ctx.beginPath();ctx.roundRect(a.x+5,a.y+5,b.x-a.x-10,b.y-a.y-10,11);ctx.fill();ctx.strokeStyle='#ffffff25';for(let i=1;i<7;i++){const x=a.x+(b.x-a.x)*i/7;ctx.beginPath();ctx.moveTo(x,a.y+8);ctx.lineTo(x,b.y-8);ctx.stroke()}for(const c of racks.cpu)drawCup(c);for(const c of racks.player)drawCup(c);if(mode==='aim'&&drag){const a=aim(drag.now.x-drag.start.x,drag.now.y-drag.start.y),v=velocity(a.x,a.y,1.07,a.time);ctx.setLineDash([5,8]);ctx.strokeStyle='#ffe27b';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=32;i++){const t=a.time*i/32,p=project(v.vx*t,1.07+v.vy*t,START+v.vz*t-.5*G*t*t);if(i)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y)}ctx.stroke();ctx.setLineDash([]);drawBall(0,1.07,START)}else if(mode==='ready')drawBall(0,1.07,START);if(ball){const p=project(ball.x,ball.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(2,R*scale),Math.max(2,R*scale*.5),0,0,7);ctx.fill();ball.trail.forEach((t,i)=>drawBall(t.x,t.y,t.z,(i+1)/ball.trail.length*.17));drawBall(ball.x,ball.y,ball.z)}for(const f of fx){const p=project(f.x,f.y,.08);ctx.globalAlpha=clamp(f.life/.7,0,1);ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1}function loop(now){if(!last)last=now;acc+=Math.min(.05,(now-last)/1000);last=now;let n=0;while(acc>=STEP&&n++<7){tick(STEP);acc-=STEP}draw();requestAnimationFrame(loop)}$('play').onclick=start;$('restart').onclick=()=>modal('RESTART?','Start a new match? Your current progress will be replaced.');$('menu').onclick=()=>modal('SETTINGS','Choose the difficulty and rack size, then begin a fresh match.');$('help').onclick=()=>modal('HOW TO PLAY','Touch anywhere on the table, drag DOWN to build power and sideways to aim. Follow the dotted trajectory and release. Sink all opponent cups to win.');$('audio').onclick=()=>{sound=!sound;$('audio').textContent=sound?'🔊':'🔇'};resize();requestAnimationFrame(loop)})();
</script></body></html>
