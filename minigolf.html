<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Golf - K2 Games</title>
<style>
:root{--grass:#4fae55;--fairway:#83cf75;--sand:#e8c97d;--water:#66b8e8;--panel:rgba(18,40,24,.9);--text:#f8fafc;--accent:#facc15}
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#23452a;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
nav{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#18321f;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{font-weight:950;font-size:1.2rem}.back{color:#fff;text-decoration:none;font-weight:900}
#game-container{position:relative;height:calc(100% - 58px);display:grid;place-items:center;padding:10px;background:linear-gradient(#2f6a38,#23452a)}
canvas{width:min(94vw,620px);height:min(calc(100vh - 86px),820px);max-height:calc(100vh - 86px);aspect-ratio:3/4;background:var(--fairway);border:8px solid #244d2b;border-radius:22px;box-shadow:0 20px 45px rgba(0,0,0,.3)}
#hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.card{background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 14px;text-align:center;min-width:86px}.label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:#cbd5e1;font-weight:900}.val{font-size:1.25rem;font-weight:950;color:#fff}
.overlay{position:absolute;inset:0;background:rgba(16,32,19,.88);display:grid;place-items:center;text-align:center;padding:22px;z-index:4}.modal{background:#fffdf2;color:#12351d;border-radius:24px;padding:26px;max-width:520px;width:min(92vw,520px);box-shadow:0 24px 70px rgba(0,0,0,.35)}button{border:0;border-radius:999px;background:#256d35;color:white;font-weight:950;padding:14px 26px;margin-top:14px;cursor:pointer}.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.mode{background:#e7f6df;color:#173b1d;border:2px solid transparent}.mode.active{border-color:#256d35;background:#d1efc6}
#tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#173b1d;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.9rem;white-space:nowrap}
</style>
</head>
<body>
<nav><div class="logo">⛳ Mini Golf</div><a class="back" href="index.html">← HUB</a></nav>
<div id="game-container">
 <canvas id="game"></canvas>
 <div id="hud"><div class="card"><div class="label">Hole</div><div class="val" id="hole">1</div></div><div class="card"><div class="label" id="p1label">Strokes</div><div class="val" id="p1">0</div></div><div class="card" id="p2card" style="display:none"><div class="label">P2</div><div class="val" id="p2">0</div></div></div>
 <div id="tip">Drag back from the ball, then release to tee off.</div>
 <div class="overlay" id="start"><div class="modal"><h1>Mini Golf</h1><p>Classic green course. No neon. Tee off works with mouse, touch, or pointer.</p><div class="modes"><button class="mode active" data-mode="solo">Solo</button><button class="mode" data-mode="multi">Pass & Play</button></div><button id="play">TEE OFF</button></div></div>
 <div class="overlay" id="holeOver" style="display:none"><div class="modal"><h1 id="holeTitle">Hole Complete</h1><p id="holeText"></p><button id="next">Next Hole</button></div></div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const holeEl=document.getElementById('hole'),p1El=document.getElementById('p1'),p2El=document.getElementById('p2'),p2card=document.getElementById('p2card'),p1label=document.getElementById('p1label'),start=document.getElementById('start'),holeOver=document.getElementById('holeOver'),holeTitle=document.getElementById('holeTitle'),holeText=document.getElementById('holeText');
const W=600,H=800,DPR=Math.min(devicePixelRatio||1,1.5);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
let mode='solo',level=0,turn=0,drag=null,last=performance.now(),playing=false;
const players=[{hole:0,total:0,done:false},{hole:0,total:0,done:false}];
const ball={x:300,y:700,vx:0,vy:0,r:10,moving:false};
let cup={x:300,y:110,r:19},walls=[],sand=[],water=[];
const holes=[
 {b:[300,705],c:[300,105],w:[],s:[[210,340,180,60]],wa:[]},
 {b:[110,705],c:[500,105],w:[[180,360,300,18]],s:[[60,520,130,70]],wa:[]},
 {b:[300,705],c:[300,95],w:[[80,260,360,18],[160,470,360,18]],s:[],wa:[[420,590,120,70]]},
 {b:[92,690],c:[505,120],w:[[0,390,390,18],[210,215,390,18]],s:[[260,505,150,80]],wa:[]},
 {b:[300,705],c:[500,115],w:[[120,160,18,480],[335,285,18,430]],s:[[380,440,120,85]],wa:[[60,585,150,85]]}
];
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));p2card.style.display=m==='multi'?'block':'none';p1label.textContent=m==='multi'?'P1':'Strokes'}
function newGame(){level=0;turn=0;players.forEach(p=>{p.hole=0;p.total=0;p.done=false});start.style.display='none';holeOver.style.display='none';playing=true;loadHole()}
function loadHole(){const h=holes[level%holes.length];ball.x=h.b[0];ball.y=h.b[1];ball.vx=ball.vy=0;ball.moving=false;cup={x:h.c[0],y:h.c[1],r:19};walls=h.w.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));sand=h.s.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));water=h.wa.map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));players.forEach(p=>{p.hole=0;p.done=false});turn=0;updateUI()}
function pos(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
function down(e){if(!playing||ball.moving||players[turn].done)return;const p=pos(e);e.preventDefault();drag={x:p.x,y:p.y,cx:p.x,cy:p.y};}
function move(e){if(drag){const p=pos(e);drag.cx=p.x;drag.cy=p.y;e.preventDefault()}}
function up(e){if(!drag)return;const p=drag.cx!=null?{x:drag.cx,y:drag.cy}:pos(e);let dx=ball.x-p.x,dy=ball.y-p.y,pow=Math.min(150,Math.hypot(dx,dy));if(pow>8){players[turn].hole++;ball.vx=dx*.115;ball.vy=dy*.115;ball.moving=true;updateUI()}drag=null;e&&e.preventDefault&&e.preventDefault()}
function updateUI(){holeEl.textContent=(level%holes.length)+1;p1El.textContent=mode==='solo'?players[0].hole:players[0].total+players[0].hole;p2El.textContent=players[1].total+players[1].hole}
function inRect(o,r=ball.r){return ball.x+r>o.x&&ball.x-r<o.x+o.w&&ball.y+r>o.y&&ball.y-r<o.y+o.h}
function update(dt){if(!playing||!ball.moving)return;ball.x+=ball.vx;ball.y+=ball.vy;let friction=.985;if(sand.some(s=>inRect(s)))friction=.94;ball.vx*=friction;ball.vy*=friction;
 if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.72} if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.72} if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)*.72} if(ball.y>H-ball.r){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)*.72}
 for(const w of walls){if(inRect(w)){const ox=Math.min(Math.abs(ball.x-w.x),Math.abs(ball.x-(w.x+w.w))),oy=Math.min(Math.abs(ball.y-w.y),Math.abs(ball.y-(w.y+w.h)));if(ox<oy)ball.vx*=-.8;else ball.vy*=-.8;ball.x+=Math.sign(ball.vx)*2;ball.y+=Math.sign(ball.vy)*2}}
 if(water.some(w=>inRect(w))){const h=holes[level%holes.length];ball.x=h.b[0];ball.y=h.b[1];ball.vx=ball.vy=0;ball.moving=false;players[turn].hole++;updateUI()}
 if(Math.hypot(ball.x-cup.x,ball.y-cup.y)<cup.r-2 && Math.hypot(ball.vx,ball.vy)<5.5){players[turn].done=true;players[turn].total+=players[turn].hole;ball.moving=false;if(mode==='multi'&&turn===0){turn=1;const h=holes[level%holes.length];ball.x=h.b[0];ball.y=h.b[1];players[1].hole=0}else finishHole();updateUI()}
 if(Math.hypot(ball.vx,ball.vy)<.08){ball.vx=ball.vy=0;ball.moving=false;updateUI()}
}
function finishHole(){playing=false;holeTitle.textContent=level===holes.length-1?'Course Complete':'Hole Complete';holeText.textContent=mode==='solo'?`Hole strokes: ${players[0].hole} • Total: ${players[0].total}`:`P1 ${players[0].total} • P2 ${players[1].total}`;holeOver.style.display='grid'}
function nextHole(){level++;if(level>=holes.length){start.style.display='grid';holeOver.style.display='none'}else{playing=true;holeOver.style.display='none';loadHole()}}
function draw(){ctx.fillStyle='#65b85e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#8bd47a';round(38,38,W-76,H-76,34);ctx.fill();ctx.strokeStyle='#2f6b38';ctx.lineWidth=8;ctx.stroke();
 ctx.fillStyle='#e6c678';for(const s of sand){round(s.x,s.y,s.w,s.h,28);ctx.fill()}ctx.fillStyle='#69b8e6';for(const w of water){round(w.x,w.y,w.w,w.h,24);ctx.fill()}
 ctx.fillStyle='#5b4630';for(const w of walls){round(w.x,w.y,w.w,w.h,6);ctx.fill()}ctx.fillStyle='#111';ctx.beginPath();ctx.arc(cup.x,cup.y,cup.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cup.x,cup.y);ctx.lineTo(cup.x,cup.y-54);ctx.stroke();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(cup.x,cup.y-54);ctx.lineTo(cup.x+35,cup.y-43);ctx.lineTo(cup.x,cup.y-32);ctx.closePath();ctx.fill();
 if(drag){const p={x:drag.cx??drag.x,y:drag.cy??drag.y};ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=4;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([])}
 ctx.fillStyle='white';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#cbd5e1';ctx.lineWidth=2;ctx.stroke();
}
function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.getElementById('play').addEventListener('click',newGame);document.getElementById('next').addEventListener('click',nextHole);
canvas.addEventListener('pointerdown',down);addEventListener('pointermove',move);addEventListener('pointerup',up);canvas.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up,{passive:false});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
