<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Marble Rush - K2 Games</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:54px 1fr 70px;gap:6px;padding:8px;background:linear-gradient(#1e293b,#0f172a)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950}.back{color:white;text-decoration:none;background:#ffffff14;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px;font-weight:950}.hud{display:flex;gap:8px}.stat{background:#020617cc;border:1px solid #ffffff24;border-radius:14px;padding:7px 10px;text-align:center;min-width:74px}.label{font-size:.58rem;color:#cbd5e1;text-transform:uppercase;font-weight:900}.val{font-weight:950;color:#facc15}.stage{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;border-radius:20px;border:1px solid #ffffff24;background:#111827}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}button{border:0;border-radius:13px;background:#334155;color:white;font-weight:950}.primary{background:#facc15;color:#111827}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,23,42,.82);text-align:center;padding:20px}.modal{width:min(92vw,640px);background:#f8fafc;color:#0f172a;border-radius:24px;padding:24px}.modal h1{font-size:2.7rem;margin:0 0 8px}.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#020617dd;border:1px solid #ffffff24;border-radius:999px;padding:8px 14px;font-weight:950;opacity:0;transition:.15s}.toast.show{opacity:1}@media(max-width:760px){.app{grid-template-rows:48px 1fr 58px;padding:6px}.hud{gap:4px}.stat{min-width:58px;padding:6px}.controls{grid-template-columns:repeat(2,1fr)}.logo{font-size:.92rem}}</style></head><body><div class="app"><header><div class="logo">🔴 Marble Rush</div><div class="hud"><div class="stat"><div class="label">Leader</div><div class="val" id="lead">-</div></div><div class="stat"><div class="label">Race</div><div class="val" id="race">0</div></div><div class="stat"><div class="label">Track</div><div class="val" id="track">A</div></div></div><a class="back" href="index.html">← HUB</a></header><section class="stage"><canvas id="game"></canvas><div class="toast" id="toast">FINISH!</div><div class="overlay" id="overlay"><div class="modal"><h1>🔴 Marble Rush</h1><p>Full marble drop race simulation: gravity, lanes, pegs, bumpers, funnels, gates, wall bounces, rolling friction, momentum, and randomized track remixes.</p><button class="primary" id="start">DROP MARBLES</button></div></div></section><div class="controls"><button id="remix">Remix Track</button><button id="slow">Slow Mo</button><button class="primary" id="drop">Drop Race</button><button id="reset">Reset</button><button id="auto">Auto</button></div></div><script>(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),leadEl=document.getElementById('lead'),raceEl=document.getElementById('race'),trackEl=document.getElementById('track'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay');let W=720,H=900,DPR=1,last=performance.now(),running=false,race=0,trackNo=1,slow=false,auto=false,toastT=0,winner=null;const colors=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#06b6d4'];let marbles=[],pegs=[],walls=[],gates=[];function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);build(false)}new ResizeObserver(resize).observe(cv);function show(t){toast.textContent=t;toast.classList.add('show');toastT=1}function build(reset=true){pegs=[];walls=[];gates=[];const rows=9,cols=6;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){pegs.push({x:W*(.16+c*.14+(r%2)*.07),y:H*(.18+r*.07),r:9+(r%3)*2})}for(let i=0;i<5;i++){const y=H*(.34+i*.105),s=i%2?-1:1;walls.push({x1:W*(s<0?.08:.42),y1:y,x2:W*(s<0?.58:.92),y2:y+H*.045})}for(let i=0;i<4;i++)gates.push({x:W*(.22+i*.19),y:H*.75,w:W*.12,h:10,phase:Math.random()*6});if(reset)resetMarbles()}function resetMarbles(){winner=null;marbles=colors.map((c,i)=>({name:['Red','Blue','Green','Gold','Purple','Cyan'][i],c,x:W*(.18+i*.13),y:H*.06,vx:(Math.random()-.5)*1.2,vy:0,r:12,done:false,place:0,trail:[]}));running=false;ui()}function drop(){race++;winner=null;resetMarbles();running=true;overlay.style.display='none';show('MARBLES DROPPED');ui()}function remix(){trackNo++;build(true);show('TRACK REMIXED');ui()}function ui(){let live=marbles.filter(m=>!m.done).sort((a,b)=>b.y-a.y)[0],done=marbles.filter(m=>m.done).sort((a,b)=>a.place-b.place)[0];leadEl.textContent=(done||live||{}).name||'-';raceEl.textContent=race;trackEl.textContent=String.fromCharCode(64+((trackNo-1)%26)+1)}function lineHit(m,l){const ax=l.x1,ay=l.y1,bx=l.x2,by=l.y2,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((m.x-ax)*dx+(m.y-ay)*dy)/(dx*dx+dy*dy))),px=ax+t*dx,py=ay+t*dy,dd=Math.hypot(m.x-px,m.y-py);if(dd<m.r+3){const nx=-(dy),ny=dx,nl=Math.hypot(nx,ny)||1,ux=nx/nl,uy=ny/nl;const dot=m.vx*ux+m.vy*uy;if(dot<0){m.vx-=1.65*dot*ux;m.vy-=1.65*dot*uy;m.x=px+ux*(m.r+3);m.y=py+uy*(m.r+3);m.vx*=.96;m.vy*=.96}}}function pegHit(m,p){const dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy),min=m.r+p.r;if(d>0&&d<min){const nx=dx/d,ny=dy/d,over=min-d;m.x+=nx*over;m.y+=ny*over;const dot=m.vx*nx+m.vy*ny;m.vx-=1.75*dot*nx;m.vy-=1.75*dot*ny;m.vx+=(Math.random()-.5)*.35;m.vy*=.96}}function collideMarbles(a,b){const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>0&&d<min){const nx=dx/d,ny=dy/d,over=(min-d)/2;a.x+=nx*over;b.x-=nx*over;a.y+=ny*over;b.y-=ny*over;const av=a.vx*nx+a.vy*ny,bv=b.vx*nx+b.vy*ny;a.vx+=(bv-av)*nx*.85;a.vy+=(bv-av)*ny*.85;b.vx+=(av-bv)*nx*.85;b.vy+=(av-bv)*ny*.85}}function physics(dt){const steps=slow?2:4,sub=dt/steps;for(let k=0;k<steps;k++){gates.forEach(g=>g.open=Math.sin(performance.now()/600+g.phase)>-.2);for(const m of marbles){if(m.done)continue;m.vy+=980*sub;m.vx*=Math.pow(.996,sub*60);m.vy*=Math.pow(.999,sub*60);m.x+=m.vx*sub;m.y+=m.vy*sub;if(m.x<m.r){m.x=m.r;m.vx=Math.abs(m.vx)*.78}if(m.x>W-m.r){m.x=W-m.r;m.vx=-Math.abs(m.vx)*.78}pegs.forEach(p=>pegHit(m,p));walls.forEach(l=>lineHit(m,l));gates.forEach(g=>{if(!g.open&&m.x>g.x&&m.x<g.x+g.w&&m.y+m.r>g.y&&m.y<g.y+g.h){m.y=g.y-m.r;m.vy*=-.42;m.vx+=(Math.random()-.5)*1.8}});if(m.y>H*.92&&!m.done){m.done=true;m.place=marbles.filter(x=>x.done).length;if(m.place===1){winner=m;show(m.name+' WINS!')}}m.trail.push({x:m.x,y:m.y});if(m.trail.length>20)m.trail.shift()}}for(let i=0;i<marbles.length;i++)for(let j=i+1;j<marbles.length;j++)if(!marbles[i].done&&!marbles[j].done)collideMarbles(marbles[i],marbles[j]);}if(marbles.every(m=>m.done)){running=false;if(auto)setTimeout(drop,700)}ui()}function draw(){ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0f172a';ctx.fillRect(W*.06,H*.03,W*.88,H*.9);ctx.strokeStyle='#334155';ctx.lineWidth=2;ctx.strokeRect(W*.06,H*.03,W*.88,H*.9);ctx.fillStyle='#22c55e55';ctx.fillRect(W*.06,H*.91,W*.88,8);walls.forEach(l=>{ctx.strokeStyle='#94a3b8';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke()});pegs.forEach(p=>{ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(p.x-3,p.y-3,p.r*.35,0,Math.PI*2);ctx.fill()});gates.forEach(g=>{ctx.fillStyle=g.open?'#22c55e':'#ef4444';ctx.fillRect(g.x,g.y,g.w,g.h)});marbles.forEach(m=>{ctx.strokeStyle=m.c+'55';ctx.lineWidth=3;ctx.beginPath();m.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(m.x-4,m.y-5,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText(m.name[0],m.x,m.y+4)});ctx.fillStyle='#cbd5e1';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText('Peg board + sloped rails + timed gates + marble collisions',W/2,H-14)}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}if(running)physics(dt*(slow?.45:1));draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=drop;document.getElementById('drop').onclick=drop;document.getElementById('remix').onclick=remix;document.getElementById('reset').onclick=resetMarbles;document.getElementById('slow').onclick=()=>{slow=!slow;show(slow?'SLOW MO':'FULL SPEED')};document.getElementById('auto').onclick=()=>{auto=!auto;show(auto?'AUTO ON':'AUTO OFF')};resize();build(true);requestAnimationFrame(loop)})();</script></body></html>
