<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Surf Rush</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#09b8d1;font-family:system-ui,Segoe UI,sans-serif;color:#062b3b}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:14px 16px auto;display:flex;justify-content:center;gap:38px;pointer-events:none;font-weight:950}.pill{background:#e8fff8dd;border:2px solid #07556b;border-radius:999px;padding:8px 16px;box-shadow:0 4px 0 #07556b}.back{position:fixed;left:14px;top:14px;text-decoration:none;color:#062b3b;background:#e8fff8dd;border:2px solid #07556b;border-radius:12px;padding:8px 10px;font-weight:800}.boost{position:fixed;right:14px;bottom:16px;border:0;border-radius:50%;width:74px;height:74px;font-size:30px;background:#ffe438;box-shadow:0 6px 0 #9c7e00;font-weight:950}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#04a9c5cc;text-align:center}.panel{background:#eaffff;border:3px solid #07556b;border-radius:20px;padding:24px;max-width:380px;box-shadow:10px 10px 0 #07556b}.panel h1{font-size:40px;margin:0 0 8px}.panel button{font:inherit;font-weight:950;padding:12px 18px;border:0;border-radius:12px;color:white;background:#07556b}.hidden{display:none}</style></head><body><canvas id="c"></canvas><a class="back" href="./">← Hub</a><div class="hud"><span class="pill" id="hearts">♥♥♥</span><span class="pill" id="score">0 m</span><span class="pill" id="bolts">⚡0</span></div><button class="boost" id="boost">⚡</button><div id="overlay" class="overlay"><div class="panel"><h1>🏄 Surf Rush</h1><p>Steer through buoys and rocks, collect hearts and lightning, then boost away from the sea monster.</p><button id="start">Catch a Wave</button></div></div><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),ov=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),heartEl=document.querySelector('#hearts'),boltEl=document.querySelector('#bolts');let W,H,dpr,last,run=false,score=0,speed=300,spawn=0,lives=3,bolts=0,boostT=0,inv=0;let items=[],foam=[];const p={x:0,y:0,r:22,targetX:0,targetY:0};const hiKey='k2-surf-rush-hi';let high=+localStorage.getItem(hiKey)||0;function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);if(!run){p.x=W/2;p.y=H*.68;p.targetX=p.x;p.targetY=p.y}}addEventListener('resize',resize);resize();function reset(){score=0;speed=300;spawn=.5;lives=3;bolts=0;boostT=0;inv=0;items=[];foam=[];p.x=W/2;p.y=H*.68;p.targetX=p.x;p.targetY=p.y}function start(){reset();run=true;ov.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;function point(e){const r=c.getBoundingClientRect();p.targetX=(e.clientX-r.left)*W/r.width;p.targetY=Math.max(H*.28,(e.clientY-r.top)*H/r.height)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);point(e)});c.addEventListener('pointermove',e=>{if(e.buttons)point(e)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')p.targetX-=70;if(e.key==='ArrowRight')p.targetX+=70;if(e.key==='ArrowUp')p.targetY-=70;if(e.key==='ArrowDown')p.targetY+=70;if(e.code==='Space'){e.preventDefault();useBoost()}});document.querySelector('#boost').onclick=useBoost;function useBoost(){if(bolts>0&&run&&boostT<=0){bolts--;boostT=2.2}}function spawnItem(){let r=Math.random(),type=r<.58?'rock':r<.78?'buoy':r<.91?'bolt':'heart';items.push({x:45+Math.random()*(W-90),y:-70,r:type==='rock'?24:18,type,spin:Math.random()*6})}function collide(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function end(){run=false;high=Math.max(high,Math.floor(score));localStorage.setItem(hiKey,high);ov.querySelector('h1').textContent='Wipeout!';ov.querySelector('p').textContent=`Distance ${Math.floor(score)} m · Best ${high} m`;ov.querySelector('button').textContent='Surf Again';ov.classList.remove('hidden')}function loop(t){if(!run)return;let dt=Math.min(.032,(t-last)/1000);last=t;boostT=Math.max(0,boostT-dt);inv=Math.max(0,inv-dt);let mult=boostT>0?1.75:1;score+=dt*speed*.08*mult;speed=300+Math.min(340,score*.7);spawn-=dt;if(spawn<=0){spawnItem();spawn=.34+Math.random()*.48-speed/1700}p.targetX=Math.max(28,Math.min(W-28,p.targetX));p.targetY=Math.max(H*.3,Math.min(H-38,p.targetY));p.x+=(p.targetX-p.x)*Math.min(1,dt*8);p.y+=(p.targetY-p.y)*Math.min(1,dt*8);for(const it of items){it.y+=speed*dt*mult;it.spin+=dt*2}for(let i=items.length-1;i>=0;i--){const it=items[i];if(collide(p,it)){if(it.type==='rock'||it.type==='buoy'){if(inv<=0&&boostT<=0){lives--;inv=1.4;if(lives<=0)return end()}}else if(it.type==='bolt')bolts=Math.min(5,bolts+1);else lives=Math.min(5,lives+1);items.splice(i,1)}else if(it.y>H+80)items.splice(i,1)}if(Math.random()<dt*12)foam.push({x:Math.random()*W,y:-10,s:2+Math.random()*4});for(const f of foam)f.y+=speed*.55*dt;foam=foam.filter(f=>f.y<H+20);draw(mult);heartEl.textContent='♥'.repeat(lives);boltEl.textContent='⚡'+bolts;scoreEl.textContent=Math.floor(score)+' m';requestAnimationFrame(loop)}function draw(mult){const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#08a9c6');grd.addColorStop(1,'#20d1dc');g.fillStyle=grd;g.fillRect(0,0,W,H);g.globalAlpha=.18;g.strokeStyle='#d9ffff';g.lineWidth=3;for(let y=(performance.now()*.04*mult)%80-80;y<H;y+=80){g.beginPath();for(let x=0;x<W+30;x+=30)g.lineTo(x,y+Math.sin((x+y)*.035)*8);g.stroke()}g.globalAlpha=1;for(const f of foam){g.fillStyle='#eaffffaa';g.beginPath();g.arc(f.x,f.y,f.s,0,7);g.fill()}for(const it of items){g.save();g.translate(it.x,it.y);if(it.type==='rock'){g.fillStyle='#596c79';g.beginPath();g.moveTo(-25,18);g.lineTo(-15,-14);g.lineTo(2,-25);g.lineTo(25,15);g.closePath();g.fill();g.fillStyle='#91a7b3';g.beginPath();g.moveTo(-12,-10);g.lineTo(2,-21);g.lineTo(8,-5);g.closePath();g.fill()}else if(it.type==='buoy'){g.fillStyle='#ffcc22';g.fillRect(-9,-22,18,44);g.fillStyle='#ff6b35';g.fillRect(-9,4,18,18)}else{g.font='34px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(it.type==='bolt'?'⚡':'♥',0,0)}g.restore()}if(inv>0&&Math.floor(inv*10)%2===0)g.globalAlpha=.35;g.save();g.translate(p.x,p.y);g.rotate((p.targetX-p.x)*.003);g.fillStyle=boostT>0?'#fff33d':'#fff';g.beginPath();g.ellipse(0,10,15,34,0,0,7);g.fill();g.fillStyle='#ff795f';g.beginPath();g.arc(0,-7,13,0,7);g.fill();g.fillStyle='#063b53';g.fillRect(-4,-25,8,24);g.restore();g.globalAlpha=1;if(score>700){g.fillStyle='#073044cc';g.font='58px serif';g.fillText('🐙',18,H-25)}}g.fillStyle='#062b3b';g.font='13px system-ui';g.fillText('Drag or use arrow keys · Space/⚡ boosts',16,H-16)}draw(1)})();</script></body></html>
