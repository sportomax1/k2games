<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wave Rush - K2 Games</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#063047;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}nav{height:54px;background:#052334;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff22}.back{color:white;text-decoration:none;font-weight:900}.logo{font-weight:950}main{height:calc(100% - 54px);position:relative;display:grid;place-items:center;background:linear-gradient(#0ea5c9,#087095)}canvas{display:block;width:100%;height:100%;background:#0ea5c9}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.card{background:rgba(3,31,48,.8);border:1px solid #ffffff26;border-radius:14px;padding:8px 12px;text-align:center;min-width:78px}.label{font-size:.62rem;text-transform:uppercase;color:#b8e9f5;font-weight:900;letter-spacing:.08em}.val{font-size:1.2rem;font-weight:950}.overlay{position:absolute;inset:0;background:rgba(4,27,42,.82);display:grid;place-items:center;text-align:center;padding:24px}.modal{width:min(92vw,520px);background:#f8fafc;color:#073044;border-radius:24px;padding:26px;box-shadow:0 24px 80px #0008}.modal h1{font-size:2.6rem;margin:0 0 8px}button{border:0;border-radius:999px;background:#0891b2;color:white;font-weight:950;padding:14px 28px;margin-top:14px;cursor:pointer}.tip{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#063047;border-radius:999px;padding:8px 14px;font-weight:850;white-space:nowrap}@media(max-width:700px){.hud{top:8px;left:8px;right:8px}.card{min-width:66px;padding:7px 9px}.tip{font-size:.82rem;white-space:normal;text-align:center;width:max-content;max-width:92vw}}
</style>
</head>
<body><nav><div class="logo">🌊 Wave Rush</div><a class="back" href="index.html">← HUB</a></nav><main><canvas id="game"></canvas><div class="hud"><div class="card"><div class="label">Score</div><div class="val" id="score">0</div></div><div class="card"><div class="label">Speed</div><div class="val" id="speed">1</div></div><div class="card"><div class="label">Lives</div><div class="val" id="lives">3</div></div></div><div class="tip">Steer with drag, mouse, arrows, A/D, or touch. Hold boost with Space.</div><div class="overlay" id="start"><div class="modal"><h1>🌊 Wave Rush</h1><p>Streamlined jet-ski racing: steer left/right, dodge buoys and rocks, collect rings, and use boost in open water.</p><button id="play">START RACE</button></div></div></main>
<script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),livesEl=document.getElementById('lives'),start=document.getElementById('start');let W=960,H=540,DPR=1,run=false,last=performance.now(),score=0,lives=3,road=0,spawn=0,keys={},pointer=null,boost=false;const ski={x:.5,y:.78,vx:0};let items=[];function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight-54;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function reset(){score=0;lives=3;road=0;spawn=0;items=[];ski.x=.5;ski.vx=0;run=true;start.style.display='none'}function add(){const r=Math.random();items.push({x:.12+Math.random()*.76,y:-.1,type:r<.22?'ring':r<.62?'buoy':'rock',s:r<.22?18:24,passed:false})}function drawWater(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#38c6e8');g.addColorStop(1,'#057095');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2;for(let i=0;i<18;i++){const y=(i*70+road*90)%H;ctx.beginPath();for(let x=0;x<W;x+=60){ctx.lineTo(x,y+Math.sin(x*.018+road*4+i)*8)}ctx.stroke()}}function drawSki(){const x=ski.x*W,y=ski.y*H;ctx.save();ctx.translate(x,y);ctx.rotate(ski.vx*.8);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(22,22);ctx.lineTo(0,14);ctx.lineTo(-22,22);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-8,-4,16,20);ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,-18,7,0,Math.PI*2);ctx.fill();ctx.restore()}function drawItem(o){const x=o.x*W,y=o.y*H,s=o.s;if(o.type==='ring'){ctx.strokeStyle='#facc15';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff7';ctx.fillRect(x-3,y-s-10,6,8)}else if(o.type==='buoy'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef4444';ctx.fillRect(x-s,y-5,s*2,10)}else{ctx.fillStyle='#475569';ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*1.1,y+s);ctx.lineTo(x-s*1.1,y+s*.8);ctx.closePath();ctx.fill();ctx.strokeStyle='#cbd5e1';ctx.stroke()}}function hit(a,b){const dx=a.x*W-b.x*W,dy=a.y*H-b.y*H;return Math.hypot(dx,dy)<b.s+20}function step(now){const dt=Math.min(.033,(now-last)/1000);last=now;drawWater();if(run){const base=1+score/1600;const steer=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(pointer!=null)ski.x+=(pointer-ski.x)*Math.min(1,dt*5);ski.vx+=(steer*.9-ski.vx)*dt*6;ski.x=Math.max(.08,Math.min(.92,ski.x+ski.vx*dt*(boost?1.35:1)));road+=dt*(base+(boost?.7:0));spawn-=dt;if(spawn<=0){spawn=.55/Math.min(2.2,base);add()}for(const o of items){o.y+=dt*(.28+base*.17+(boost?.13:0));drawItem(o);if(!o.passed&&o.y>1.05){o.passed=true;if(o.type!=='ring')score+=5}if(hit(ski,o)){if(o.type==='ring'){score+=50;o.y=2}else{lives--;o.y=2;if(lives<=0){run=false;start.style.display='grid';start.querySelector('h1').textContent='Race Over';start.querySelector('p').textContent=`Score ${score}. Press start to race again.`;start.querySelector('button').textContent='RESTART'}}}}items=items.filter(o=>o.y<1.3);score+=Math.floor(dt*(boost?34:20));scoreEl.textContent=score;speedEl.textContent=(base+(boost?.7:0)).toFixed(1);livesEl.textContent=lives}items.forEach(drawItem);drawSki();requestAnimationFrame(step)}cv.addEventListener('pointerdown',e=>{pointer=e.clientX/W;cv.setPointerCapture?.(e.pointerId)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer=e.clientX/W});cv.addEventListener('pointerup',()=>pointer=null);addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')boost=true});addEventListener('keyup',e=>{keys[e.key]=false;if(e.code==='Space')boost=false});document.getElementById('play').onclick=reset;requestAnimationFrame(step)})();
</script></body></html>
