<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mad Lips - K2 Games</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#7c3aed,#ec4899);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;padding:18px}.app{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:white}.back{color:white;text-decoration:none;font-weight:900;background:#0004;border:1px solid #fff4;border-radius:999px;padding:8px 12px}h1{font-size:clamp(2.4rem,7vw,4rem);margin:18px 0 4px;color:white}.sub{color:#fce7f3;font-weight:700}.card{background:#fff;border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 22px 70px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-weight:900;font-size:.85rem}input,select,textarea{width:100%;margin-top:5px;border:2px solid #e5e7eb;border-radius:14px;padding:12px;font:inherit}button{border:0;border-radius:999px;background:#7c3aed;color:white;font-weight:950;padding:13px 22px;margin-top:14px;cursor:pointer}.story{font-size:1.15rem;line-height:1.7}.blank{font-weight:950;color:#7c3aed;background:#ede9fe;border-radius:8px;padding:1px 6px}.actions{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:.85rem;color:#6b7280}@media(max-width:640px){body{padding:12px}.card{padding:16px}}</style></head><body><div class="app"><div class="top"><strong>👄 Mad Lips</strong><a class="back" href="index.html">← HUB</a></div><h1>Mad Lips</h1><p class="sub">Fill the blanks. Make it ridiculous. Read it out loud.</p><div class="card"><div class="grid" id="fields"></div><div class="actions"><button id="make">MAKE STORY</button><button id="random">RANDOM WORDS</button><button id="clear">CLEAR</button></div></div><div class="card"><div id="story" class="story">Choose words above, then make your story.</div><p class="small">Renamed from Mad Lips Ultra to just Mad Lips.</p></div></div><script>(()=>{const prompts=['adjective','animal','place','verb ending in -ing','food','silly name','vehicle','emotion','number','object'];const words={adjective:['wobbly','glorious','sticky','dramatic'],animal:['duck','llama','moose','penguin'],place:['arcade','mountain','grocery store','moon'],verb:['dancing','sneezing','climbing','zooming'],food:['pizza','tacos','waffles','pickles'],name:['Captain Kevin','Dr. Noodle','Mega Dave','Tina Tornado'],vehicle:['jet ski','golf cart','rocket','shopping cart'],emotion:['confused','thrilled','suspicious','brave'],number:['7','42','500','3'],object:['spatula','helmet','rubber chicken','remote']};const fields=document.getElementById('fields'),story=document.getElementById('story');prompts.forEach((p,i)=>{const id='w'+i;const div=document.createElement('label');div.textContent=p;div.innerHTML+=`<input id="${id}" placeholder="${p}">`;fields.appendChild(div)});function vals(){return prompts.map((_,i)=>document.getElementById('w'+i).value.trim()||`[${prompts[i]}]`)}document.getElementById('make').onclick=()=>{const v=vals();story.innerHTML=`One ${b(v[0])} morning, a ${b(v[1])} rolled into the ${b(v[2])} while ${b(v[3])}. Everyone stopped eating ${b(v[4])} when ${b(v[5])} arrived on a ${b(v[6])}. Feeling very ${b(v[7])}, they counted to ${b(v[8])} and raised the legendary ${b(v[9])}. Best day ever.`};function b(t){return `<span class="blank">${t.replace(/[<>&]/g,'')}</span>`}document.getElementById('random').onclick=()=>{const keys=['adjective','animal','place','verb','food','name','vehicle','emotion','number','object'];keys.forEach((k,i)=>{const arr=words[k];document.getElementById('w'+i).value=arr[Math.floor(Math.random()*arr.length)]})};document.getElementById('clear').onclick=()=>{prompts.forEach((_,i)=>document.getElementById('w'+i).value='');story.textContent='Choose words above, then make your story.'}})();</script></body></html>
