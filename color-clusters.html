<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Color Clusters</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#f8fafc;touch-action:manipulation}button,select{font:inherit}button{cursor:pointer}.app{height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2dvh,14px);padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));overflow:hidden}.head{width:min(100%,740px);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}.title{font-size:clamp(18px,3.5vw,25px);font-weight:900;letter-spacing:-.04em}.subtitle{font-size:11px;color:#aab8ce}.controls{display:flex;gap:7px;align-items:center}.btn,select{border:1px solid #33445d;border-radius:10px;color:#f8fafc;background:#17253a;padding:8px 10px;min-height:36px}.btn:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}.btn:hover{background:#243853}.settings{display:none;gap:8px;align-items:center;width:min(100%,740px);padding:8px;border:1px solid #30425a;border-radius:12px;background:#101d2f}.settings.open{display:flex}.settings label{font-size:12px;color:#cbd5e1}.settings select{flex:1;min-width:0}.hint{color:#9fafc6;font-size:clamp(10px,2.5vw,13px);text-align:center;flex:none}.board-wrap{flex:1;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.board{display:grid;gap:clamp(2px,.55vw,5px);padding:clamp(4px,.8vw,8px);border-radius:13px;background:#26354b;border:1px solid #42536c;touch-action:none;user-select:none;max-width:100%;max-height:100%;aspect-ratio:var(--cols)/var(--rows);width:min(calc((100dvh - 200px)*var(--cols)/var(--rows)),calc(100vw - 24px),740px)}.tile{border:0;border-radius:clamp(2px,.65vw,6px);min-width:0;min-height:0;aspect-ratio:1;box-shadow:inset 0 1px 2px #ffffff35;touch-action:none;cursor:grab;transition:filter .18s,transform .18s,box-shadow .2s}.tile{will-change:transform}.tile.pulse{animation:tilePulse .34s ease-out}.tile.connected{animation:clusterFlash .58s ease-out}.board.win{animation:winGlow 1.3s ease-in-out 2}@keyframes tilePulse{0%{transform:scale(.83);filter:brightness(1.4)}65%{transform:scale(1.12);filter:brightness(1.22)}100%{transform:scale(1);filter:brightness(1)}}@keyframes clusterFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.55);box-shadow:0 0 15px #ffffff80}}@keyframes winGlow{0%,100%{box-shadow:0 0 0 transparent}50%{box-shadow:0 0 28px #7dd3fcaa}}@media(prefers-reduced-motion:reduce){.tile,.board{animation:none!important;transition:none!important}}.tile.selected{outline:3px solid #fff;outline-offset:-3px;filter:brightness(1.18);transform:scale(.94)}.tile:focus-visible{outline:3px solid white;outline-offset:-3px}.stats{flex:none;width:min(100%,740px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#142238;border:1px solid #2c3d57;border-radius:10px;padding:8px 3px;text-align:center}.value{font-weight:850;font-variant-numeric:tabular-nums;font-size:clamp(15px,3.4vw,22px)}.label{color:#aab8ce;font-size:10px}.status{min-height:18px;font-size:12px;text-align:center;color:#d3dbea;flex:none}.status.won{color:#86efac;font-weight:800}@media(max-height:580px){.app{gap:4px}.hint{display:none}.stat{padding:4px 2px}.board{width:min(calc((100dvh - 137px)*var(--cols)/var(--rows)),calc(100vw - 24px),740px)}}@media(max-width:370px){.title{font-size:18px}.btn{padding:7px}.stats{gap:3px}}
</style></head><body><main class="app"><header class="head"><div><div class="title">COLOR CLUSTERS</div><div class="subtitle">Swap tiles. Connect every color.</div></div><div class="controls"><button class="btn" id="computerSolve" type="button">⚡ Solve</button><button class="btn" id="computerRetry" type="button">↺ Retry</button><button class="btn" id="restart" aria-label="New game">↻ New</button><button class="btn" id="settingsBtn" aria-label="Settings" aria-expanded="false">⚙</button></div></header><div class="settings" id="settings"><label for="mode">Grid</label><select id="mode"><option value="4">4 × 4 · 4 colors</option><option value="5">5 × 5 · 5 colors</option><option value="6">6 × 6 · 6 colors</option><option value="8">8 × 8 · 8 colors</option><option value="10" selected>10 × 10 · 10 colors</option><option value="20">10 × 20 · 10 colors</option></select></div><div class="hint">Tap two squares or drag one onto another. Each color must form one connected region.</div><section class="board-wrap"><div id="board" class="board" role="grid" aria-label="Color swapping puzzle"></div></section><div class="stats"><div class="stat"><div class="value" id="time">0:00</div><div class="label">TIME</div></div><div class="stat"><div class="value" id="moves">0</div><div class="label">SWAPS</div></div><div class="stat"><div class="value" id="clusters">0/10</div><div class="label">CONNECTED</div></div><div class="stat"><div class="value" id="best">—</div><div class="label">BEST TIME</div></div></div><div class="hint" id="computerCompare">Computer —</div><div class="status" id="status" aria-live="polite">Timer starts on your first swap</div></main>
<script>
(()=>{'use strict';
const COLORS=['#f8fafc','#facc15','#ec4899','#ef4444','#f97316','#22c55e','#3b82f6','#8b5cf6','#06b6d4','#a3e635'];
const NAMES=['White','Yellow','Pink','Red','Orange','Green','Blue','Purple','Cyan','Lime'];
const $=id=>document.getElementById(id);let cols=10,rows=10,count=10,cells=[],selected=-1,down=-1,moves=0,start=0,elapsed=0,won=false,started=false,ticker=0;
const key=()=> 'color-clusters-best-'+cols+'x'+rows;
const format=ms=>{let s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function best(){try{const n=Number(localStorage.getItem(key()));return n>0?format(n):'—'}catch{return '—'}}
function save(ms){try{const old=Number(localStorage.getItem(key()));if(!old||ms<old)localStorage.setItem(key(),String(ms))}catch{}}
function connected(){let good=0;for(let color=0;color<count;color++){let origin=cells.indexOf(color);if(origin<0)continue;const seen=new Set([origin]),q=[origin];for(let k=0;k<q.length;k++){const i=q[k],x=i%cols,y=Math.floor(i/cols);for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){if(nx<0||nx>=cols||ny<0||ny>=rows)continue;const j=ny*cols+nx;if(!seen.has(j)&&cells[j]===color){seen.add(j);q.push(j)}}}if(seen.size===cells.filter(v=>v===color).length)good++}return good}
function paint(){const tiles=$('board').children;for(let i=0;i<cells.length;i++){tiles[i].style.background=COLORS[cells[i]];tiles[i].classList.toggle('selected',i===selected);tiles[i].setAttribute('aria-label',NAMES[cells[i]]+' tile, row '+(Math.floor(i/cols)+1)+', column '+(i%cols+1))} $('moves').textContent=moves;const n=connected();$('clusters').textContent=n+'/'+count;return n}
function tick(){if(started&&!won){elapsed=performance.now()-start;$('time').textContent=format(elapsed)}}
function flash(i,cls){const t=$('board').children[i];if(!t)return;t.classList.remove(cls);void t.offsetWidth;t.classList.add(cls);t.addEventListener('animationend',()=>t.classList.remove(cls),{once:true})}
function swap(a,b){if(won||a<0||b<0||a===b)return;selected=-1;if(cells[a]===cells[b]){paint();return}if(!started){started=true;start=performance.now();ticker=setInterval(tick,200)}[cells[a],cells[b]]=[cells[b],cells[a]];moves++;const total=paint();flash(a,'pulse');flash(b,'pulse');if(total===count){won=true;elapsed=performance.now()-start;clearInterval(ticker);$('time').textContent=format(elapsed);save(elapsed);$('best').textContent=best();$('status').textContent='All colors connected! Puzzle complete.';$('status').classList.add('won');$('board').classList.add('win');for(let i=0;i<cells.length;i++)setTimeout(()=>flash(i,'connected'),Math.floor(i/cols)*45)}}
function choose(i){if(won)return;if(selected<0){selected=i;paint();flash(i,'pulse')}else if(selected===i){selected=-1;paint()}else swap(selected,i)}
function tileAt(x,y){const el=document.elementFromPoint(x,y);const tile=el&&el.closest('.tile');return tile&&$('board').contains(tile)?Number(tile.dataset.i):-1}
function fresh(){clearInterval(ticker);const mode=$('mode').value;cols=mode==='20'?10:Number(mode);rows=mode==='20'?20:cols;count=Math.min(cols,10);cells=Array.from({length:cols*rows},(_,i)=>i%count);for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}selected=down=-1;moves=0;elapsed=0;start=0;started=won=false;const b=$('board');b.style.setProperty('--cols',cols);b.style.setProperty('--rows',rows);b.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';b.style.gridTemplateRows='repeat('+rows+',minmax(0,1fr))';b.classList.remove('win');b.replaceChildren();const frag=document.createDocumentFragment();for(let i=0;i<cells.length;i++){const tile=document.createElement('button');tile.type='button';tile.className='tile';tile.dataset.i=i;tile.setAttribute('role','gridcell');frag.append(tile)}b.append(frag);$('time').textContent='0:00';$('best').textContent=best();$('status').textContent='Timer starts on your first swap';$('status').classList.remove('won');paint()}
const board=$('board');board.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t)return;down=Number(t.dataset.i);t.setPointerCapture(e.pointerId)});board.addEventListener('pointerup',e=>{if(down<0)return;const from=down;down=-1;const to=tileAt(e.clientX,e.clientY);if(to<0)return;if(to===from)choose(from);else swap(from,to)});board.addEventListener('pointercancel',()=>{down=-1});board.addEventListener('keydown',e=>{const t=e.target.closest('.tile');if(!t)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(Number(t.dataset.i))}if(e.key==='Escape'){selected=-1;paint()}});$('restart').addEventListener('click',fresh);$('mode').addEventListener('change',fresh);$('settingsBtn').addEventListener('click',()=>{const open=$('settings').classList.toggle('open');$('settingsBtn').setAttribute('aria-expanded',String(open))});document.addEventListener('visibilitychange',()=>{if(started&&!won)tick()});window.ColorClusters={get:()=>cells.slice(),dims:()=>({cols,rows,colors:count}),mode:()=>cols+'x'+rows,fresh,load:(arr)=>{fresh();cells=arr.slice();paint();$('status').textContent='Your turn — beat the computer';},computerSwap:(a,b)=>{[cells[a],cells[b]]=[cells[b],cells[a]];moves++;paint();flash(a,'pulse');flash(b,'pulse')},computerDone:(ms,n)=>{won=true;clearInterval(ticker);$('time').textContent=format(ms);$('moves').textContent=n;$('status').textContent='Computer finished. Retry the same board!';$('board').classList.add('win')}};fresh();
})();
</script><script src="./color-clusters-solver.js"></script></body></html>
