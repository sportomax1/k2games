<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Dino Dash</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f7f7f7;font-family:system-ui,Segoe UI,sans-serif;color:#222}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:14px 16px auto;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;letter-spacing:.08em}.help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#ffffffd9;border:1px solid #ddd;border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:0 4px 18px #0001;white-space:nowrap}.back{position:fixed;left:14px;top:50px;color:#222;text-decoration:none;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-weight:700}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#ffffffbb;text-align:center}.panel{background:white;border:2px solid #222;border-radius:18px;padding:24px;max-width:360px;box-shadow:8px 8px 0 #222}.panel h1{margin:0 0 8px;font-size:38px}.panel button{font:inherit;font-weight:900;padding:12px 18px;border:0;border-radius:12px;background:#222;color:white;cursor:pointer}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div class="hud"><span id="hi">HI 00000</span><span id="score">00000</span></div><a class="back" href="./">← Hub</a><div class="help">Space / ↑ / tap = jump · ↓ = duck</div><div id="overlay" class="overlay"><div class="panel"><h1>🦖 Dino Dash</h1><p>Jump cacti, duck under flyers, and survive as the desert speeds up.</p><button id="start">Start Run</button></div></div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),hiEl=document.querySelector('#hi'),ov=document.querySelector('#overlay');let W,H,dpr,run=false,last=0,score=0,speed=420,spawn=0,ground=0;const hiKey='k2-dino-dash-hi';let high=+localStorage.getItem(hiKey)||0;const p={x:90,y:0,w:48,h:54,vy:0,duck:false,on:true};let obs=[],clouds=[];function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ground=H*.76;p.y=ground-p.h}addEventListener('resize',resize);resize();function reset(){score=0;speed=420;spawn=.8;obs=[];clouds=[];p.vy=0;p.duck=false;p.on=true;p.h=54;p.y=ground-p.h;for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:70+Math.random()*180,s:20+Math.random()*25})}function jump(){if(!run)return start();if(p.on){p.vy=-780;p.on=false}}function duck(v){p.duck=v;if(v&&p.on){p.h=32;p.y=ground-p.h}else if(!v){p.h=54;p.y=Math.min(p.y,ground-p.h)}}addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}if(e.code==='ArrowDown')duck(true)});addEventListener('keyup',e=>{if(e.code==='ArrowDown')duck(false)});c.addEventListener('pointerdown',e=>{if(e.clientY>H*.62)jump();else duck(true)});c.addEventListener('pointerup',()=>duck(false));document.querySelector('#start').onclick=start;function start(){reset();run=true;ov.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function spawnObs(){const fly=Math.random()<.25&&score>500;obs.push(fly?{x:W+40,y:ground-95-Math.random()*40,w:46,h:28,t:'fly'}:{x:W+40,y:ground-(40+Math.random()*36),w:26+Math.random()*20,h:40+Math.random()*36,t:'cactus'})}function hit(a,b){return a.x+8<b.x+b.w&&a.x+a.w-8>b.x&&a.y+6<b.y+b.h&&a.y+a.h-4>b.y}function end(){run=false;high=Math.max(high,Math.floor(score));localStorage.setItem(hiKey,high);ov.querySelector('h1').textContent='Run Over';ov.querySelector('p').textContent=`Score ${Math.floor(score)} · Best ${high}`;ov.querySelector('button').textContent='Run Again';ov.classList.remove('hidden')}function loop(t){if(!run)return;let dt=Math.min(.032,(t-last)/1000);last=t;score+=dt*100;speed=420+Math.min(520,score*.12);spawn-=dt;if(spawn<=0){spawnObs();spawn=.75+Math.random()*1.1-speed/1800}p.vy+=2100*dt;p.y+=p.vy*dt;if(p.y>=ground-p.h){p.y=ground-p.h;p.vy=0;p.on=true}for(const o of obs)o.x-=speed*dt;obs=obs.filter(o=>o.x>-80);for(const cl of clouds){cl.x-=speed*.08*dt;if(cl.x<-80){cl.x=W+80;cl.y=70+Math.random()*180}}for(const o of obs)if(hit(p,o))return end();draw();scoreEl.textContent=String(Math.floor(score)).padStart(5,'0');hiEl.textContent='HI '+String(high).padStart(5,'0');requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#fafafa';x.fillRect(0,0,W,H);x.strokeStyle='#bbb';x.lineWidth=2;for(const cl of clouds){x.beginPath();x.arc(cl.x,cl.y,cl.s,Math.PI,0);x.arc(cl.x+cl.s,cl.y,cl.s*.8,Math.PI,0);x.stroke()}x.strokeStyle='#333';x.beginPath();x.moveTo(0,ground);x.lineTo(W,ground);x.stroke();x.fillStyle='#333';for(let i=0;i<W;i+=42)x.fillRect((i-(score*4)%42),ground+12,18,3);x.save();x.translate(p.x,p.y);x.fillStyle='#333';x.fillRect(8,8,p.w-12,p.h-12);x.fillRect(0,p.h-20,18,12);x.fillStyle='#fff';x.fillRect(p.w-16,14,5,5);x.restore();for(const o of obs){x.fillStyle='#333';if(o.t==='fly'){x.fillRect(o.x,o.y+8,o.w,o.h-12);x.beginPath();x.moveTo(o.x+8,o.y+8);x.lineTo(o.x+18,o.y-8);x.lineTo(o.x+26,o.y+8);x.fill()}else{x.fillRect(o.x,o.y,o.w,o.h);x.fillRect(o.x-10,o.y+18,12,8);x.fillRect(o.x+o.w-2,o.y+28,12,8)}}}draw();hiEl.textContent='HI '+String(high).padStart(5,'0')})();</script></body></html>
