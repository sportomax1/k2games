<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Check Arcade</title><style>:root{--bg:#f5f7fb;--p:#fff;--t:#18212f;--m:#667085;--b:#d8dee8;--a:#2563eb;--g:#15803d;--r:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#f8fafc,#eef2f7);color:var(--t);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1080px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:clamp(26px,5vw,40px)}.sub{color:var(--m);margin:4px 0 0}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill,.panel{background:var(--p);border:1px solid var(--b);box-shadow:0 10px 30px #10182812}.pill{padding:8px 12px;border-radius:999px;font-weight:800}.layout{display:grid;grid-template-columns:270px 1fr;gap:16px}.panel{border-radius:18px}.side{padding:14px;height:max-content}.side h2{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.list{display:grid;gap:7px}.gb,.btn{border:1px solid var(--b);background:#fff;border-radius:11px;padding:10px 12px;font-weight:750}.gb{text-align:left}.gb.active{border-color:#93b4ff;background:#edf4ff;color:#1743a4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.primary{background:var(--a);border-color:var(--a);color:#fff}.main{padding:18px;min-height:600px}.hero{display:flex;justify-content:space-between;gap:12px}.hero h2{margin:0}.hero p{margin:5px 0 15px;color:var(--m)}.controls{display:flex;gap:7px;flex-wrap:wrap}.challenge{border:1px solid var(--b);border-radius:15px;background:#fbfcfe;padding:18px;min-height:350px}.prompt{font-size:20px;font-weight:850}.hint{color:var(--m)}.feedback{display:none;margin-top:12px;padding:11px;border-radius:11px;font-weight:800}.feedback.good{display:block;color:var(--g);background:#eaf8ef}.feedback.bad{display:block;color:var(--r);background:#fff0ef}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:600px}.tile{aspect-ratio:1;border:2px solid transparent;border-radius:13px;background:#eef2f7;font-size:44px}.tile.sel{border-color:var(--a);box-shadow:inset 0 0 0 3px #dbe8ff}.inputrow{display:flex;gap:8px;max-width:560px;margin-top:12px}.input{flex:1;border:1px solid var(--b);border-radius:10px;padding:11px}.captcha{max-width:560px;padding:24px;text-align:center;border:1px dashed #9aa5b5;border-radius:14px;background:#f7f2df}.ct{font:900 44px Georgia;letter-spacing:9px;transform:skew(-8deg) rotate(-2deg);display:inline-block}.track{height:56px;max-width:620px;border:1px solid var(--b);border-radius:13px;background:#edf2f7;position:relative}.zone{position:absolute;top:0;height:100%;background:#2563eb22;border:2px dashed var(--a);border-top:0;border-bottom:0}.range{width:min(620px,100%);margin:14px 0}.seq{display:flex;gap:9px;flex-wrap:wrap}.seq button,.odd button{width:68px;height:68px;border:1px solid var(--b);border-radius:12px;background:#fff;font-size:24px;font-weight:900}.rotate{width:180px;height:180px;display:flex;align-items:center;justify-content:center;font-size:88px;background:#eef2f7;border:1px solid var(--b);border-radius:16px;transition:.2s}.mem{display:grid;grid-template-columns:repeat(4,86px);gap:9px}.mem button{width:86px;height:86px;border:1px solid var(--b);border-radius:12px;background:#e9eef5;font-size:28px}.mem button.flash{background:#cfe0ff;border-color:#7aa5ff}.mem button.pick{background:#dce9ff;border-color:var(--a)}.match{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:680px}.col{display:grid;gap:8px}.mi{border:1px solid var(--b);border-radius:11px;background:#fff;padding:11px;text-align:left}.mi.sel{border-color:var(--a);background:#edf4ff}.mi.done{opacity:.35}.odd{display:grid;grid-template-columns:repeat(5,68px);gap:8px}.wave{height:60px;display:flex;gap:3px;align-items:center}.bar{width:6px;background:#9cb6eb;border-radius:4px}.drag{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px}.di,.dz{min-height:86px;display:flex;align-items:center;justify-content:center;border:2px solid var(--b);border-radius:12px;background:#fff;font-size:36px}.di{cursor:grab}.dz{border-style:dashed;font-size:16px;font-weight:800}.pattern{display:flex;gap:9px;flex-wrap:wrap}.pc{width:78px;height:78px;border:1px solid var(--b);border-radius:12px;background:#fff;font-size:30px;font-weight:900}@media(max-width:780px){.layout{grid-template-columns:1fr}.top,.hero{align-items:flex-start;flex-direction:column}.list{grid-template-columns:1fr 1fr}.mem{grid-template-columns:repeat(4,1fr)}.mem button{width:100%;height:auto;aspect-ratio:1}.odd{grid-template-columns:repeat(4,1fr)}.odd button{width:100%;height:auto;aspect-ratio:1}}@media(max-width:500px){.app{padding:10px}.list{grid-template-columns:1fr}.match{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="top"><div><h1>Human Check Arcade</h1><p class="sub">CAPTCHA-inspired microgames. Prove you're probably human.</p></div><div class="stats"><span class="pill">Score <b id="score">0</b></span><span class="pill">Streak <b id="streak">0</b></span><span class="pill">Round <b id="round">0</b></span></div></header><div class="layout"><aside class="panel side"><h2>Challenges</h2><div id="list" class="list"></div><div class="actions"><button class="btn primary" id="random">Random</button><button class="btn" id="all">Play All</button></div></aside><main class="panel main"><div class="hero"><div><h2 id="title">Choose a challenge</h2><p id="desc">Pick a mode or press Random.</p></div><div class="controls"><select class="btn" id="diff"><option value="easy">Easy</option><option selected value="normal">Normal</option><option value="hard">Hard</option></select><button class="btn" id="new">New Round</button><button class="btn" id="reset">Reset</button></div></div><section id="challenge" class="challenge"><p class="prompt">Select a game to begin.</p></section><div id="feedback" class="feedback"></div></main></div></div><script>(()=>{'use strict';const $=s=>document.querySelector(s),C=$('#challenge'),F=$('#feedback');const G=[['grid','▦','Image Grid','Select every matching object.'],['text','Aa','Text CAPTCHA','Read and type the distorted code.'],['slider','↔','Slider','Move into the target region.'],['sequence','123','Number Order','Tap numbers in ascending order.'],['rotate','↻','Rotate Object','Rotate the arrow upright.'],['memory','◫','Memory Flash','Remember the highlighted squares.'],['match','⇄','Match Pairs','Match words to symbols.'],['odd','◎','Odd One Out','Find the different tile.'],['audio','♪','Audio Code','Listen and enter the spoken code.'],['drag','☝','Drag & Drop','Sort objects into categories.'],['pattern','◇','Pattern Next','Choose what comes next.']];let S={score:0,streak:0,round:0,current:null,locked:false,all:false,idx:0,t:null};const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,sh=a=>[...a].sort(()=>Math.random()-.5),d=()=>$('#diff').value;function stats(){$('#score').textContent=S.score;$('#streak').textContent=S.streak;$('#round').textContent=S.round}function fb(ok,t){F.className='feedback '+(ok?'good':'bad');F.textContent=t}function clear(){F.className='feedback';F.textContent=''}function finish(ok,msg=''){if(S.locked)return;S.locked=true;if(ok){let p=d()==='hard'?150:d()==='easy'?75:100;S.streak++;p+=Math.min(100,S.streak*5);S.score+=p;fb(1,'✓ Passed! +'+p+(msg?' — '+msg:''))}else{S.streak=0;S.score=Math.max(0,S.score-25);fb(0,'✕ Not quite. -25'+(msg?' — '+msg:''))}stats();if(S.all&&ok)setTimeout(()=>{if(++S.idx>=G.length){S.all=false;fb(1,'🏁 Play All complete! Final score: '+S.score)}else start(G[S.idx][0])},650)}function menu(){let e=$('#list');e.innerHTML='';G.forEach(g=>{let b=document.createElement('button');b.className='gb'+(S.current===g[0]?' active':'');b.textContent=g[1]+'  '+g[2];b.onclick=()=>{S.all=false;start(g[0])};e.appendChild(b)})}function start(id){clearTimeout(S.t);clear();S.locked=false;S.current=id;S.round++;let g=G.find(x=>x[0]===id);$('#title').textContent=g[2];$('#desc').textContent=g[3];menu();stats();R[id]()}function grid(){let sets=[['cats','🐱',['🐶','🦊','🐯']],['cars','🚗',['🚌','🚲','🚜']],['apples','🍎',['🍊','🍋','🍐']],['fish','🐟',['🐙','🦀','🐸']],['soccer balls','⚽',['🏀','🏈','⚾']]],s=sets[r(0,sets.length-1)],n=d()==='easy'?2:d()==='hard'?4:3,a=Array(n).fill(s[1]);while(a.length<9)a.push(s[2][r(0,s[2].length-1)]);a=sh(a);C.innerHTML='<p class="prompt">Select all squares with '+s[0]+'</p><div id="tiles" class="grid"></div><button class="btn primary" id="v" style="margin-top:12px">Verify</button>';a.forEach(x=>{let b=document.createElement('button');b.className='tile';b.textContent=x;b.dataset.x=x===s[1]?1:0;b.onclick=()=>b.classList.toggle('sel');$('#tiles').appendChild(b)});$('#v').onclick=()=>finish([...document.querySelectorAll('.tile')].every(x=>(x.dataset.x==='1')===x.classList.contains('sel')))}function text(){let cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',n=d()==='easy'?4:d()==='hard'?7:5,c='';for(let i=0;i<n;i++)c+=cs[r(0,cs.length-1)];C.innerHTML='<p class="prompt">Type the characters you see</p><div class="captcha"><span class="ct">'+c+'</span></div><div class="inputrow"><input id="inp" class="input"><button id="v" class="btn primary">Verify</button></div>';let v=()=>finish($('#inp').value.trim().toUpperCase()===c,'Code was '+c);$('#v').onclick=v;$('#inp').onkeydown=e=>e.key==='Enter'&&v();$('#inp').focus()}function slider(){let w=d()==='easy'?24:d()==='hard'?8:14,s=r(10,90-w);C.innerHTML='<p class="prompt">Move the slider into the highlighted zone</p><div class="track"><div class="zone" style="left:'+s+'%;width:'+w+'%"></div></div><input id="rng" class="range" type="range" min="0" max="100" value="0"><br><button id="v" class="btn primary">Verify</button>';$('#v').onclick=()=>{let x=+$('#rng').value;finish(x>=s&&x<=s+w)}}function sequence(){let n=d()==='easy'?6:d()==='hard'?12:9,a=sh(Array.from({length:n},(_,i)=>i+1)),next=1;C.innerHTML='<p class="prompt">Click 1 through '+n+' in order</p><div id="seq" class="seq"></div>';a.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(x!==next)return finish(0,'Expected '+next);b.disabled=true;b.style.opacity='.3';if(++next>n)finish(1,'Perfect order')};$('#seq').appendChild(b)})}function rotate(){let step=d()==='hard'?45:90,a=sh([90,180,270])[0];C.innerHTML='<p class="prompt">Rotate the arrow so it points up</p><div id="rot" class="rotate" style="transform:rotate('+a+'deg)">⬆️</div><p><button class="btn" id="l">↺ Left</button> <button class="btn" id="rr">↻ Right</button> <button class="btn primary" id="v">Verify</button></p>';let q=()=>$('#rot').style.transform='rotate('+a+'deg)';$('#l').onclick=()=>{a=(a-step+360)%360;q()};$('#rr').onclick=()=>{a=(a+step)%360;q()};$('#v').onclick=()=>finish(a===0,'Angle '+a+'°')}function memory(){let total=12,n=d()==='easy'?3:d()==='hard'?6:4,t=sh([...Array(total).keys()]).slice(0,n),pick=[];C.innerHTML='<p class="prompt">Remember the highlighted squares</p><p id="mh" class="hint">Watch carefully…</p><div id="mem" class="mem"></div><button id="v" class="btn primary" disabled style="margin-top:12px">Verify</button>';for(let i=0;i<total;i++){let b=document.createElement('button');b.textContent=i+1;b.disabled=true;if(t.includes(i))b.classList.add('flash');$('#mem').appendChild(b)}S.t=setTimeout(()=>{[...$('#mem').children].forEach((b,i)=>{b.classList.remove('flash');b.disabled=false;b.onclick=()=>{if(pick.includes(i)){pick=pick.filter(x=>x!==i);b.classList.remove('pick')}else{pick.push(i);b.classList.add('pick')}}});$('#mh').textContent='Select the '+n+' squares that flashed.';$('#v').disabled=false},d()==='hard'?800:d()==='easy'?1600:1100);$('#v').onclick=()=>finish(pick.length===t.length&&pick.every(x=>t.includes(x)))}function match(){let bank=[['Dog','🐶'],['Cat','🐱'],['Apple','🍎'],['Car','🚗'],['Fish','🐟'],['Moon','🌙'],['Sun','☀️'],['Tree','🌳']],n=d()==='easy'?3:d()==='hard'?6:4,p=sh(bank).slice(0,n).map((x,i)=>({id:i,l:x[0],r:x[1]})),L=null,Rr=null,m=0;C.innerHTML='<p class="prompt">Match each word to its symbol</p><div class="match"><div id="ml" class="col"></div><div id="mr" class="col"></div></div>';function go(){if(L&&Rr){if(L.dataset.id===Rr.dataset.id){L.classList.add('done');Rr.classList.add('done');L.disabled=Rr.disabled=true;if(++m===n)finish(1);L=Rr=null}else{L.classList.remove('sel');Rr.classList.remove('sel');L=Rr=null}}}p.forEach(x=>{let b=document.createElement('button');b.className='mi';b.textContent=x.l;b.dataset.id=x.id;b.onclick=()=>{if(L)L.classList.remove('sel');L=b;b.classList.add('sel');go()};$('#ml').appendChild(b)});sh(p).forEach(x=>{let b=document.createElement('button');b.className='mi';b.textContent=x.r;b.dataset.id=x.id;b.onclick=()=>{if(Rr)Rr.classList.remove('sel');Rr=b;b.classList.add('sel');go()};$('#mr').appendChild(b)})}function odd(){let bank=[['🐱','😺'],['🍎','🍏'],['⚽','🏀'],['🔵','🟦'],['🌙','⭐'],['🚗','🚕']],q=bank[r(0,bank.length-1)],n=d()==='easy'?12:d()==='hard'?25:20,o=r(0,n-1);C.innerHTML='<p class="prompt">Find the odd one out</p><div id="odd" class="odd"></div>';for(let i=0;i<n;i++){let b=document.createElement('button');b.textContent=i===o?q[1]:q[0];b.onclick=()=>finish(i===o);$('#odd').appendChild(b)}}function audio(){let cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',n=d()==='easy'?4:d()==='hard'?7:5,c='';for(let i=0;i<n;i++)c+=cs[r(0,cs.length-1)];C.innerHTML='<p class="prompt">Listen to the code</p><button class="btn" id="play">▶ Play</button><div class="wave">'+Array.from({length:34},()=>'<i class="bar" style="height:'+r(12,55)+'px"></i>').join('')+'</div><div class="inputrow"><input id="inp" class="input"><button id="v" class="btn primary">Verify</button></div>';$('#play').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(c.split('').join(' '));u.rate=.7;speechSynthesis.speak(u)}};$('#v').onclick=()=>finish($('#inp').value.trim().toUpperCase()===c,'Code was '+c)}function drag(){let bank=[['🍎','food'],['🍌','food'],['🚗','vehicle'],['🚲','vehicle'],['🐶','animal'],['🐱','animal']],n=d()==='easy'?3:d()==='hard'?6:4,a=sh(bank).slice(0,n);C.innerHTML='<p class="prompt">Drag each item to the correct category</p><div id="items" class="drag"></div><hr><div class="drag"><div class="dz" data-c="food">Food</div><div class="dz" data-c="vehicle">Vehicle</div><div class="dz" data-c="animal">Animal</div></div><button id="v" class="btn primary" style="margin-top:12px">Verify</button>';a.forEach((x,i)=>{let e=document.createElement('div');e.className='di';e.draggable=true;e.textContent=x[0];e.dataset.c=x[1];e.dataset.id=i;e.ondragstart=v=>v.dataTransfer.setData('text/plain',i);$('#items').appendChild(e)});document.querySelectorAll('.dz').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let x=document.querySelector('.di[data-id="'+e.dataTransfer.getData('text/plain')+'"]');if(x)z.appendChild(x)}});$('#v').onclick=()=>finish([...document.querySelectorAll('.di')].every(x=>x.parentElement.classList.contains('dz')&&x.parentElement.dataset.c===x.dataset.c))}function pattern(){let ps=[{s:['●','○','●','○'],a:'●',c:['●','○','■']},{s:['1','2','3','4'],a:'5',c:['5','6','4']},{s:['A','C','E','G'],a:'I',c:['H','I','J']},{s:['2','4','8','16'],a:'32',c:['24','32','18']}],p=ps[r(0,ps.length-1)];C.innerHTML='<p class="prompt">Which item comes next?</p><div class="pattern">'+p.s.map(x=>'<span class="pc">'+x+'</span>').join('')+'<span class="pc">?</span></div><div id="choices" class="pattern" style="margin-top:15px"></div>';sh(p.c).forEach(x=>{let b=document.createElement('button');b.className='pc';b.textContent=x;b.onclick=()=>finish(x===p.a,'Answer '+p.a);$('#choices').appendChild(b)})}const R={grid,text,slider,sequence,rotate,memory,match,odd,audio,drag,pattern};$('#random').onclick=()=>{S.all=false;start(G[r(0,G.length-1)][0])};$('#all').onclick=()=>{S.all=true;S.idx=0;start(G[0][0])};$('#new').onclick=()=>S.current?start(S.current):start(G[0][0]);$('#reset').onclick=()=>{S.score=S.streak=S.round=0;S.all=false;stats();clear()};$('#diff').onchange=()=>S.current&&start(S.current);menu();stats()})();</script></body></html>
