<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stadium Striker - K2 Games</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#082617;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:52px 1fr 54px;gap:6px;padding:8px;background:linear-gradient(#073b20,#082617)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:950}.back{color:white;text-decoration:none;font-weight:900;background:#ffffff14;border:1px solid #ffffff24;border-radius:999px;padding:8px 12px}.score{display:flex;align-items:center;gap:12px;font-weight:950;background:#04160d;border:1px solid #ffffff24;border-radius:999px;padding:8px 14px}.score b{font-size:1.45rem;color:#facc15}.stage{position:relative;min-height:0}canvas{width:100%;height:100%;display:block;background:#168038;border-radius:20px;border:1px solid #ffffff28}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}button{border:0;border-radius:13px;background:#14532d;color:white;font-weight:950}.primary{background:#facc15;color:#123}.overlay{position:absolute;inset:0;background:rgba(3,25,12,.86);display:grid;place-items:center;text-align:center;padding:20px}.modal{width:min(92vw,560px);background:#f8fafc;color:#052e16;border-radius:24px;padding:24px}.modal h1{margin:0 0 8px;font-size:2.5rem}.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#052e16;border-radius:999px;padding:7px 13px;font-size:.84rem;font-weight:850;white-space:nowrap}@media(max-width:700px){.app{grid-template-rows:48px 1fr 48px;padding:6px}.score{gap:7px;padding:7px 10px}.controls{grid-template-columns:repeat(3,1fr)}.tip{font-size:.78rem;white-space:normal;text-align:center;width:max-content;max-width:92vw}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">⚽ Stadium Striker</div><div class="score"><span>YOU</span><b id="you">0</b><span id="clock">90</span><b id="cpu">0</b><span>CPU</span></div><a class="back" href="index.html">← HUB</a></header>
<section class="stage"><canvas id="game"></canvas><div class="tip">Soccer scoring: every goal = exactly 1 point. Shoot with Space / Kick.</div><div class="overlay" id="overlay"><div class="modal"><h1>⚽ Stadium Striker</h1><p>Real soccer scoring, smoother ball friction, rebounds, keeper AI, and predictable one-touch shooting.</p><button class="primary" id="start">KICK OFF</button></div></div></section>
<div class="controls"><button id="left">←</button><button id="up">↑</button><button id="down">↓</button><button id="right">→</button><button class="primary" id="kick">KICK</button></div>
</div>
<script>
(()=>{const cv=document.getElementById('game'),ctx=cv.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),youEl=document.getElementById('you'),cpuEl=document.getElementById('cpu'),clockEl=document.getElementById('clock');let W=960,H=540,DPR=1,last=performance.now(),run=false,time=90,you=0,cpu=0,keys={};const player={x:250,y:270,vx:0,vy:0,r:18,c:'#38bdf8'},ai={x:710,y:270,vx:0,vy:0,r:18,c:'#fb7185'},ball={x:480,y:270,vx:0,vy:0,r:11};function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}new ResizeObserver(resize).observe(cv);function reset(){time=90;you=0;cpu=0;run=true;serve(0);overlay.style.display='none';ui()}function serve(dir){ball.x=W/2;ball.y=H/2;ball.vx=dir*3;ball.vy=0;player.x=W*.28;player.y=H*.5;ai.x=W*.72;ai.y=H*.5}function ui(){youEl.textContent=you;cpuEl.textContent=cpu;clockEl.textContent=Math.max(0,Math.ceil(time))}function goal(side){if(side==='you')you+=1;else cpu+=1;serve(side==='you'?-1:1);ui()}function move(o,tx,ty,dt,max=520){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy)||1;o.vx+=(dx/d)*max*dt;o.vy+=(dy/d)*max*dt}function collide(o){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),min=ball.r+o.r;if(d>0&&d<min){const nx=dx/d,ny=dy/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;const push=Math.max(3,Math.hypot(o.vx,o.vy)*.04);ball.vx=nx*(5.2+push)+o.vx*.025;ball.vy=ny*(5.2+push)+o.vy*.025}}function kick(o,power=9){const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy);if(d<70){const targetX=o===player?W+80:-80,targetY=H/2+(Math.random()-.5)*H*.32;const ax=targetX-ball.x,ay=targetY-ball.y,ad=Math.hypot(ax,ay)||1;ball.vx=ax/ad*power;ball.vy=ay/ad*power}}function drawField(){ctx.fillStyle='#168038';ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#187f3b':'#15803d';ctx.fillRect(i*W/9,0,W/9,H)}ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.strokeRect(W*.08,H*.08,W*.84,H*.84);ctx.beginPath();ctx.moveTo(W/2,H*.08);ctx.lineTo(W/2,H*.92);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,70,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffffff';ctx.fillRect(0,H*.36,12,H*.28);ctx.fillRect(W-12,H*.36,12,H*.28);ctx.strokeRect(0,H*.32,W*.12,H*.36);ctx.strokeRect(W*.88,H*.32,W*.12,H*.36)}function drawObj(o,label){ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText(label,o.x,o.y+4)}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;drawField();if(run){time-=dt;if(time<=0){run=false;overlay.style.display='grid';overlay.querySelector('h1').textContent=you>cpu?'YOU WIN!':you<cpu?'CPU WINS':'DRAW';overlay.querySelector('p').textContent=`Final: ${you}-${cpu}. Every goal counted as one point.`;overlay.querySelector('button').textContent='REMATCH'}const mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0);player.vx+=mx*760*dt;player.vy+=my*760*dt;const aiTargetX=ball.x>W*.48?ball.x-80:W*.72,aiTargetY=ball.y;move(ai,aiTargetX,aiTargetY,dt,430);for(const o of[player,ai]){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=Math.pow(.82,dt*60);o.vy*=Math.pow(.82,dt*60);o.x=Math.max(o.r+15,Math.min(W-o.r-15,o.x));o.y=Math.max(o.r+15,Math.min(H-o.r-15,o.y));collide(o)}if(Math.random()<.018)kick(ai,8.2);ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.vx*=Math.pow(.985,dt*60);ball.vy*=Math.pow(.985,dt*60);if(ball.y<ball.r+H*.08||ball.y>H*.92-ball.r){ball.y=Math.max(ball.r+H*.08,Math.min(H*.92-ball.r,ball.y));ball.vy*=-.74}if(ball.x<ball.r){if(ball.y>H*.36&&ball.y<H*.64)goal('cpu');else{ball.x=ball.r;ball.vx=Math.abs(ball.vx)*.74}}if(ball.x>W-ball.r){if(ball.y>H*.36&&ball.y<H*.64)goal('you');else{ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)*.74}}ui()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.stroke();drawObj(player,'YOU');drawObj(ai,'CPU');requestAnimationFrame(loop)}function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{keys[key]=true;e.preventDefault()});b.addEventListener('pointerup',()=>keys[key]=false);b.addEventListener('pointerleave',()=>keys[key]=false)}['left','right','up','down'].forEach(k=>hold(k,k));document.getElementById('kick').onclick=()=>kick(player,10.5);document.getElementById('start').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;if(e.code==='Space')kick(player,10.5)});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false});resize();requestAnimationFrame(loop)})();
</script>
</body>
</html>
