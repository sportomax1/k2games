<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--primary:#6366f1;--accent:#f59e0b;--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#ffffff1a}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;background-image:radial-gradient(at 0 0,#6366f124,transparent 45%),radial-gradient(at 100% 0,#f59e0b14,transparent 35%)}.container{max-width:1400px;margin:auto}header{text-align:center;margin-bottom:2rem}h1{font-size:clamp(2.5rem,7vw,3.8rem);font-weight:950;background:linear-gradient(90deg,#a5b4fc,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:var(--muted);margin-top:.5rem;text-transform:uppercase;letter-spacing:2px;font-weight:700}.controls{max-width:980px;margin:1.3rem auto .9rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}.emoji-bar{max-width:1180px;margin:0 auto 1rem;display:flex;gap:.45rem;overflow:auto;padding:.45rem;border:1px solid var(--border);border-radius:16px;background:#ffffff0a}.emoji-chip{flex:0 0 auto;min-width:42px;padding:.55rem .7rem;border-radius:999px;border:1px solid var(--border);background:#ffffff0d;color:white;font-weight:900;cursor:pointer}.emoji-chip.active{background:var(--accent);color:#111827;border-color:transparent}.offline-status{max-width:980px;margin:0 auto 1rem;padding:.75rem 1rem;border-radius:12px;border:1px solid var(--border);font-size:.9rem;text-align:center;background:#ffffff0d;color:var(--muted)}input,select,button{padding:1rem;border-radius:12px;border:1px solid var(--border);color:white;font:inherit}#search{flex:2;min-width:220px;background:#ffffff0d;outline:none}select{flex:1;min-width:150px;background:var(--surface);cursor:pointer}#random-btn{background:linear-gradient(135deg,var(--accent),#d97706);font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}.card{position:relative;background:var(--surface);border-radius:18px;padding:1.35rem 1rem;text-decoration:none;color:inherit;border:1px solid var(--border);display:flex;min-height:150px;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.2s}.card:hover,.card:focus{transform:translateY(-4px);border-color:var(--primary);background:#2d3748;outline:none}.game-idx{position:absolute;top:10px;left:10px;font-size:.62rem;opacity:.35}.classic-tag{position:absolute;top:10px;right:46px;font-size:.58rem;background:var(--accent);color:#111827;padding:2px 6px;border-radius:4px;font-weight:900}.favorite-toggle{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#0f172ae6;cursor:pointer}.favorite-toggle.active{border-color:#fb7185;color:#fb7185}.icon{font-size:2.35rem;margin-bottom:.62rem}.title{font-size:.88rem;font-weight:850;text-transform:capitalize;line-height:1.15}.purpose{font-size:.68rem;color:var(--muted);margin-top:.38rem;line-height:1.15}.date{font-size:.59rem;color:#64748b;margin-top:.48rem}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem;border:1px dashed var(--border);border-radius:18px}footer{margin-top:4rem;padding:2rem;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:640px){body{padding:1rem}.grid{grid-template-columns:1fr}.card{flex-direction:row;text-align:left;justify-content:flex-start;gap:1rem;min-height:98px}.icon{margin:0;font-size:1.8rem}.date{margin-left:auto}.controls{display:grid;grid-template-columns:1fr}.controls>*{width:100%}.purpose{margin-top:.2rem}}
</style>
</head>
<body>
<div class="container">
<header><h1>K2 Games</h1><p class="subtitle"><span id="count">0</span> Legendary Titles</p></header>
<div class="controls"><input id="search" placeholder="Search games, purpose, file, or emoji..."><select id="filter"><option value="all">All Titles</option><option value="originals">Originals</option><option value="classics">Classics</option><option value="favorites">Favorites</option></select><select id="sort"><option value="updated">Recently Updated</option><option value="newest">Newest Additions</option><option value="alpha">A-Z</option></select><button id="random-btn">🎲 Random Game</button></div>
<nav class="emoji-bar" id="emojiBar" aria-label="Emoji filters"></nav>
<p id="offline-status" class="offline-status">K2 Games hub loaded. Emoji sorter filters by the actual displayed app icon.</p>
<div class="grid" id="grid"></div><footer><p>&copy; 2026 K2 Games. Personal arcade hub.</p></footer>
</div>
<script src="./games.js"></script>
<script>
(()=>{
let games=Array.isArray(window.K2_GAMES)?[...window.K2_GAMES]:[];
const required=[
{f:'flight-controller.html',t:'Sky Courier',i:'✈️',p:'Airline routes and passenger loads',c:'2026-07-27T00:00:00-06:00',u:'2026-07-27T00:00:00-06:00',cl:false},
{f:'rim-rush-dunk.html',t:'Rim Rush Dunk',i:'🏀',p:'Arcade dunk physics',c:'2026-07-27T00:00:00-06:00',u:'2026-07-27T00:00:00-06:00',cl:false},
{f:'scrub-squad.html',t:'Scrub Squad',i:'🏥',p:'Hospital hallway staff roles',c:'2026-07-26T23:30:00-06:00',u:'2026-07-26T23:30:00-06:00',cl:false},
{f:'go-fast.html',t:'Go Fast',i:'🏎️',p:'Top-down race track',c:'2026-07-26T23:30:00-06:00',u:'2026-07-26T23:30:00-06:00',cl:false},
{f:'soccer-8bit.html',t:'Stadium Striker',i:'⚽',p:'Soccer match: 1 goal = 1 point',c:'2026-07-26T23:00:00-06:00',u:'2026-07-26T23:00:00-06:00',cl:true},
{f:'charge.html',t:'Rhino Rampage',i:'🦏',p:'Responsive rhino runner',c:'2026-07-26T23:00:00-06:00',u:'2026-07-26T23:00:00-06:00',cl:false},
{f:'jet-ski.html',t:'Wave Rush',i:'🌊',p:'Jet-ski dodge racer',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'peak-freak.html',t:'Peak Freak',i:'🧗',p:'Rock climbing race',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'super-smash-brawl.html',t:'Super Smash Brawl',i:'🥊',p:'Arena fighter',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'paddle-clash.html',t:'Pong',i:'🏓',p:'Pong board variants',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:true},
{f:'mad-lips.html',t:'Mad Lips',i:'📝',p:'Silly fill-in stories',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'bubble-block.html',t:'Jezzball',i:'🟦',p:'Zone-capture arcade',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:true},
{f:'sinkhole.html',t:'Sinkhole Master',i:'🕳️',p:'City swallowing arcade',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:false},
{f:'quack-quest.html',t:'Quack Quest',i:'🦆',p:'Duck mission chaos',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:false},
{f:'minigolf.html',t:'Mini Golf',i:'⛳',p:'Classic putting course',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:false},
{f:'billiards.html',t:'Billiards',i:'🎱',p:'Arcade pool table',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:true}
];
for(const g of required.slice().reverse()){const existing=games.find(x=>x.f===g.f);if(existing)Object.assign(existing,g);else games.unshift(g)}
const generic=new Set(['🎮','🏆','🌿','⚔️','🏙️','🍔','🃏','🎲']);
const titleOverrides={'flight-controller.html':'Sky Courier','rim-rush-dunk.html':'Rim Rush Dunk','bubble-block.html':'Jezzball','mad-lips.html':'Mad Lips','weather-whiz.html':'Weather Whiz','weather-whiz-random.html':'Weather Whiz','cow-tipping-drone.html':'Cow Tipping Drone','court-vision-ai.html':'Court Vision AI','docking-days.html':'Docking Days','memory.html':'Memory','monster-rampage.html':'Monster Rampage','nashball.html':'Nashball','shutthebox.html':'Shut the Box','soccer-8bit.html':'Stadium Striker','charge.html':'Rhino Rampage','scrub-squad.html':'Scrub Squad','go-fast.html':'Go Fast'};
const iconOverrides={'flight-controller.html':'✈️','drone-delivery.html':'🚁','rim-rush-dunk.html':'🏀','scrub-squad.html':'🏥','go-fast.html':'🏎️','scrub-master.html':'🧽','soccer-8bit.html':'⚽','charge.html':'🦏','jet-ski.html':'🌊','peak-freak.html':'🧗','super-smash-brawl.html':'🥊','paddle-clash.html':'🏓','mad-lips.html':'📝','bubble-block.html':'🟦','sinkhole.html':'🕳️','quack-quest.html':'🦆','minigolf.html':'⛳','billiards.html':'🎱','weather-whiz.html':'🌦️','weather-whiz-random.html':'🌦️','tow-and-go.html':'🚙','sound-swap.html':'🔊','mind-trace.html':'🧠','escape-engineers.html':'🚪','phantom-path.html':'👻','floor-is-lava.html':'🌋','drop-zone.html':'🪂','range-ranger.html':'🎯','delivery-dash.html':'📦','tool-trouble.html':'🛠️','quick-draw.html':'🎨','ride-or-fly.html':'🛩️','lasso-legends.html':'🤠','docking-days.html':'⚓','pixel-and-slide.html':'🖼️','mower-mayhem.html':'🚜','cow-tipping-drone.html':'🐄','avalanche-rider.html':'🏂','court-vision-ai.html':'🏀','dino-cart.html':'🦖','stride-surge.html':'🏃','mouse-heist-home.html':'🐁','paintball-arena.html':'🎨','shopping-cart.html':'🛒','bmx-racing.html':'🚲','horse-racing.html':'🐎','playfootball.html':'🏈','fieldgoal.html':'🏈','hockey.html':'🏒','airhockey.html':'🏒','golf.html':'⛳','disc-golf.html':'🥏','ping-pong.html':'🏓','river-run.html':'🛶','slalom.html':'🌊','bobsled.html':'🛷','downhill.html':'🎿','space-shooter.html':'🚀','traffic-control.html':'🚥','rush-hour.html':'🚗','restaurant-tycoon.html':'🍽️','pizzarush.html':'🍕','banana-dash.html':'🍌','snake.html':'🐍','shark-raid.html':'🦈','station-19.html':'🔥','paperboy-8bit.html':'📰','pinball.html':'🕹️','brick-breaker.html':'🧱','block-world.html':'⛏️','minefield-mapper.html':'💣','word-search.html':'🔤','word-master.html':'🔡','sudoku.html':'🔢','tic-tac-toe.html':'❌','mahjong.html':'🀄','chess.html':'♟️','checkers.html':'🔴','blackjack.html':'♠️','war.html':'♠️','slots.html':'🎰','roulette.html':'🎰','craps.html':'🎲','yahtzee.html':'🎲','dicefootball.html':'🎲','dice-fortune.html':'🎲','qwingo.html':'🎲','shutthebox.html':'🎲','push.html':'🃏','rock-paper-scissors.html':'✊','echo-lights.html':'💡','seat-sense.html':'🪑','parking-lot-boss.html':'🅿️'};
const purposeOverrides={'flight-controller.html':'Airline routes and passenger loads','drone-delivery.html':'Drone delivery routes','rim-rush-dunk.html':'Arcade dunk physics','scrub-squad.html':'Hospital hallway staff roles','go-fast.html':'Top-down race track','soccer-8bit.html':'Soccer match: 1 goal = 1 point','charge.html':'Responsive rhino runner','jet-ski.html':'Jet-ski dodge racer','peak-freak.html':'Rock climbing race','super-smash-brawl.html':'Arena fighter','paddle-clash.html':'Pong board variants','mad-lips.html':'Silly fill-in stories','bubble-block.html':'Zone-capture arcade','sinkhole.html':'City swallowing arcade','quack-quest.html':'Duck mission chaos','minigolf.html':'Classic putting course','billiards.html':'Arcade pool table','weather-whiz.html':'Weather learning quiz','weather-whiz-random.html':'Weather learning quiz','rush-hour.html':'Traffic block puzzle','minefield-mapper.html':'Minesweeper logic','space-shooter.html':'Space arcade shooter','station-19.html':'Fire rescue challenge','shutthebox.html':'Dice box classic','roulette.html':'Casino wheel','slots.html':'Slot machine','blackjack.html':'Card table game','war.html':'Card game','sudoku.html':'Number logic puzzle','word-search.html':'Word hunt puzzle','word-master.html':'Word builder','tic-tac-toe.html':'Classic grid duel','mahjong.html':'Tile matching classic','chess.html':'Classic chess','checkers.html':'Classic checkers'};
function clean(file,title){return `${file||''} ${title||''}`.toLowerCase().replace(/[-_]/g,' ')}
function inferIcon(g){if(iconOverrides[g.f])return iconOverrides[g.f];const s=clean(g.f,g.t);if(s.includes('flight')||s.includes('plane')||s.includes('courier')||s.includes('airport'))return'✈️';if(s.includes('dunk')||s.includes('basket')||s.includes('hoop')||s.includes('court'))return'🏀';if(s.includes('hospital')||s.includes('scrub')||s.includes('er'))return'🏥';if(s.includes('fast')||s.includes('race')||s.includes('car'))return'🏎️';if(s.includes('soccer')||s.includes('striker')||s.includes('shootout'))return'⚽';if(s.includes('rhino'))return'🦏';if(s.includes('weather'))return'🌦️';if(s.includes('duck')||s.includes('quack'))return'🦆';if(s.includes('football'))return'🏈';if(s.includes('golf'))return'⛳';if(s.includes('dice')||s.includes('yahtzee')||s.includes('craps')||s.includes('qwingo')||s.includes('shut'))return'🎲';if(s.includes('card')||s.includes('blackjack')||s.includes('war'))return'🃏';if(s.includes('word'))return'🔤';if(s.includes('number')||s.includes('sequence'))return'🔢';if(s.includes('puzzle')||s.includes('logic')||s.includes('pattern'))return'🧩';if(s.includes('space')||s.includes('rocket'))return'🚀';if(s.includes('food')||s.includes('pizza')||s.includes('restaurant'))return'🍽️';return generic.has(g.i)?'🎮':(g.i||'🎮')}
function inferPurpose(g){if(purposeOverrides[g.f])return purposeOverrides[g.f];const s=clean(g.f,g.t);if(s.includes('flight')||s.includes('plane'))return'Flight game';if(s.includes('dunk')||s.includes('basket'))return'Basketball arcade';if(s.includes('race')||s.includes('fast'))return'Racing game';if(s.includes('soccer'))return'Soccer arcade';if(s.includes('scrub')||s.includes('hospital'))return'Hospital staff game';if(s.includes('puzzle'))return'Puzzle challenge';if(s.includes('runner')||s.includes('dash'))return'Arcade runner';if(s.includes('card'))return'Card game';if(s.includes('weather'))return'Weather game';return''}
games=games.map(g=>({...g,t:titleOverrides[g.f]||g.t,i:inferIcon(g),p:g.p||inferPurpose(g)}));
const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter'),sort=document.getElementById('sort'),count=document.getElementById('count'),random=document.getElementById('random-btn'),emojiBar=document.getElementById('emojiBar');let emoji='all';let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('k2-favorites')||'[]'))}catch(e){}
function saveFavs(){try{localStorage.setItem('k2-favorites',JSON.stringify([...favs]))}catch(e){}}
function stamp(d){try{return new Date(d).toLocaleDateString()}catch(e){return''}}
function hay(g){return `${g.t||''} ${g.f||''} ${g.i||''} ${g.p||''} ${(g.tags||[]).join(' ')}`.toLowerCase()}
function filtered(){const q=search.value.trim().toLowerCase();let list=games.filter(g=>(emoji==='all'||g.i===emoji)&&(!q||hay(g).includes(q)));if(filter.value==='classics')list=list.filter(g=>g.cl);if(filter.value==='originals')list=list.filter(g=>!g.cl);if(filter.value==='favorites')list=list.filter(g=>favs.has(g.f));if(sort.value==='alpha')list.sort((a,b)=>a.t.localeCompare(b.t));else if(sort.value==='newest')list.sort((a,b)=>new Date(b.c)-new Date(a.c));else list.sort((a,b)=>new Date(b.u||b.c)-new Date(a.u||a.c));return list}
function renderEmojiBar(){const icons=['all',...Array.from(new Set(games.map(g=>g.i))).slice(0,80)];emojiBar.innerHTML='';icons.forEach(ic=>{const b=document.createElement('button');b.className='emoji-chip'+(emoji===ic?' active':'');b.textContent=ic==='all'?'All':ic;b.title=ic==='all'?'All icons':ic;b.addEventListener('click',()=>{emoji=ic;renderEmojiBar();render()});emojiBar.appendChild(b)})}
function render(){const list=filtered();count.textContent=list.length;grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">No games match that filter.</div>';return}list.forEach((g,idx)=>{const a=document.createElement('a');a.className='card';a.href=g.f;a.innerHTML=`<span class="game-idx">#${idx+1}</span>${g.cl?'<span class="classic-tag">CLASSIC</span>':''}<span class="favorite-toggle ${favs.has(g.f)?'active':''}" title="Favorite">♥</span><span class="icon">${g.i}</span><span class="title">${g.t}</span>${g.p?`<span class="purpose">${g.p}</span>`:''}<span class="date">${stamp(g.u||g.c)}</span>`;a.querySelector('.favorite-toggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();favs.has(g.f)?favs.delete(g.f):favs.add(g.f);saveFavs();render()});grid.appendChild(a)})}
search.addEventListener('input',render);filter.addEventListener('change',render);sort.addEventListener('change',render);random.addEventListener('click',()=>{const list=filtered();if(list.length)location.href=list[Math.floor(Math.random()*list.length)].f});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>document.getElementById('offline-status').textContent='Offline cache ready. Search and emoji sorter include purposes.').catch(()=>{})}renderEmojiBar();render();
})();
</script>
</body>
