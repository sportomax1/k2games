:root{--primary:#6366f1;--accent:#f59e0b;--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#ffffff1a}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;background-image:radial-gradient(at 0 0,#6366f124,transparent 45%),radial-gradient(at 100% 0,#f59e0b14,transparent 35%)}.container{max-width:1400px;margin:auto}header{text-align:center;margin-bottom:2rem}h1{font-size:clamp(2.5rem,7vw,3.8rem);font-weight:950;background:linear-gradient(90deg,#a5b4fc,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:var(--muted);margin-top:.5rem;text-transform:uppercase;letter-spacing:2px;font-weight:700}.controls{max-width:980px;margin:1.3rem auto .9rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}.emoji-bar{max-width:1180px;margin:0 auto 1rem;display:flex;gap:.45rem;overflow:auto;padding:.45rem;border:1px solid var(--border);border-radius:16px;background:#ffffff0a}.emoji-chip{flex:0 0 auto;min-width:42px;padding:.55rem .7rem;border-radius:999px;border:1px solid var(--border);background:#ffffff0d;color:white;font-weight:900;cursor:pointer}.emoji-chip.active{background:var(--accent);color:#111827;border-color:transparent}.offline-status{max-width:980px;margin:0 auto 1rem;padding:.75rem 1rem;border-radius:12px;border:1px solid var(--border);font-size:.9rem;text-align:center;background:#ffffff0d;color:var(--muted)}input,select,button{padding:1rem;border-radius:12px;border:1px solid var(--border);color:white;font:inherit}#search{flex:2;min-width:220px;background:#ffffff0d;outline:none}select{flex:1;min-width:150px;background:var(--surface);cursor:pointer}#random-btn{background:linear-gradient(135deg,var(--accent),#d97706);font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}.card{position:relative;background:var(--surface);border-radius:18px;padding:1.35rem 1rem;text-decoration:none;color:inherit;border:1px solid var(--border);display:flex;min-height:150px;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.2s}.card:hover,.card:focus{transform:translateY(-4px);border-color:var(--primary);background:#2d3748;outline:none}.game-idx{position:absolute;top:10px;left:10px;font-size:.62rem;opacity:.35}.classic-tag{position:absolute;top:10px;right:46px;font-size:.58rem;background:var(--accent);color:#111827;padding:2px 6px;border-radius:4px;font-weight:900}.favorite-toggle{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#0f172ae6;cursor:pointer}.favorite-toggle.active{border-color:#fb7185;color:#fb7185}.icon{font-size:2.35rem;margin-bottom:.62rem}.title{font-size:.88rem;font-weight:850;text-transform:capitalize;line-height:1.15}.purpose{font-size:.68rem;color:var(--muted);margin-top:.38rem;line-height:1.15}.date{font-size:.59rem;color:#64748b;margin-top:.48rem}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem;border:1px dashed var(--border);border-radius:18px}footer{margin-top:4rem;padding:2rem;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:640px){body{padding:1rem}.grid{grid-template-columns:1fr}.card{flex-direction:row;text-align:left;justify-content:flex-start;gap:1rem;min-height:98px}.icon{margin:0;font-size:1.8rem}.date{margin-left:auto}.controls{display:grid;grid-template-columns:1fr}.controls>*{width:100%}.purpose{margin-top:.2rem}}

<body>

<script>

const generic=new Set(['🎮','🏆','🌿','⚔️','🏙️','🍔','🃏','🎲']);
const titleOverrides={'bubble-block.html':'Jezzball','mad-lips.html':'Mad Lips','weather-whiz.html':'Weather Whiz','weather-whiz-random.html':'Weather Whiz','cow-tipping-drone.html':'Cow Tipping Drone','court-vision-ai.html':'Court Vision AI','docking-days.html':'Docking Days','memory.html':'Memory','monster-rampage.html':'Monster Rampage','nashball.html':'Nashball','shutthebox.html':'Shut the Box','soccer-8bit.html':'Stadium Striker','charge.html':'Rhino Rampage'};

l':'🔢','tic-tac-toe.html':'❌','sliding-puzzle.html':'🔀','calendar-puzzle.html':'📅','mahjong.html':'🀄','chess.html':'♟️','checkers.html':'🔴','blackjack.html':'♠️','war.html':'♠️','reversi.html':'⚫','slots.html':'🎰','roulette.html':'🎰','craps.html':'🎲','yahtzee.html':'🎲','dicefootball.html':'🎲','dice-fortune.html':'🎲','risk-roller.html':'🎲','qwingo.html':'🎲','shutthebox.html':'🎲','mexican-train.html':'🁢','push.html':'🃏','pandadice.html':'🐼','rock-paper-scissors.html':'✊','would-you-rather.html':'🤔','echo-lights.html':'💡','seat-sense.html':'🪑','scrub-squad.html':'🧽','scrub-master.html':'🧽','parking-lot-boss.html':'🅿️','paint-wars.html':'🎨','pack-attack.html':'📦','order-quest.html':'📋','overtime-er.html':'🚑','room-rush.html':'🚪','rooftop-rumble.html':'🏙️','roller-coaster.html':'🎢','rock-skip.html':'🪨','road-trip.html':'🚗','redlightgreenlight.html':'🚦','real-life.html':'🎡','turkey-time.html':'🦃','trampoline.html':'🤸','tower-defense-core.html':'🏰','shuffleboard.html':'🥌','shootout.html':'⚽','volleyball.html':'🏐','home-run-derby.html':'⚾','darts.html':'🎯','curling.html':'🥌','bocce-ball.html':'🟢','javelin.html':'🎯','hurdle.html':'🏃','flight-controller.html':'✈️','drone-delivery.html':'🚁','eggscape-runner.html':'🥚','canyonlands-drift.html':'🏜️','coin-jumper.html':'🪙','beer-pong.html':'🥤','cup-stacking.html':'🥤'
};
const purposeOverrides={'soccer-8bit.html':'Soccer match: 1 goal = 1 point','charge.html':'Responsive rhino runner','jet-ski.html':'Jet-ski dodge racer','peak-freak.html':'Rock climbing race','super-smash-brawl.html':'Arena fighter','paddle-clash.html':'Pong board variants','mad-lips.html':'Silly fill-in stories','bubble-block.html':'Zone-capture arcade','sinkhole.html':'City swallowing arcade','quack-quest.html':'Duck mission chaos','minigolf.html':'Classic putting course','billiards.html':'Arcade pool table','weather-whiz.html':'Weather learning quiz','weather-whiz-random.html':'Weather learning quiz','sound-swap.html':'Audio matching game','mind-trace.html':'Memory pattern test','escape-engineers.html':'Escape-room puzzle','phantom-path.html':'Ghost path puzzle','floor-is-lava.html':'Lava platform run','drop-zone.html':'Landing/avoidance game','range-ranger.html':'Target shooting range','rush-hour.html':'Traffic block puzzle','minefield-mapper.html':'Minesweeper logic','space-shooter.html':'Space arcade shooter','tower-defense-core.html':'Tower defense strategy','street-guess.html':'Map/location guessing','station-19.html':'Fire rescue challenge','shutthebox.html':'Dice box classic','roulette.html':'Casino wheel','slots.html':'Slot machine','blackjack.html':'Card table game','war.html':'Card game','push.html':'Push-your-luck cards','sudoku.html':'Number logic puzzle','word-search.html':'Word hunt puzzle','word-master.html':'Word builder','tic-tac-toe.html':'Classic grid duel','reversi.html':'Classic disk strategy','mahjong.html':'Tile matching classic','chess.html':'Classic chess','checkers.html':'Classic checkers'};
function clean(file,title){return `${file||''} ${title||''}`.toLowerCase().replace(/[-_]/g,' ')}
function inferIcon(g){if(iconOverrides[g.f])return iconOverrides[g.f];const s=clean(g.f,g.t);if(s.includes('soccer')||s.includes('striker')||s.includes('shootout'))return'⚽';if(s.includes('rhino'))return'🦏';if(s.includes('weather'))return'🌦️';if(s.includes('duck')||s.includes('mallard')||s.includes('quack'))return'🦆';if(s.includes('basket')||s.includes('hoop')||s.includes('dunk')||s.includes('court'))return'🏀';if(s.includes('football')||s.includes('fieldgoal'))return'🏈';if(s.includes('hockey'))return'🏒';if(s.includes('golf'))return'⛳';if(s.includes('ski')||s.includes('snow')||s.includes('downhill'))return'🎿';if(s.includes('bike')||s.includes('bmx'))return'🚲';if(s.includes('horse'))return'🐎';if(s.includes('craps')||s.includes('yahtzee')||s.includes('dice')||s.includes('shut')||s.includes('qwingo')||s.includes('risk'))return'🎲';if(s.includes('blackjack')||s.includes('war')||s.includes('card')||s.includes('poker'))return'🃏';if(s.includes('word'))return'🔤';if(s.includes('number')||s.includes('sequence'))return'🔢';if(s.includes('puzzle')||s.includes('logic')||s.includes('pattern'))return'🧩';if(s.includes('car')||s.includes('road')||s.includes('traffic'))return'🚗';if(s.includes('space')||s.includes('rocket')||s.includes('orbit'))return'🚀';if(s.includes('fire')||s.includes('station'))return'🔥';if(s.includes('paint'))return'🎨';if(s.includes('restaurant')||s.includes('pizza')||s.includes('food'))return'🍽️';if(s.includes('banana'))return'🍌';if(s.includes('dog')||s.includes('sheepdog'))return'🐕';if(s.includes('panda'))return'🐼';if(s.includes('snake'))return'🐍';if(s.includes('shark'))return'🦈';if(s.includes('city')||s.includes('street')||s.includes('rooftop'))return'🏙️';return generic.has(g.i)?'🎮':(g.i||'🎮')}
function inferPurpose(g){if(purposeOverrides[g.f])return purposeOverrides[g.f];const s=clean(g.f,g.t);if(s.includes('dice')||s.includes('craps')||s.includes('yahtzee'))return'Dice game';if(s.includes('soccer'))return'Soccer arcade';if(s.includes('puzzle'))return'Puzzle challenge';if(s.includes('runner')||s.includes('dash'))return'Arcade runner';if(s.includes('card'))return'Card game';if(s.includes('weather'))return'Weather game';return''}
games=games.map(g=>({ ...g, t:titleOverrides[g.f]||g.t, i:inferIcon(g), p:g.p||inferPurpose(g)}));
const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter'),sort=document.getElementById('sort'),count=document.getElementById('count'),random=document.getElementById('random-btn'),emojiBar=document.getElementById('emojiBar');let emoji='all';let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('k2-favorites')||'[]'))}catch(e){}
function saveFavs(){try{localStorage.setItem('k2-favorites',JSON.stringify([...favs]))}catch(e){}}
function stamp(d){try{return new Date(d).toLocaleDateString()}catch(e){return''}}
function hay(g){return `${g.t||''} ${g.f||''} ${g.i||''} ${g.p||''} ${(g.tags||[]).join(' ')}`.toLowerCase()}
function filtered(){const q=search.value.trim().toLowerCase();let list=games.filter(g=>(emoji==='all'||g.i===emoji)&&(!q||hay(g).includes(q)));if(filter.value==='classics')list=list.filter(g=>g.cl);if(filter.value==='originals')list=list.filter(g=>!g.cl);if(filter.value==='favorites')list=list.filter(g=>favs.has(g.f));if(sort.value==='alpha')list.sort((a,b)=>a.t.localeCompare(b.t));else if(sort.value==='newest')list.sort((a,b)=>new Date(b.c)-new Date(a.c));else list.sort((a,b)=>new Date(b.u||b.c)-new Date(a.u||a.c));return list}
function renderEmoji(){const counts=new Map();for(const g of games)counts.set(g.i,(counts.get(g.i)||0)+1);const top=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,60);emojiBar.innerHTML='';const all=document.createElement('button');all.className='emoji-chip '+(emoji==='all'?'active':'');all.textContent='All';all.title='All icons';all.onclick=()=>{emoji='all';renderEmoji();render()};emojiBar.appendChild(all);for(const [ic,n] of top){const b=document.createElement('button');b.className='emoji-chip '+(emoji===ic?'active':'');b.textContent=ic+' '+n;b.title=`Show ${ic} games`;b.onclick=()=>{emoji=ic;renderEmoji();render()};emojiBar.appendChild(b)}}
function render(){const list=filtered();count.textContent=list.length;grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">No games match that filter.</div>';return}list.forEach((g,idx)=>{const a=document.createElement('a');a.className='card';a.href=g.f;a.innerHTML=`<span class="game-idx">#${idx+1}</span>${g.cl?'<span class="classic-tag">CLASSIC</span>':''}<span class="favorite-toggle ${favs.has(g.f)?'active':''}" title="Favorite">♥</span><span class="icon">${g.i}</span><span class="title">${g.t}</span>${g.p?`<span class="purpose">${g.p}</span>`:''}<span class="date">${stamp(g.u||g.c)}</span>`;a.querySelector('.favorite-toggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();favs.has(g.f)?favs.delete(g.f):favs.add(g.f);saveFavs();render()});grid.appendChild(a)})}
search.addEventListener('input',render);filter.addEventListener('change',render);sort.addEventListener('change',render);random.addEventListener('click',()=>{const list=filtered();if(list.length)location.href=list[Math.floor(Math.random()*list.length)].f});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>document.getElementById('offline-status').textContent='Offline cache ready when supported. Emoji sorter + content-aware icons enabled.').catch(()=>{})}
renderEmoji();render();
})();
