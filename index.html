<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K2 Games</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K2 Games">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./football-mobile.png">
<style>
:root{--primary:#6366f1;--accent:#f59e0b;--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#ffffff1a}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;background-image:radial-gradient(at 0 0,#6366f124,transparent 45%),radial-gradient(at 100% 0,#f59e0b14,transparent 35%)}.container{max-width:1400px;margin:auto}header{text-align:center;margin-bottom:2rem}h1{font-size:clamp(2.5rem,7vw,3.8rem);font-weight:950;background:linear-gradient(90deg,#a5b4fc,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:var(--muted);margin-top:.5rem;text-transform:uppercase;letter-spacing:2px;font-weight:700}.controls{max-width:950px;margin:1.5rem auto 2rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}.offline-status{max-width:950px;margin:0 auto 1rem;padding:.75rem 1rem;border-radius:12px;border:1px solid var(--border);font-size:.9rem;text-align:center;background:#ffffff0d;color:var(--muted)}input,select,button{padding:1rem;border-radius:12px;border:1px solid var(--border);color:white;font:inherit}#search{flex:2;min-width:220px;background:#ffffff0d;outline:none}select{flex:1;min-width:150px;background:var(--surface);cursor:pointer}button{background:linear-gradient(135deg,var(--accent),#d97706);font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:1rem}.card{position:relative;background:var(--surface);border-radius:18px;padding:1.4rem 1rem;text-decoration:none;color:inherit;border:1px solid var(--border);display:flex;min-height:138px;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.2s}.card:hover,.card:focus{transform:translateY(-4px);border-color:var(--primary);background:#2d3748;outline:none}.game-idx{position:absolute;top:10px;left:10px;font-size:.62rem;opacity:.35}.classic-tag{position:absolute;top:10px;right:46px;font-size:.58rem;background:var(--accent);color:#111827;padding:2px 6px;border-radius:4px;font-weight:900}.favorite-toggle{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:#0f172ae6;cursor:pointer}.favorite-toggle.active{border-color:#fb7185;color:#fb7185}.icon{font-size:2.4rem;margin-bottom:.7rem}.title{font-size:.88rem;font-weight:800;text-transform:capitalize;line-height:1.2}.date{font-size:.62rem;color:var(--muted);margin-top:.55rem}footer{margin-top:4rem;padding:2rem;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.85rem}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem;border:1px dashed var(--border);border-radius:18px}@media(max-width:640px){body{padding:1rem}.grid{grid-template-columns:1fr}.card{flex-direction:row;text-align:left;justify-content:flex-start;gap:1rem;min-height:92px}.icon{margin:0;font-size:1.7rem}.date{margin-left:auto}.controls{display:grid;grid-template-columns:1fr}.controls>*{width:100%}}
</style>
</head>
<body>
<div class="container"><header><h1>K2 Games</h1><p class="subtitle"><span id="count">0</span> Legendary Titles</p></header><div class="controls"><input id="search" placeholder="Search games, emoji, icon, file..."><select id="filter"><option value="all">All Titles</option><option value="originals">Originals</option><option value="classics">Classics</option><option value="favorites">Favorites</option></select><select id="sort"><option value="updated">Recently Updated</option><option value="newest">Newest Additions</option><option value="alpha">A-Z</option></select><button id="random-btn">🎲 Random Game</button></div><p id="offline-status" class="offline-status">K2 Games hub loaded. Search supports names, files, and emoji icons now.</p><div class="grid" id="grid"></div><footer><p>&copy; 2026 K2 Games. Personal arcade hub.</p></footer></div>
<script src="./games.js"></script>
<script>
(()=>{let games=Array.isArray(window.K2_GAMES)?[...window.K2_GAMES]:[];const required=[
{f:'jet-ski.html',t:'Wave Rush',i:'🌊',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'peak-freak.html',t:'Peak Freak',i:'🧗',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'super-smash-brawl.html',t:'Super Smash Brawl',i:'🥊',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'paddle-clash.html',t:'Pong',i:'🏓',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:true},
{f:'mad-lips.html',t:'Mad Lips',i:'👄',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:false},
{f:'bubble-block.html',t:'Jezzball',i:'🔵',c:'2026-07-26T22:00:00-06:00',u:'2026-07-26T22:00:00-06:00',cl:true},
{f:'sinkhole.html',t:'Sinkhole Master',i:'🕳️',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:false},
{f:'quack-quest.html',t:'Quack Quest',i:'🦆',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:false},
{f:'minigolf.html',t:'Mini Golf',i:'⛳',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:false},
{f:'billiards.html',t:'Billiards',i:'🎱',c:'2026-07-26T21:00:00-06:00',u:'2026-07-26T21:00:00-06:00',cl:true}
];for(const g of required.reverse()){const existing=games.find(x=>x.f===g.f);if(existing)Object.assign(existing,g);else games.unshift(g)}const iconOverrides={'jet-ski.html':'🌊','peak-freak.html':'🧗','super-smash-brawl.html':'🥊','paddle-clash.html':'🏓','mad-lips.html':'👄','bubble-block.html':'🔵','sinkhole.html':'🕳️','quack-quest.html':'🦆','minigolf.html':'⛳','billiards.html':'🎱','golf.html':'⛳','airhockey.html':'🏒','chess.html':'♟️','checkers.html':'🔴','snake.html':'🐍'};games=games.map(g=>({...g,i:iconOverrides[g.f]||g.i||'🎮'}));const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter'),sort=document.getElementById('sort'),count=document.getElementById('count'),random=document.getElementById('random-btn');let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('k2-favorites')||'[]'))}catch(e){}function saveFavs(){try{localStorage.setItem('k2-favorites',JSON.stringify([...favs]))}catch(e){}}function stamp(d){try{return new Date(d).toLocaleDateString()}catch(e){return''}}function hay(g){return `${g.t||''} ${g.f||''} ${g.i||''} ${(g.tags||[]).join(' ')}`.toLowerCase()}function filtered(){const q=search.value.trim().toLowerCase();let list=games.filter(g=>!q||hay(g).includes(q));if(filter.value==='classics')list=list.filter(g=>g.cl);if(filter.value==='originals')list=list.filter(g=>!g.cl);if(filter.value==='favorites')list=list.filter(g=>favs.has(g.f));if(sort.value==='alpha')list.sort((a,b)=>a.t.localeCompare(b.t));else if(sort.value==='newest')list.sort((a,b)=>new Date(b.c)-new Date(a.c));else list.sort((a,b)=>new Date(b.u||b.c)-new Date(a.u||a.c));return list}function render(){const list=filtered();count.textContent=list.length;grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">No games match that filter.</div>';return}list.forEach((g,idx)=>{const a=document.createElement('a');a.className='card';a.href=g.f;a.innerHTML=`<span class="game-idx">#${idx+1}</span>${g.cl?'<span class="classic-tag">CLASSIC</span>':''}<span class="favorite-toggle ${favs.has(g.f)?'active':''}" title="Favorite">♥</span><span class="icon">${g.i}</span><span class="title">${g.t}</span><span class="date">${stamp(g.u||g.c)}</span>`;a.querySelector('.favorite-toggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();favs.has(g.f)?favs.delete(g.f):favs.add(g.f);saveFavs();render()});grid.appendChild(a)})}search.addEventListener('input',render);filter.addEventListener('change',render);sort.addEventListener('change',render);random.addEventListener('click',()=>{const list=filtered();if(list.length)location.href=list[Math.floor(Math.random()*list.length)].f});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>document.getElementById('offline-status').textContent='Offline cache ready when supported. Search supports names, files, and emoji.').catch(()=>{})}render()})();
</script>
</body>
</html>
