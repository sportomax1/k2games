<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K2 Games</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./football-mobile.png">
<style>
:root{--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#f59e0b;--primary:#6366f1;--border:#ffffff1a}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:2rem 1rem;font-family:Segoe UI,system-ui,sans-serif;background:radial-gradient(at 0 0,#6366f124,transparent 45%),radial-gradient(at 100% 0,#f59e0b14,transparent 35%),var(--bg);color:var(--text)}.container{max-width:1400px;margin:auto}header{text-align:center;margin-bottom:1.6rem}h1{margin:0;font-size:clamp(2.5rem,7vw,3.8rem);font-weight:950;background:linear-gradient(90deg,#a5b4fc,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:var(--muted);font-weight:800;letter-spacing:2px;text-transform:uppercase}.controls{display:grid;grid-template-columns:minmax(220px,2fr) repeat(2,minmax(150px,1fr)) auto;gap:.75rem;margin:1rem auto;max-width:1050px}input,select,button{padding:.95rem;border-radius:12px;border:1px solid var(--border);font:inherit;color:white;background:var(--surface)}button{cursor:pointer;font-weight:800;background:linear-gradient(135deg,var(--accent),#d97706);color:#111827}.status{max-width:1050px;margin:0 auto 1rem;padding:.75rem 1rem;border:1px solid var(--border);border-radius:12px;background:#ffffff0d;color:var(--muted);text-align:center}.emoji-bar{display:flex;gap:.45rem;overflow:auto;margin:0 auto 1rem;padding:.45rem;max-width:1180px;border:1px solid var(--border);border-radius:16px;background:#ffffff0a}.emoji-chip{flex:0 0 auto;min-width:42px;padding:.5rem .7rem;border-radius:999px;background:#ffffff0d;color:white}.emoji-chip.active{background:var(--accent);color:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1rem}.card{position:relative;display:flex;min-height:145px;flex-direction:column;align-items:center;justify-content:center;padding:1.25rem 1rem;border:1px solid var(--border);border-radius:18px;background:var(--surface);color:inherit;text-decoration:none;text-align:center;transition:.2s}.card:hover,.card:focus{transform:translateY(-4px);border-color:var(--primary);background:#2d3748}.idx{position:absolute;top:9px;left:10px;font-size:.62rem;opacity:.35}.fav{position:absolute;top:7px;right:7px;width:32px;height:32px;padding:0;border-radius:50%;background:#0f172ae6;color:white}.fav.active{color:#fb7185}.icon{font-size:2.35rem}.title{margin-top:.55rem;font-size:.9rem;font-weight:850;line-height:1.15}.file{margin-top:.4rem;font-size:.61rem;color:#64748b}.empty{grid-column:1/-1;padding:3rem;text-align:center;color:var(--muted)}footer{margin-top:4rem;padding:2rem;text-align:center;color:var(--muted);border-top:1px solid var(--border)}@media(max-width:760px){body{padding:1rem}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:92px;flex-direction:row;justify-content:flex-start;gap:1rem;text-align:left}.icon{font-size:1.8rem}.title{margin:0}.file{margin-left:auto}}
</style>
</head>
<body>
<div class="container">
<header><h1>K2 Games</h1><p class="subtitle"><span id="count">0</span> Legendary Titles</p></header>
<div class="controls">
<input id="search" placeholder="Search games or filenames…" autocomplete="off">
<select id="filter"><option value="all">All Titles</option><option value="favorites">Favorites</option></select>
<select id="sort"><option value="updated">Catalog Order</option><option value="alpha">A–Z</option></select>
<button id="random">🎲 Random Game</button>
</div>
<nav id="emojiBar" class="emoji-bar" aria-label="Emoji filters"></nav>
<p id="status" class="status">Loading complete repository game list…</p>
<div id="grid" class="grid"></div>
<footer>© 2026 K2 Games. Personal arcade hub.</footer>
</div>
<script src="./games.js"></script>
<script>
(()=>{
'use strict';
const REPO='sportomax1/k2games';
const EXCLUDED=new Set(['index.html','back-it-up.html','rig-master-articulated-precision.html']);
const $=id=>document.getElementById(id);
const titleFromFile=f=>f.replace(/\.html$/i,'').split('-').map(w=>w?`${w[0].toUpperCase()}${w.slice(1)}`:'').join(' ');
const iconFor=(f,t)=>{const s=`${f} ${t}`.toLowerCase();const rules=[[/football|fieldgoal|gridiron/,'🏈'],[/basket|hoop|dunk|rim|court/,'🏀'],[/baseball|plate|slugger/,'⚾'],[/soccer|striker/,'⚽'],[/hockey/,'🏒'],[/golf/,'⛳'],[/surf|wave|river|water|swim|dive|hydro|sail/,'🌊'],[/ski|snow|sled|avalanche|bobsled/,'🏂'],[/race|racing|runner|run|bmx|marble|derby|kart|drift/,'🏁'],[/drone|flight|fly|plane|sky|jet/,'✈️'],[/space|moon|orbit|rocket|galaxy|astro/,'🚀'],[/word|letter|sudoku|maze|memory|puzzle|2048|logic|connect|tile/,'🧩'],[/card|blackjack|poker|war|mahjong|checkers|chess|dice|roulette|slots|craps/,'🃏'],[/food|pizza|burger|fruit|banana|tomato|chef|restaurant/,'🍔'],[/animal|duck|rhino|cow|panda|dog|cat|mouse|frog|snake|jungle|garden/,'🌿'],[/battle|brawl|duel|combat|dungeon|quest|hero|monster|smash|fist|raid/,'⚔️'],[/music|sound|dj|beat/,'🎵'],[/paint|draw|color|pixel|art/,'🎨'],[/hospital|scrub/,'🏥'],[/traffic|drive|truck|delivery|road|parking|tow/,'🚗']];for(const [r,i] of rules)if(r.test(s))return i;return '🎮'};
let games=Array.isArray(window.K2_GAMES)?window.K2_GAMES.map(g=>({...g})):[];
let favorites=new Set(JSON.parse(localStorage.getItem('k2-favorites')||'[]'));
let emoji='all';
function mergeFiles(files){const map=new Map(games.map(g=>[g.f,g]));for(const f of files){if(!map.has(f))map.set(f,{f,t:titleFromFile(f),i:iconFor(f,titleFromFile(f)),c:'',u:'',cl:false});}games=[...map.values()].filter(g=>!EXCLUDED.has(g.f));}
function visible(){const q=$('search').value.trim().toLowerCase();let list=games.filter(g=>{const match=!q||`${g.t} ${g.f} ${g.i}`.toLowerCase().includes(q);const fav=$('filter').value!=='favorites'||favorites.has(g.f);const em=emoji==='all'||g.i===emoji;return match&&fav&&em});if($('sort').value==='alpha')list.sort((a,b)=>a.t.localeCompare(b.t));return list;}
function renderEmoji(){const icons=[...new Set(games.map(g=>g.i))].sort();$('emojiBar').innerHTML=['all',...icons].map(i=>`<button class="emoji-chip ${emoji===i?'active':''}" data-emoji="${i}">${i==='all'?'All':i}</button>`).join('');}
function render(){const list=visible();$('count').textContent=games.length;$('grid').innerHTML=list.length?list.map((g,n)=>`<a class="card" href="./${encodeURIComponent(g.f)}"><span class="idx">${n+1}</span><button class="fav ${favorites.has(g.f)?'active':''}" data-file="${g.f}" aria-label="Favorite ${g.t}">♥</button><span class="icon">${g.i||'🎮'}</span><span class="title">${g.t}</span><span class="file">${g.f}</span></a>`).join(''):'<div class="empty">No matching games.</div>';}
async function discover(){let files=[];try{const r=await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`GitHub API ${r.status}`);const data=await r.json();files=data.tree.filter(x=>x.type==='blob'&&!x.path.includes('/')&&x.path.toLowerCase().endsWith('.html')&&!EXCLUDED.has(x.path)).map(x=>x.path);localStorage.setItem('k2-html-files',JSON.stringify(files));$('status').textContent=`Verified ${files.length} active HTML games directly from GitHub.`;}catch(err){files=JSON.parse(localStorage.getItem('k2-html-files')||'[]');$('status').textContent=files.length?`GitHub check unavailable; using cached list of ${files.length} HTML games.`:`GitHub check unavailable; showing generated catalog only.`;}mergeFiles(files);renderEmoji();render();}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('sort').addEventListener('change',render);$('random').addEventListener('click',()=>{const list=visible();if(list.length)location.href=`./${list[Math.floor(Math.random()*list.length)].f}`});$('emojiBar').addEventListener('click',e=>{const b=e.target.closest('[data-emoji]');if(!b)return;emoji=b.dataset.emoji;renderEmoji();render()});$('grid').addEventListener('click',e=>{const b=e.target.closest('.fav');if(!b)return;e.preventDefault();e.stopPropagation();favorites.has(b.dataset.file)?favorites.delete(b.dataset.file):favorites.add(b.dataset.file);localStorage.setItem('k2-favorites',JSON.stringify([...favorites]));render()});
renderEmoji();render();discover();
})();
</script>
</body>
</html>
