<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K2 Games</title>
<meta name="theme-color" content="#08111f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./football-mobile.png">
<style>
:root{
  --bg:#08111f;
  --panel:#0d1829;
  --panel2:#111f34;
  --text:#f8fafc;
  --muted:#8fa0b8;
  --border:#243551;
  --primary:#7c3aed;
  --primary2:#4f46e5;
  --heart:#fb7185;
  --shadow:0 12px 35px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 0%,rgba(79,70,229,.12),transparent 30%),
    radial-gradient(circle at 90% 5%,rgba(124,58,237,.08),transparent 28%),
    var(--bg);
}
button,input,select{font:inherit}
button,select{cursor:pointer}
.shell{width:min(1460px,100%);margin:0 auto;padding:26px 22px 42px}
.topbar{display:grid;grid-template-columns:auto minmax(260px,1fr) 190px 190px auto;gap:12px;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;margin-right:18px}
.brand-k2{font-size:2rem;font-weight:1000;font-style:italic;letter-spacing:-.1em;background:linear-gradient(135deg,#8b5cf6 8%,#2563eb 52%,#f59e0b 82%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-name{font-size:1.25rem;font-weight:950;font-style:italic;letter-spacing:.04em}
.control{
  height:48px;
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(13,24,41,.88);
  color:var(--text);
  outline:none;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.control:focus{border-color:#6658e8;box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.search-wrap{position:relative}
.search-wrap::before{content:'⌕';position:absolute;left:15px;top:8px;font-size:1.6rem;line-height:1;color:#a9b7cc;pointer-events:none;transform:rotate(-18deg)}
#search{padding:0 16px 0 45px}
select{padding:0 38px 0 14px}
.random{
  height:48px;
  border:1px solid #7c3aed;
  border-radius:12px;
  padding:0 18px;
  font-weight:850;
  color:#ddd6fe;
  background:linear-gradient(135deg,rgba(79,70,229,.2),rgba(124,58,237,.22));
  box-shadow:inset 0 0 20px rgba(124,58,237,.08);
}
.random:hover{background:linear-gradient(135deg,rgba(79,70,229,.3),rgba(124,58,237,.34))}
.library-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 14px}
.count{font-size:.95rem;color:#b7c2d2;font-weight:750}
.result-count{font-size:.78rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{
  position:relative;
  min-width:0;
  border:1px solid var(--border);
  border-radius:17px;
  background:linear-gradient(145deg,rgba(17,31,52,.96),rgba(10,22,38,.96));
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .16s,border-color .16s,background .16s;
}
.card:hover{transform:translateY(-3px);border-color:#4f5f80;background:linear-gradient(145deg,#14243b,#0d1a2c)}
.card-link{display:flex;min-height:224px;padding:24px 18px 18px;flex-direction:column;align-items:center;justify-content:center;color:inherit;text-decoration:none;text-align:center}
.icon{font-size:3.55rem;line-height:1;margin-bottom:14px;filter:drop-shadow(0 8px 13px rgba(0,0,0,.2))}
.title{width:100%;min-height:2.5em;display:flex;align-items:center;justify-content:center;font-size:1.02rem;font-weight:900;line-height:1.2}
.file{width:100%;margin-top:4px;color:#8596af;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:13px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border:1px solid #263a59;border-radius:999px;background:#091526;color:#aebbd0;font-size:.62rem;line-height:1}
.badge strong{color:#e5eaf2;font-weight:800}
.fav{
  position:absolute;z-index:3;top:10px;right:10px;
  display:grid;place-items:center;width:34px;height:34px;padding:0;
  border:0;border-radius:50%;background:transparent;color:#aebbd0;
  font-size:1.25rem;line-height:1;
}
.fav:hover{background:#ffffff0b;color:white}.fav.active{color:var(--heart)}
.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:18px}
footer{padding:34px 4px 0;text-align:center;color:#65758c;font-size:.75rem}
@media(max-width:1100px){
  .topbar{grid-template-columns:auto minmax(220px,1fr) 165px 165px}.random{grid-column:4}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:820px){
  .shell{padding:16px 12px 28px}
  .topbar{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .brand{grid-column:1/-1;margin:0 0 4px}.brand-k2{font-size:1.65rem}.brand-name{font-size:1.05rem}
  .search-wrap{grid-column:1/-1}.control,.random{height:44px}
  .random{display:none}
  .library-head{margin:8px 2px 10px}
  .grid{display:flex;flex-direction:column;gap:8px}
  .card{border-radius:13px;box-shadow:none}
  .card:hover{transform:none}
  .card-link{min-height:84px;padding:10px 48px 10px 10px;display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-areas:'icon title' 'icon file' 'icon badges';column-gap:11px;align-items:center;text-align:left}
  .icon{grid-area:icon;font-size:2.35rem;margin:0;text-align:center}
  .title{grid-area:title;display:block;min-height:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file{grid-area:file;margin:0;font-size:.64rem}
  .badges{grid-area:badges;justify-content:flex-start;gap:4px;margin:4px 0 0}
  .badge{padding:4px 6px;font-size:.57rem}
  .fav{top:50%;right:10px;transform:translateY(-50%);width:32px;height:32px;background:linear-gradient(135deg,var(--primary2),var(--primary));color:white;font-size:0}
  .fav::after{content:'›';font-size:1.6rem;font-weight:500;line-height:1;transform:translateY(-1px)}
  .fav.active{color:white;box-shadow:0 0 0 2px var(--heart) inset}
  footer{display:none}
}
@media(max-width:430px){
  .shell{padding-left:9px;padding-right:9px}
  select{padding-left:10px;font-size:.8rem}
  .result-count{display:none}
  .badge{font-size:.54rem}
}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="brand" aria-label="K2 Games">
      <span class="brand-k2">K2</span><span class="brand-name">GAMES</span>
    </div>
    <div class="search-wrap"><input id="search" class="control" placeholder="Search games, filenames, or emojis…" autocomplete="off" aria-label="Search games"></div>
    <select id="filter" class="control" aria-label="Filter games"></select>
    <select id="sort" class="control" aria-label="Sort games">
      <option value="updated">Recently Updated</option>
      <option value="created">Newest Created</option>
      <option value="alpha">A–Z</option>
    </select>
    <button id="random" class="random" type="button">⤨&nbsp; Random</button>
  </div>

  <div class="library-head">
    <div id="count" class="count">0 games</div>
    <div id="resultCount" class="result-count"></div>
  </div>

  <section id="grid" class="grid" aria-live="polite"></section>
  <footer>© 2026 K2 Games</footer>
</main>

<script src="./games.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const games=Array.isArray(window.K2_GAMES)?window.K2_GAMES.map(g=>({...g})):[];
let favorites=new Set(JSON.parse(localStorage.getItem('k2-favorites')||'[]'));

const dateValue=v=>{const n=Date.parse(v||'');return Number.isFinite(n)?n:0};
const shortDate=v=>{const n=dateValue(v);return n?new Date(n).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'}):'Unknown'};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeFile=f=>encodeURIComponent(String(f||''));

function buildFilter(){
  const icons=[...new Set(games.map(g=>g.i||'🎮'))].sort();
  $('filter').innerHTML=[
    '<option value="all">All Games</option>',
    '<option value="favorites">♥ Favorites</option>',
    ...icons.map(i=>`<option value="emoji:${escapeHtml(i)}">${escapeHtml(i)} Games</option>`)
  ].join('');
}

function visible(){
  const q=$('search').value.trim().toLowerCase();
  const filter=$('filter').value;
  let list=games.filter(g=>{
    const searchable=`${g.t||''} ${g.f||''} ${g.i||''}`.toLowerCase();
    if(q&&!searchable.includes(q))return false;
    if(filter==='favorites'&&!favorites.has(g.f))return false;
    if(filter.startsWith('emoji:')&&(g.i||'🎮')!==filter.slice(6))return false;
    return true;
  });
  switch($('sort').value){
    case 'alpha': list.sort((a,b)=>(a.t||'').localeCompare(b.t||'')); break;
    case 'created': list.sort((a,b)=>dateValue(b.c)-dateValue(a.c)||(a.t||'').localeCompare(b.t||'')); break;
    default: list.sort((a,b)=>dateValue(b.u)-dateValue(a.u)||(a.t||'').localeCompare(b.t||''));
  }
  return list;
}

function render(){
  const list=visible();
  $('count').textContent=`${games.length} games`;
  $('resultCount').textContent=list.length===games.length?'':`${list.length} shown`;
  $('grid').innerHTML=list.length?list.map(g=>{
    const title=escapeHtml(g.t||g.f||'Untitled Game');
    const file=escapeHtml(g.f||'');
    const icon=escapeHtml(g.i||'🎮');
    return `<article class="card">
      <a class="card-link" href="./${safeFile(g.f)}" aria-label="Play ${title}">
        <span class="icon">${icon}</span>
        <span class="title">${title}</span>
        <span class="file">${file}</span>
        <span class="badges">
          <span class="badge"><strong>Created</strong> ${shortDate(g.c)}</span>
          <span class="badge"><strong>Updated</strong> ${shortDate(g.u)}</span>
        </span>
      </a>
      <button class="fav ${favorites.has(g.f)?'active':''}" type="button" data-file="${file}" aria-label="${favorites.has(g.f)?'Remove from':'Add to'} favorites: ${title}">♡</button>
    </article>`;
  }).join(''):'<div class="empty">No matching games.</div>';
}

$('search').addEventListener('input',render);
$('filter').addEventListener('change',render);
$('sort').addEventListener('change',render);
$('random').addEventListener('click',()=>{const list=visible();if(list.length)location.href=`./${safeFile(list[Math.floor(Math.random()*list.length)].f)}`});
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('.fav');
  if(!b)return;
  e.preventDefault();
  e.stopPropagation();
  const file=b.dataset.file;
  favorites.has(file)?favorites.delete(file):favorites.add(file);
  localStorage.setItem('k2-favorites',JSON.stringify([...favorites]));
  render();
});

buildFilter();
render();
})();
</script>
</body>
</html>
