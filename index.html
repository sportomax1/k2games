function cleanWords(file,title){return `${file||''} ${title||''}`.toLowerCase().replace(/[-_]/g,' ')}
function inferIcon(g){const s=cleanWords(g.f,g.t);for(const [k,v] of Object.entries(iconOverrides))if(g.f===k)return v;if(s.includes('weather'))return'🌦️';if(s.includes('duck')||s.includes('mallard')||s.includes('quack'))return'🦆';if(s.includes('basket')||s.includes('hoop')||s.includes('dunk')||s.includes('court'))return'🏀';if(s.includes('football')||s.includes('fieldgoal'))return'🏈';if(s.includes('soccer')||s.includes('shootout'))return'⚽';if(s.includes('hockey'))return'🏒';if(s.includes('golf'))return'⛳';if(s.includes('ski')||s.includes('snow')||s.includes('downhill'))return'🎿';if(s.includes('bike')||s.includes('bmx'))return'🚲';if(s.includes('horse'))return'🐎';if(s.includes('dice')||s.includes('yahtzee')||s.includes('craps')||s.includes('qwingo'))return'🎲';if(s.includes('card')||s.includes('blackjack')||s.includes('war'))return'🃏';if(s.includes('word'))return'🔤';if(s.includes('number')||s.includes('sequence'))return'🔢';if(s.includes('puzzle')||s.includes('logic')||s.includes('pattern'))return'🧩';if(s.includes('car')||s.includes('road')||s.includes('traffic'))return'🚗';if(s.includes('space')||s.includes('rocket')||s.includes('orbit'))return'🚀';if(s.includes('fire')||s.includes('station'))return'🔥';if(s.includes('paint'))return'🎨';if(s.includes('restaurant')||s.includes('pizza')||s.includes('food'))return'🍽️';if(s.includes('banana'))return'🍌';if(s.includes('dog')||s.includes('sheepdog'))return'🐕';if(s.includes('panda'))return'🐼';if(s.includes('snake'))return'🐍';if(s.includes('shark'))return'🦈';if(s.includes('city')||s.includes('street')||s.includes('rooftop'))return'🏙️';return generic.has(g.i)?'🎲':(g.i||'🎮')}
function inferPurpose(g){if(purposeOverrides[g.f])return purposeOverrides[g.f];const s=cleanWords(g.f,g.t);if(s.includes('weather'))return'Weather learning game';if(s.includes('puzzle')||s.includes('logic')||s.includes('riddle'))return'Logic puzzle';if(s.includes('word'))return'Word puzzle';if(s.includes('race')||s.includes('racing')||s.includes('runner')||s.includes('dash'))return'Arcade racer';if(s.includes('shooter')||s.includes('shootout'))return'Shooting arcade';if(s.includes('tycoon'))return'Management sim';if(s.includes('defense'))return'Strategy defense';if(s.includes('card')||s.includes('blackjack')||s.includes('war'))return'Card game';if(s.includes('dice')||s.includes('craps')||s.includes('yahtzee'))return'Dice game';if(s.includes('golf')||s.includes('pong')||s.includes('hockey')||s.includes('football')||s.includes('soccer'))return'Sports arcade';if(s.includes('escape'))return'Escape challenge';return'Arcade game'}
games=games.map(g=>{const copy={...g};if(titleOverrides[copy.f])copy.t=titleOverrides[copy.f];copy.i=inferIcon(copy);copy.p=copy.p||inferPurpose(copy);return copy});
const grid=document.getElementById('grid'),search=document.getElementById('search'),filter=document.getElementById('filter'),sort=document.getElementById('sort'),count=document.getElementById('count'),random=document.getElementById('random-btn');let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('k2-favorites')||'[]'))}catch(e){}function saveFavs(){try{localStorage.setItem('k2-favorites',JSON.stringify([...favs]))}catch(e){}}function stamp(d){try{return new Date(d).toLocaleDateString()}catch(e){return''}}function hay(g){return `${g.t||''} ${g.f||''} ${g.i||''} ${g.p||''} ${(g.tags||[]).join(' ')}`.toLowerCase()}function filtered(){const q=search.value.trim().toLowerCase();let list=games.filter(g=>!q||hay(g).includes(q));if(filter.value==='classics')list=list.filter(g=>g.cl);if(filter.value==='originals')list=list.filter(g=>!g.cl);if(filter.value==='favorites')list=list.filter(g=>favs.has(g.f));if(sort.value==='alpha')list.sort((a,b)=>a.t.localeCompare(b.t));else if(sort.value==='newest')list.sort((a,b)=>new Date(b.c)-new Date(a.c));else list.sort((a,b)=>new Date(b.u||b.c)-new Date(a.u||a.c));return list}function render(){const list=filtered();count.textContent=list.length;grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">No games match that filter.</div>';return}list.forEach((g,idx)=>{const a=document.createElement('a');a.className='card';a.href=g.f;a.innerHTML=`<span class="game-idx">#${idx+1}</span>${g.cl?'<span class="classic-tag">CLASSIC</span>':''}<span class="favorite-toggle ${favs.has(g.f)?'active':''}" title="Favorite">♥</span><span class="icon">${g.i}</span><span class="title">${g.t}</span><span class="purpose">${g.p||''}</span><span class="date">${stamp(g.u||g.c)}</span>`;a.querySelector('.favorite-toggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();favs.has(g.f)?favs.delete(g.f):favs.add(g.f);saveFavs();render()});grid.appendChild(a)})}search.addEventListener('input',render);filter.addEventListener('change',render);sort.addEventListener('change',render);random.addEventListener('click',()=>{const list=filtered();if(list.length)location.href=list[Math.floor(Math.random()*list.length)].f});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>document.getElementById('offline-status').textContent='Offline cache ready when supported. Icons, names, purposes, and emoji are searchable.').catch(()=>{})}render()})();
